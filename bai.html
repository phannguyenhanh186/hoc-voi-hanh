<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <div id="account-widget-slot"></div>
        </div>
      </nav>
    </div>
  </header>

  <div class="page-back-bar wrap">
    <a class="back-link" id="back-link" href="lessons.html">← Quay lại</a>
  </div>

  <main class="wrap">
    <div class="lesson-head">
      <h1 id="title">Đang tải…</h1>
    </div>
    <section class="tab-panel" id="panel"></section>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <div class="bai-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lesson-shared.js"></script>
  <script>
    // ========================================================
    // bai.html — bài học kiểu "slide dạy học"
    // Dữ liệu: <level>/bai/<id>.json  (xem _guide trong file JSON)
    // Khung: sidebar trái = các section (giống Grammar v2), nội dung bên phải.
    // ========================================================
    const params = new URLSearchParams(location.search);
    const itemId = params.get('id') || 'b1';
    const level = params.get('level') || 'mam';
    const SAFE_ID = /^[a-z0-9_-]+$/i;

    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $toast = document.getElementById('toast');
    document.getElementById('back-link').href = 'lessons.html?level=' + encodeURIComponent(level);

    // ---------- Thông báo nhỏ (dùng khi chưa có file audio) ----------
    let toastTimer = null;
    function toast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 2200);
    }

    // ---------- Audio: tên file theo kiểu Telex ----------
    // ă→aw  â→aa  đ→dd  ê→ee  ô→oo  ơ→ow  ư→uw ; các chữ khác giữ nguyên.
    // Ví dụ: "đi" → ddi, "bơ" → bow, "tư" → tuw.
    // Có thanh điệu thì thêm chữ Telex ở CUỐI âm tiết: sắc=s huyền=f hỏi=r ngã=x nặng=j.
    // Ví dụ: "bố" → boos, "phở" → phowr, "đã" → ddax, "mẹ" → mej. Không dấu thì như cũ.
    const TONE_MARK = { '\u0301': 's', '\u0300': 'f', '\u0309': 'r', '\u0303': 'x', '\u0323': 'j' };
    function audioKey(text) {
      let out = '', tone = '';
      String(text).normalize('NFD').toLowerCase().split('').forEach(function (ch) {
        if (TONE_MARK[ch]) tone = TONE_MARK[ch];
        else if (ch === '\u0306' || ch === '\u031B') out += 'w';            // ă, ơ, ư
        else if (ch === '\u0302') out += out.charAt(out.length - 1);          // â, ê, ô
        else if (ch === '\u0111') out += 'dd';                                 // đ
        else out += ch;
      });
      return out + tone;
    }
    function audioSrc(template, text) {
      if (!template) return '';
      return resolveAudio(template.replace('{key}', audioKey(text)));
    }

    // File audio chưa có → trình phát báo lỗi → hiện thông báo thay vì im lặng.
    player.addEventListener('error', function () {
      if (!currentEl) return;
      currentEl.classList.remove('playing');
      toast('Chưa có audio cho “' + (currentEl.dataset.text || '') + '”');
    });

    function makeChip(text, template, extraClass) {
      const b = el('button', 'bai-chip' + (extraClass ? ' ' + extraClass : ''), text);
      b.type = 'button';
      b.dataset.text = text;
      b.setAttribute('aria-label', 'Nghe “' + text + '”');
      b.addEventListener('click', function () {
        if (template) play(audioSrc(template, text), b);
      });
      return b;
    }

    // ---------- Các dạng bài tập ----------
    function exerciseHead(ex, n) {
      const wrap = el('div');
      if (!ex.noNum || ex.instructionVi) {
        const h = el('h3', 'bai-ex-head');
        if (!ex.noNum) h.appendChild(el('span', 'bai-ex-num', String(n)));
        h.appendChild(el('span', 'bai-ex-vi', ex.instructionVi || ''));
        wrap.appendChild(h);
      }
      if (ex.instructionEn) wrap.appendChild(el('p', 'bai-ex-en', ex.instructionEn));
      return wrap;
    }

    function renderLetters(ex) {
      const grid = el('div', 'bai-letters');
      (ex.rows || []).forEach(function (row) {
        row.forEach(function (ch) { grid.appendChild(makeChip(ch, ex.audio)); });
      });
      return grid;
    }

    function renderSounds(ex) {
      if (ex.layout === 'rows') {
        // Mỗi âm một hàng: chip đầu là âm, các chip sau là từ ví dụ; tự xuống dòng nếu hẹp.
        const rowsWrap = el('div', 'bai-sounds-rows');
        let maxN = 1;
        (ex.columns || []).forEach(function (groups) { groups.forEach(function (g) { (g.rows || []).forEach(function (r) { maxN = Math.max(maxN, r.length); }); }); });
        (ex.columns || []).forEach(function (groups) {
          groups.forEach(function (g) {
            const line = el('div', 'bai-sound-line');
            line.style.gridTemplateColumns = 'repeat(' + maxN + ', minmax(0, 1fr))';
            (g.rows || []).forEach(function (row) {
              row.forEach(function (t) { if (t != null) line.appendChild(makeChip(t, ex.audio, 'bai-tone-' + (g.tone || 'violet'))); });
            });
            rowsWrap.appendChild(line);
          });
        });
        return rowsWrap;
      }
      const wrap = el('div', 'bai-sounds');
      (ex.columns || []).forEach(function (groups) {
        const col = el('div', 'bai-sound-col');
        groups.forEach(function (g) {
          (g.rows || []).forEach(function (row) {
            for (let i = 0; i < 3; i++) {
              if (row[i] == null) {
                const gap = el('span'); gap.setAttribute('aria-hidden', 'true');
                col.appendChild(gap);
              } else {
                col.appendChild(makeChip(row[i], ex.audio, 'bai-tone-' + (g.tone || 'violet')));
              }
            }
          });
        });
        wrap.appendChild(col);
      });
      return wrap;
    }

    // Bài 3: nghe & khoanh tròn. Bấm SỐ để nghe (phát âm của đáp án); bấm ô hồng để chọn.
    function renderListenPick(ex) {
      const wrap = el('div', 'bai-pick');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-pick-row');
        const num = makeChip(String(i + 1), ex.audio, 'bai-tone-lav bai-num');
        num.dataset.text = 'câu ' + (i + 1);
        num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));
        num.addEventListener('click', function () { play(audioSrc(ex.audio, item.answer), num); });
        row.appendChild(num);
        (item.options || []).forEach(function (opt) {
          const b = el('button', 'bai-chip bai-tone-pink bai-opt', opt);
          b.type = 'button';
          b.addEventListener('click', function () {
            if (row.classList.contains('solved')) return;
            if (opt === item.answer) {
              b.classList.remove('is-wrong'); b.classList.add('is-correct');
              row.classList.add('solved');
            } else {
              b.classList.add('is-wrong');
            }
          });
          row.appendChild(b);
        });
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Bài 4: bảng thanh điệu. Cột đầu là nhãn thanh, các ô sau bấm để nghe.
    function renderTones(ex) {
      const wrap = el('div', 'bai-tones');
      (ex.rows || []).forEach(function (row) {
        const tone = 'bai-tone-' + (row.tone || 'lav');
        wrap.appendChild(el('div', 'bai-chip bai-label ' + tone, row.label));
        for (let i = 0; i < 4; i++) {
          if (row.words[i] == null) { const gap = el('span'); gap.setAttribute('aria-hidden', 'true'); wrap.appendChild(gap); }
          else wrap.appendChild(makeChip(row.words[i], ex.audio, tone));
        }
      });
      return wrap;
    }

    // Bài 5: nghe tên, điền vào chỗ trống. Bấm SỐ để nghe cả câu.
    function normName(t) { return String(t).normalize('NFC').trim().toLowerCase(); }
    function renderFillNames(ex) {
      const wrap = el('div', 'bai-fill');
      let activeInput = null;
      if (ex.words) {
        const bank = el('div', 'bai-wordbank');
        ex.words.forEach(function (w) {
          const chip = el('button', 'bai-chip bai-tone-lav', w); chip.type = 'button';
          chip.addEventListener('click', function () {
            if (!activeInput) return;
            activeInput.value = w;
            activeInput.dispatchEvent(new Event('input'));
          });
          bank.appendChild(chip);
        });
        wrap.appendChild(bank);
      }
      const rows = [];
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-fill-row');
        const num = el('button', 'bai-chip bai-tone-lav bai-num', String(i + 1));
        num.type = 'button'; num.dataset.text = 'câu ' + (i + 1);
        num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));
        num.addEventListener('click', function () { play(resolveAudio(item.audio), num); });
        row.appendChild(num);

        const line = el('div', 'bai-fill-line');
        line.appendChild(document.createTextNode(item.before || ''));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank'; input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Tên trong câu ' + (i + 1));
        if (ex.words) { input.style.width = '12ch'; input.addEventListener('focus', function () { activeInput = input; }); }
        line.appendChild(input);
        line.appendChild(document.createTextNode(item.after || ''));
        const mark = el('span', 'bai-mark'); line.appendChild(mark);
        row.appendChild(line);
        wrap.appendChild(row);
        rows.push({ item: item, input: input, mark: mark });
      });

      function check() {
        rows.forEach(function (r) {
          const v = normName(r.input.value);
          const ok = v && r.item.answers.some(function (a) { return normName(a) === v; });
          r.mark.textContent = !v ? '' : (ok ? '✓' : '✗');
          r.mark.className = 'bai-mark ' + (!v ? '' : (ok ? 'ok' : 'bad'));
          r.input.classList.toggle('is-correct', !!ok);
          r.input.classList.toggle('is-wrong', !!v && !ok);
        });
      }
      function reveal() {
        rows.forEach(function (r) {
          r.input.value = r.item.answers[0];
          r.mark.textContent = '✓'; r.mark.className = 'bai-mark ok';
          r.input.classList.add('is-correct'); r.input.classList.remove('is-wrong');
        });
      }
      rows.forEach(function (r) {
        r.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
      });
      const bar = el('div', 'bai-fill-actions');
      const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
      const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
      bar.appendChild(bCheck); bar.appendChild(bShow);
      wrap.appendChild(bar);
      return wrap;
    }

    // Nghe và lặp lại các câu (không có chỗ trống). Bấm SỐ để nghe cả câu.
    function renderRepeatSentences(ex) {
      const wrap = el('div', 'bai-fill');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-fill-row');
        const num = el('button', 'bai-chip bai-tone-lav bai-num', String(i + 1));
        num.type = 'button'; num.dataset.text = 'câu ' + (i + 1);
        num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));
        num.addEventListener('click', function () {
          const src = resolveAudio(item.audio || ex.audio);
          if (src) play(src, num);
        });
        row.appendChild(num);
        row.appendChild(el('div', 'bai-fill-line', item.text));
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Nút nghe 1 đoạn audio cho cả bài (dùng cho bài từ vựng có ảnh).
    function makeListenBtn(ex, n) {
      const b = el('button', 'bai-listen', '▶ Nghe');
      b.type = 'button'; b.dataset.text = 'bài ' + n;
      b.setAttribute('aria-label', 'Nghe bài ' + n);
      b.addEventListener('click', function () { play(resolveAudio(ex.audio), b); });
      return b;
    }
    // Ô chữ lớn thay cho hình (dùng khi chưa có ảnh hoặc ảnh không tải được).
    function makeTextTile(text) {
      const t = el('div', 'bai-photo-text', text);
      t.style.cssText = 'display:flex;align-items:center;justify-content:center;width:100%;min-height:130px;aspect-ratio:4/3;font-size:3rem;font-weight:700;border-radius:14px;background:#F1ECFF;color:#4a3d8f;';
      return t;
    }
    function makePhoto(src, alt, fallbackText) {
      const img = document.createElement('img');
      img.src = src; img.alt = alt || ''; img.loading = 'lazy'; img.className = 'bai-photo-img';
      if (fallbackText != null) img.addEventListener('error', function () { if (img.parentNode) img.parentNode.replaceChild(makeTextTile(fallbackText), img); });
      return img;
    }

    // Bài 6: nhìn hình, nghe mọi người nói. Mỗi người có nút nghe riêng.
    // Ảnh + câu có chỗ trống (item.example=true thì hiện đáp án tô đỏ thay vì ô nhập).
    function renderPhotoFill(ex, n) {
      const box = el('div');
      if (ex.audio) box.appendChild(makeListenBtn(ex, n));
      let activeInput = null;
      if (ex.words) {
        // Có 'words': hiện ngân hàng từ phía trên; từ đã dùng ở câu ví dụ thì gạch khung, không chọn được.
        const exItem = (ex.items || []).filter(function (x) { return x.example; })[0];
        const usedWord = exItem && exItem.answers && exItem.answers[0] ? normName(exItem.answers[0][0]) : '';
        const bank = el('div', 'bai-wordbank');
        ex.words.forEach(function (w) {
          const chip = el('button', 'bai-chip bai-tone-lav', w); chip.type = 'button';
          if (normName(w) === usedWord) {
            chip.disabled = true;
            chip.style.textDecoration = 'line-through'; chip.style.opacity = '.55';
            chip.style.outline = '2px solid var(--stroke)'; chip.style.outlineOffset = '2px'; chip.style.cursor = 'default';
          } else {
            chip.addEventListener('click', function () {
              if (!activeInput) return;
              activeInput.value = w;
              activeInput.dispatchEvent(new Event('input'));
            });
          }
          bank.appendChild(chip);
        });
        box.appendChild(bank);
      }
      const grid = el('div', 'bai-photos');
      if (ex.columns) { grid.style.gridTemplateColumns = 'repeat(' + ex.columns + ', minmax(0, 1fr))'; grid.style.maxWidth = (ex.columns * 230) + 'px'; }
      const allCells = [];
      (ex.items || []).forEach(function (it) {
        const fig = el('figure', 'bai-photo');
        const media = el('div', 'bai-photo-media');
        media.appendChild(makePhoto(it.img, it.name));
        if (it.audio || ex.audio) {
          const btn = el('button', 'bai-photo-listen', '▶');
          btn.type = 'button'; btn.dataset.text = it.name;
          btn.setAttribute('aria-label', 'Nghe: ' + it.name);
          btn.addEventListener('click', function () { play(resolveAudio(it.audio || ex.audio), btn); });
          media.appendChild(btn);
        }
        fig.appendChild(media);

        const cap = el('figcaption', 'bai-photo-cap');
        if (it.example) {
          String(it.template).split(/(\{0\})/).forEach(function (part) {
            if (part === '{0}') {
              const ans = (it.answers && it.answers[0] && it.answers[0][0]) || '';
              cap.appendChild(el('span', 'bai-fill-example', ans));
            } else if (part) {
              cap.appendChild(document.createTextNode(part));
            }
          });
        } else {
          const built = buildFillLine(it.template, it.answers || [], it.name);
          const mark = el('span', 'bai-mark');
          built.line.appendChild(mark);
          cap.appendChild(built.line);
          built.cells.forEach(function (c) {
            if (ex.words) { c.input.style.width = '12ch'; c.input.addEventListener('focus', function () { activeInput = c.input; }); }
            allCells.push({ input: c.input, answers: c.answers, mark: mark });
          });
        }
        fig.appendChild(cap);
        grid.appendChild(fig);
      });
      box.appendChild(grid);

      if (allCells.length) {
        function check() {
          allCells.forEach(function (c) {
            const v = normName(c.input.value);
            const ok = v && c.answers.some(function (a) { return normName(a) === v; });
            markCell(c.input, c.mark, !v ? '' : (ok ? 'ok' : 'bad'));
          });
        }
        function reveal() {
          allCells.forEach(function (c) {
            c.input.value = c.answers[0] || '';
            markCell(c.input, c.mark, 'ok');
          });
        }
        allCells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
        box.appendChild(fillCheckBar(allCells, check, reveal));
      }
      return box;
    }

    // Ghi chú ngữ pháp song ngữ (khong tuong tac, chi hien thi).
    // Dung lai style/ham co san cua grammar.html (lesson-shared.js): khung vang
    // '.grammar-callout' cho cau truc, va 'makeToggleSection' cho vi du (bam de mo/thu gon).
    function renderGrammarNote(ex) {
      const wrap = el('div', 'bai-grammar');
      if (ex.title) wrap.appendChild(el('h3', 'bai-grammar-title', ex.title));
      (ex.blocks || []).forEach(function (b) {
        if (b.type === 'heading') {
          const h = el('div', 'bai-grammar-heading' + (b.tone === 'purple' ? ' is-purple' : ''));
          h.appendChild(el('div', 'bai-grammar-heading-vi', b.vi || ''));
          if (b.en) h.appendChild(el('div', 'bai-grammar-heading-en', b.en));
          wrap.appendChild(h);
        } else if (b.type === 'structure') {
          const s = el('div', 'grammar-callout bai-grammar-structure');
          s.appendChild(el('div', 'bai-grammar-structure-vi', b.vi || ''));
          if (b.en) s.appendChild(el('div', 'bai-grammar-structure-en', b.en));
          wrap.appendChild(s);
        } else if (b.type === 'paragraph') {
          const p = el('div', 'bai-grammar-p');
          p.appendChild(el('div', 'bai-grammar-p-vi', b.vi || ''));
          if (b.en) p.appendChild(el('div', 'bai-grammar-p-en', b.en));
          wrap.appendChild(p);
        } else if (b.type === 'table') {
          const t = el('div', 'bai-grammar-table');
          t.style.gridTemplateColumns = 'repeat(' + (b.columns || []).length + ', minmax(0, 1fr))';
          (b.columns || []).forEach(function (c) { t.appendChild(el('div', 'bai-grammar-th', c)); });
          (b.rows || []).forEach(function (r) { r.forEach(function (c) { t.appendChild(el('div', 'bai-grammar-td', c)); }); });
          wrap.appendChild(t);
        } else if (b.type === 'image') {
          const im = document.createElement('img');
          im.src = b.src; im.alt = b.alt || '';
          im.style.cssText = 'display:block;width:100%;max-width:' + (b.maxWidth || 640) + 'px;height:auto;margin:8px 0 16px';
          wrap.appendChild(im);
        } else if (b.type === 'examples') {
          wrap.appendChild(makeToggleSection('Ví dụ / Examples', function () {
            const list = el('div', 'grammar-examples');
            (b.items || []).forEach(function (it) {
              const row = el('div', 'example');
              row.appendChild(el('div', 'ex-vi', it.vi || ''));
              if (it.en) row.appendChild(el('div', 'ex-en', it.en));
              list.appendChild(row);
            });
            return list;
          }));
        }
      });
      return wrap;
    }

    // Bang "danh xung theo cap" (tu xung / xung ho / vi du), khong tuong tac.
    function buildPairCell(items) {
      const cell = el('div', 'bai-pairs-cell');
      (items || []).forEach(function (it) {
        cell.appendChild(el('div', 'bai-pairs-sub bai-tone-' + (it.tone || 'yellow'), it.text));
      });
      return cell;
    }
    function renderPronounPairs(ex) {
      const wrap = el('div', 'bai-pairs');
      if (ex.intro) {
        const intro = el('div', 'bai-pairs-intro');
        intro.appendChild(el('div', 'bai-pairs-intro-vi', ex.intro.vi || ''));
        if (ex.intro.en) intro.appendChild(el('div', 'bai-pairs-intro-en', ex.intro.en));
        wrap.appendChild(intro);
      }
      const table = el('div', 'bai-pairs-table');
      (ex.columns || []).forEach(function (col) {
        const h = el('div', 'bai-pairs-head');
        h.appendChild(el('div', 'bai-pairs-head-vi', col.vi || ''));
        if (col.en) h.appendChild(el('div', 'bai-pairs-head-en', col.en));
        table.appendChild(h);
      });
      (ex.rows || []).forEach(function (row) {
        table.appendChild(buildPairCell(row.self));
        table.appendChild(buildPairCell(row.other));
        const exCell = el('div', 'bai-pairs-cell bai-pairs-example bai-tone-lav');
        (row.examples || []).forEach(function (line) {
          exCell.appendChild(el('div', 'bai-pairs-ex-line', line));
        });
        table.appendChild(exCell);
      });
      wrap.appendChild(table);
      return wrap;
    }

    function renderPhotoVocab(ex, n) {
      const box = el('div');
      const grid = el('div', 'bai-photos');
      if (ex.columns) { grid.style.gridTemplateColumns = 'repeat(' + ex.columns + ', minmax(0, 1fr))'; grid.style.maxWidth = (ex.columns * 210) + 'px'; }
      (ex.items || []).forEach(function (it, i) {
        const fig = el('figure', 'bai-photo');
        const media = el('div', 'bai-photo-media');
        media.appendChild(it.img ? makePhoto(it.img, it.caption, it.big) : makeTextTile(it.big != null ? it.big : it.caption));
        const btn = el('button', 'bai-photo-listen', '▶');
        btn.type = 'button'; btn.dataset.text = it.caption;
        btn.setAttribute('aria-label', 'Nghe: ' + it.caption);
        btn.addEventListener('click', function () { play(resolveAudio(it.audio || ex.audio), btn); });
        media.appendChild(btn);
        fig.appendChild(media);
        const cap = el('figcaption', 'bai-photo-cap');
        const hl = ex.highlight || [];
        String(it.caption).split(' ').forEach(function (w, wi) {   // tô nổi các từ trong ex.highlight (vd. mốt, tư, lăm, lẻ)
          if (wi) cap.appendChild(document.createTextNode(' '));
          if (hl.indexOf(w.toLowerCase()) >= 0) cap.appendChild(el('span', 'bai-hl', w));
          else cap.appendChild(document.createTextNode(w));
        });
        fig.appendChild(cap);
        grid.appendChild(fig);
      });
      box.appendChild(grid);
      return box;
    }

    // Hoàn thành câu theo sơ đồ: ảnh (tuỳ chọn) + ngân hàng từ + câu có chỗ trống.
    // Câu ví dụ (example:true) hiện đáp án tô đỏ, và từ đó bị gạch trong ngân hàng từ.
    function renderBankSentences(ex, n) {
      const box = el('div');
      if (ex.image) {
        const im = document.createElement('img');
        im.src = ex.image; im.alt = ex.imageAlt || '';
        im.style.cssText = 'display:block;width:100%;max-width:' + (ex.imageMaxWidth || 640) + 'px;height:auto;margin:4px 0 18px';
        box.appendChild(im);
      }
      let activeInput = null;
      const exItem = (ex.items || []).filter(function (x) { return x.example; })[0];
      const usedWord = exItem && exItem.answers && exItem.answers[0] ? normName(exItem.answers[0][0]) : '';
      const bank = el('div', 'bai-wordbank');
      (ex.words || []).forEach(function (w) {
        const chip = el('button', 'bai-chip bai-tone-lav', w); chip.type = 'button';
        if (normName(w) === usedWord) {
          chip.disabled = true;
          chip.style.textDecoration = 'line-through'; chip.style.opacity = '.55';
          chip.style.outline = '2px solid var(--stroke)'; chip.style.outlineOffset = '2px'; chip.style.cursor = 'default';
        } else {
          chip.addEventListener('click', function () {
            if (!activeInput) return;
            activeInput.value = w;
            activeInput.dispatchEvent(new Event('input'));
          });
        }
        bank.appendChild(chip);
      });
      box.appendChild(bank);
      const list = el('div', 'bai-fill');
      const cells = [];
      let seq = 0;
      (ex.items || []).forEach(function (it) {
        if (it.example) {
          const line = el('div', 'bai-fill-line');
          line.appendChild(document.createTextNode('Ví dụ\u00A0\u00A0'));
          String(it.template).split(/(\{0\})/).forEach(function (part) {
            if (part === '{0}') line.appendChild(el('span', 'bai-fill-example', (it.answers[0] || [''])[0]));
            else if (part) line.appendChild(document.createTextNode(part));
          });
          list.appendChild(line);
          return;
        }
        seq++;
        const built = buildFillLine(seq + '\u00A0\u00A0' + it.template, it.answers || [], 'Câu ' + seq);
        const mark = el('span', 'bai-mark');
        built.line.appendChild(mark);
        built.cells.forEach(function (c) {
          c.input.style.width = '12ch';
          c.input.addEventListener('focus', function () { activeInput = c.input; });
          cells.push({ input: c.input, answers: c.answers, mark: mark });
        });
        list.appendChild(built.line);
      });
      box.appendChild(list);
      function check() {
        cells.forEach(function (c) {
          const v = normName(c.input.value);
          const ok = v && c.answers.some(function (a) { return normName(a) === v; });
          markCell(c.input, c.mark, !v ? '' : (ok ? 'ok' : 'bad'));
        });
      }
      function reveal() { cells.forEach(function (c) { c.input.value = c.answers[0] || ''; markCell(c.input, c.mark, 'ok'); }); }
      cells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
      box.appendChild(fillCheckBar(cells, check, reveal));
      return box;
    }

    // Bài 7: nghe và đánh số hình theo thứ tự nghe được. Có 'answer' thì mới chấm được.
    function renderPhotoOrder(ex, n) {
      const box = el('div');
      box.appendChild(makeListenBtn(ex, n));
      const grid = el('div', 'bai-photos');
      const cells = [];
      (ex.items || []).forEach(function (it, i) {
        const fig = el('figure', 'bai-photo');
        fig.appendChild(makePhoto(it.img, 'Hình ' + (i + 1)));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-order'; input.maxLength = 1;
        input.inputMode = 'numeric'; input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Số thứ tự hình ' + (i + 1));
        if (it.example != null) { input.value = String(it.example); input.disabled = true; input.classList.add('is-example'); }
        fig.appendChild(input);
        const mark = el('span', 'bai-mark'); fig.appendChild(mark);
        grid.appendChild(fig);
        cells.push({ it: it, input: input, mark: mark });
      });
      box.appendChild(grid);

      const gradable = cells.some(function (c) { return c.it.answer != null; });
      if (gradable) {
        function check() {
          cells.forEach(function (c) {
            if (c.it.answer == null) return;
            const v = c.input.value.trim();
            const ok = v === String(c.it.answer);
            c.mark.textContent = !v ? '' : (ok ? '✓' : '✗');
            c.mark.className = 'bai-mark ' + (!v ? '' : (ok ? 'ok' : 'bad'));
            c.input.classList.toggle('is-correct', !!v && ok);
            c.input.classList.toggle('is-wrong', !!v && !ok);
          });
        }
        function reveal() {
          cells.forEach(function (c) {
            if (c.it.answer == null) return;
            c.input.value = String(c.it.answer);
            c.mark.textContent = '✓'; c.mark.className = 'bai-mark ok';
            c.input.classList.add('is-correct'); c.input.classList.remove('is-wrong');
          });
        }
        cells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
        const bar = el('div', 'bai-fill-actions');
        const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
        const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
        bar.appendChild(bCheck); bar.appendChild(bShow);
        box.appendChild(bar);
      }
      return box;
    }

    // ---------- Dạng dùng chung: điền vào chỗ trống trong 1 dòng, có thể nhiều ô trống ----------
    // template: "Chào {0}. Bạn {1} là gì?" — {n} là ô trống, answers[n] là mảng đáp án chấp nhận.
    function buildFillLine(template, answers, prefix) {
      const line = el('div', 'bai-fill-line');
      let i = 0;
      const cells = [];
      String(template).split(/(\{\d+\})/).forEach(function (part) {
        const m = /^\{(\d+)\}$/.exec(part);
        if (!m) { if (part) line.appendChild(document.createTextNode(part)); return; }
        const idx = Number(m[1]);
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank'; input.autocomplete = 'off';
        input.setAttribute('aria-label', (prefix || 'Ô trống') + ' ' + (idx + 1));
        line.appendChild(input);
        cells.push({ input: input, answers: answers[idx] || [] });
        i++;
      });
      return { line: line, cells: cells };
    }
    function fillCheckBar(allCells, onCheck, onReveal) {
      const bar = el('div', 'bai-fill-actions');
      const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', onCheck);
      const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', onReveal);
      bar.appendChild(bCheck); bar.appendChild(bShow);
      return bar;
    }
    function markCell(input, mark, state) {
      // state: '' empty, 'ok', 'bad'
      mark.textContent = state === 'ok' ? '✓' : state === 'bad' ? '✗' : '';
      mark.className = 'bai-mark ' + (state === 'ok' ? 'ok' : state === 'bad' ? 'bad' : '');
      input.classList.toggle('is-correct', state === 'ok');
      input.classList.toggle('is-wrong', state === 'bad');
    }

    // Bài 8, 10, 13: hội thoại có nhiều chỗ trống. Có thể có 1 audio nghe cả bài (bài 8) hoặc không (bài 10, 13).
    function renderDialogueFill(ex, n) {
      const box = el('div');
      if (ex.audio) box.appendChild(makeListenBtn(ex, n));
      const wrap = el('div', 'bai-dialog');
      const allCells = [];
      (ex.lines || []).forEach(function (ln) {
        const row = el('div', 'bai-dialog-row');
        row.appendChild(el('span', 'bai-dialog-speaker', ln.speaker));
        const built = buildFillLine(ln.template, ln.answers || [], ln.speaker);
        const mark = el('span', 'bai-mark');
        built.line.appendChild(mark);
        row.appendChild(built.line);
        wrap.appendChild(row);
        built.cells.forEach(function (c) { allCells.push({ input: c.input, answers: c.answers, mark: mark, multi: built.cells.length > 1 }); });
      });
      box.appendChild(wrap);
      function marksFor(cell) {
        // mỗi dòng dùng chung 1 ô ✓/✗ cuối dòng nếu chỉ có 1 ô trống, còn nhiều ô thì gộp theo dòng
      }
      function check() {
        // gộp theo từng dòng: đúng khi mọi ô trong dòng đều khớp
        const byMark = new Map();
        allCells.forEach(function (c) { if (!byMark.has(c.mark)) byMark.set(c.mark, []); byMark.get(c.mark).push(c); });
        byMark.forEach(function (cells) {
          let anyFilled = false, allOk = true;
          cells.forEach(function (c) {
            const v = normName(c.input.value);
            if (v) anyFilled = true;
            const ok = v && c.answers.some(function (a) { return normName(a) === v; });
            c.input.classList.toggle('is-correct', !!ok);
            c.input.classList.toggle('is-wrong', !!v && !ok);
            if (!ok) allOk = false;
          });
          const mark = cells[0].mark;
          mark.textContent = !anyFilled ? '' : (allOk ? '✓' : '✗');
          mark.className = 'bai-mark ' + (!anyFilled ? '' : (allOk ? 'ok' : 'bad'));
        });
      }
      function reveal() {
        allCells.forEach(function (c) { c.input.value = c.answers[0] || ''; c.input.classList.add('is-correct'); c.input.classList.remove('is-wrong'); });
        const marks = new Set(allCells.map(function (c) { return c.mark; }));
        marks.forEach(function (m) { m.textContent = '✓'; m.className = 'bai-mark ok'; });
      }
      allCells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
      box.appendChild(fillCheckBar(allCells, check, reveal));
      return box;
    }

    // Bài 9: nghe và chọn câu trả lời đúng (a/b). 'answer' để trống nếu chưa có audio để xác định.
    function renderAudioChoice(ex, n) {
      const wrap = el('div', 'bai-achoice');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-achoice-row');
        const head = el('div', 'bai-achoice-head');
        const num = el('button', 'bai-chip bai-tone-lav bai-num', String(i + 1));
        num.type = 'button'; num.dataset.text = 'câu ' + (i + 1); num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));
        num.addEventListener('click', function () { play(resolveAudio(item.audio || ex.audio), num); });
        head.appendChild(num);
        if (item.text) head.appendChild(el('div', 'bai-achoice-text', item.text));
        row.appendChild(head);
        const opts = el('div', 'bai-achoice-opts');
        (item.options || []).forEach(function (opt, oi) {
          const letter = String.fromCharCode(97 + oi);
          const b = el('button', 'bai-achoice-opt', letter + '.\u00A0\u00A0' + opt);
          b.type = 'button';
          b.addEventListener('click', function () {
            if (row.classList.contains('solved') && item.answer != null) return;
            Array.prototype.forEach.call(opts.children, function (c) { c.classList.remove('is-picked'); });
            b.classList.add('is-picked');
            if (item.answer == null) return;
            if (letter === item.answer) { b.classList.add('is-correct'); row.classList.add('solved'); }
            else b.classList.add('is-wrong');
          });
          opts.appendChild(b);
        });
        row.appendChild(opts);
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Chọn câu đúng (không audio): mỗi item { options:[...], answer:"a" }.
    function renderChooseSentence(ex, n) {
      const wrap = el('div', 'bai-achoice');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-achoice-row');
        const head = el('div', 'bai-achoice-head');
        head.appendChild(el('div', 'bai-achoice-text', String(i + 1) + '.' + (item.prompt ? '\u00A0\u00A0' + item.prompt : '')));
        row.appendChild(head);
        const opts = el('div', 'bai-achoice-opts');
        (item.options || []).forEach(function (opt, oi) {
          const letter = String.fromCharCode(97 + oi);
          const b = el('button', 'bai-achoice-opt', letter + '.\u00A0\u00A0' + opt);
          b.type = 'button';
          b.addEventListener('click', function () {
            if (row.classList.contains('solved')) return;
            if (letter === item.answer) { b.classList.add('is-correct'); row.classList.add('solved'); }
            else b.classList.add('is-wrong');
          });
          opts.appendChild(b);
        });
        row.appendChild(opts);
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Bài 11 (ngữ pháp): ảnh + chỗ trống, có ô từ để bấm điền (anh/chị/cô/chú).
    function renderWordBankFill(ex, n) {
      const box = el('div');
      const bank = el('div', 'bai-wordbank');
      (ex.words || []).forEach(function (w) { bank.appendChild(el('div', 'bai-chip bai-tone-lav', w)); });
      box.appendChild(bank);
      const grid = el('div', 'bai-photos bai-photos-4');
      let activeInput = null;
      const cells = [];
      (ex.items || []).forEach(function (it, i) {
        const fig = el('figure', 'bai-photo');
        fig.appendChild(makePhoto(it.img, it.name));
        const built = buildFillLine((i + 1) + '\u00A0\u00A0Đây là ' + it.template + ' ' + it.name + '.', [it.answers], 'người ' + (i + 1));
        const mark = el('span', 'bai-mark');
        built.line.appendChild(mark);
        fig.appendChild(built.line);
        grid.appendChild(fig);
        const input = built.cells[0].input;
        input.addEventListener('focus', function () { activeInput = input; });
        const answers = Array.isArray(it.answers) ? it.answers : [it.answers];
        cells.push({ input: input, answers: answers, mark: mark });
      });
      box.appendChild(grid);
      Array.prototype.forEach.call(bank.children, function (chip) {
        chip.addEventListener('click', function () {
          if (!activeInput) return;
          activeInput.value = chip.textContent;
          activeInput.dispatchEvent(new Event('input'));
        });
      });
      function check() {
        cells.forEach(function (c) {
          const v = normName(c.input.value);
          const ok = v && c.answers.some(function (a) { return normName(a) === v; });
          markCell(c.input, c.mark, !v ? '' : (ok ? 'ok' : 'bad'));
        });
      }
      function reveal() {
        cells.forEach(function (c) { c.input.value = c.answers[0]; markCell(c.input, c.mark, 'ok'); });
      }
      cells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
      box.appendChild(fillCheckBar(cells, check, reveal));
      return box;
    }

    // Bài 5 (b3): lịch 3 ngày (ảnh hoạt động mỗi ngày) + ngân hàng từ + câu điền chỗ trống.
    // Item có 'distinct: true' (2 ô, đáp án gồm cả 2 thứ tự) thì 2 ô phải khác nhau.
    function renderCalendarFill(ex, n) {
      const box = el('div');
      const cal = el('div', 'bai-cal');
      cal.style.display = 'grid'; cal.style.gap = '12px'; cal.style.maxWidth = '520px'; cal.style.marginBottom = '18px';
      const days = ex.days || [];
      cal.style.gridTemplateColumns = 'repeat(' + Math.max(days.length, 1) + ', minmax(0, 1fr))';
      // Chế độ ma trận (b4 bài 5): hàng dọc = người, hàng ngang = ngày.
      // ex.matrix = {columns:[{date,label,tone}...], rows:[{name,tone,cells:[{img,alt}|null...]}]}
      if (ex.matrix) {
        const mx = ex.matrix, ncol = (mx.columns || []).length;
        cal.className = 'bai-cal bai-cal-matrix';
        cal.style.maxWidth = (ncol < 3 ? '420px' : '600px'); cal.style.gap = '8px';
        cal.style.gridTemplateColumns = 'minmax(64px, .8fr) repeat(' + ncol + ', minmax(0, 1fr))';
        cal.appendChild(el('div'));
        (mx.columns || []).forEach(function (c) {
          const dh = el('div', 'bai-chip bai-tone-' + (c.tone || 'yellow'));
          dh.style.flexDirection = 'column'; dh.style.height = 'auto'; dh.style.minHeight = '54px'; dh.style.padding = '6px'; dh.style.cursor = 'default';
          dh.appendChild(el('div', '', c.title ? c.title : 'Ngày ' + c.date));
          if (c.label) { const t = el('div', '', c.label); t.style.fontSize = '.8rem'; t.style.color = '#dc2626'; t.style.fontWeight = '700'; dh.appendChild(t); }
          cal.appendChild(dh);
        });
        (mx.rows || []).forEach(function (r) {
          const nm = el('div', 'bai-chip bai-tone-' + (r.tone || 'lav'));
          nm.style.flexDirection = 'column'; nm.style.height = 'auto'; nm.style.minHeight = '44px'; nm.style.cursor = 'default';
          nm.appendChild(el('div', '', r.name));
          if (r.label) { const t = el('div', '', r.label); t.style.fontSize = '.8rem'; t.style.color = '#dc2626'; t.style.fontWeight = '700'; nm.appendChild(t); }
          cal.appendChild(nm);
          (r.cells || []).forEach(function (c) {
            const cell = el('div'); cell.style.display = 'flex'; cell.style.alignItems = 'center'; cell.style.justifyContent = 'center';
            if (c && c.img) cell.appendChild(makePhoto(c.img, c.alt));
            else if (c && c.text) { const tc = el('div', 'bai-chip bai-tone-lav', c.text); tc.style.height = 'auto'; tc.style.minHeight = '44px'; tc.style.width = '100%'; tc.style.cursor = 'default'; cell.style.width = '100%'; cell.appendChild(tc); }
            cal.appendChild(cell);
          });
        });
      }
      (ex.matrix ? [] : days).forEach(function (d) {
        const col = el('div'); col.style.display = 'flex'; col.style.flexDirection = 'column'; col.style.gap = '10px';
        const head = el('div', 'bai-chip bai-tone-' + (d.tone || 'yellow'));
        head.style.flexDirection = 'column'; head.style.height = 'auto'; head.style.minHeight = '54px'; head.style.padding = '8px 6px'; head.style.cursor = 'default';
        head.appendChild(el('div', '', 'Ngày ' + d.date));
        if (d.label) { const t = el('div', '', d.label); t.style.fontSize = '.85rem'; t.style.color = '#dc2626'; t.style.fontWeight = '700'; head.appendChild(t); }
        col.appendChild(head);
        (d.imgs || []).forEach(function (im) { col.appendChild(makePhoto(im.img, im.alt)); });
        cal.appendChild(col);
      });
      box.appendChild(cal);

      let activeInput = null;
      const bank = el('div', 'bai-wordbank');
      (ex.words || []).forEach(function (w) {
        const chip = el('button', 'bai-chip bai-tone-lav', w); chip.type = 'button';
        chip.addEventListener('click', function () {
          if (!activeInput) return;
          activeInput.value = w;
          activeInput.dispatchEvent(new Event('input'));
        });
        bank.appendChild(chip);
      });
      box.appendChild(bank);

      const lines = el('div'); lines.style.display = 'grid'; lines.style.gap = '10px';
      const groups = [];
      (ex.items || []).forEach(function (it, i) {
        if (it.example) {
          const exLine = el('div', 'bai-fill-line');
          const parts = it.template.split('{0}');
          exLine.appendChild(document.createTextNode((i + 1) + '\u00A0\u00A0'));
          exLine.appendChild(el('span', 'bai-example', it.answers[0][0]));
          exLine.appendChild(document.createTextNode(parts[1] || ''));
          lines.appendChild(exLine);
          return;
        }
        const built = buildFillLine((i + 1) + '\u00A0\u00A0' + it.template, it.answers || [], 'Câu ' + (i + 1));
        const mark = el('span', 'bai-mark');
        built.line.appendChild(mark);
        lines.appendChild(built.line);
        built.cells.forEach(function (c) {
          c.input.style.width = '10ch';
          c.input.addEventListener('focus', function () { activeInput = c.input; });
        });
        groups.push({ cells: built.cells, mark: mark, distinct: !!it.distinct });
      });
      box.appendChild(lines);

      function check() {
        groups.forEach(function (g) {
          const vals = g.cells.map(function (c) { return normName(c.input.value); });
          const oks = g.cells.map(function (c, k) { return !!vals[k] && c.answers.some(function (a) { return normName(a) === vals[k]; }); });
          if (g.distinct && vals.length > 1 && vals[0] && vals[0] === vals[1]) oks.fill(false);
          g.cells.forEach(function (c, k) { markCell(c.input, g.mark, !vals[k] ? '' : (oks[k] ? 'ok' : 'bad')); });
          const all = oks.every(Boolean), any = vals.some(Boolean);
          g.mark.textContent = !any ? '' : (all ? '✓' : '✗');
          g.mark.className = 'bai-mark ' + (!any ? '' : (all ? 'ok' : 'bad'));
        });
      }
      function reveal() {
        groups.forEach(function (g) {
          g.cells.forEach(function (c) { c.input.value = c.answers[0] || ''; c.input.classList.remove('is-wrong'); c.input.classList.add('is-correct'); });
          g.mark.textContent = '✓'; g.mark.className = 'bai-mark ok';
        });
      }
      groups.forEach(function (g) { g.cells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); }); });
      box.appendChild(fillCheckBar(groups, check, reveal));
      return box;
    }

    // Bài 11 (nói): ảnh + tự giới thiệu tên và nghề — luyện nói tự do, không chấm điểm.
    function renderOpenIntro(ex, n) {
      const grid = el('div', 'bai-photos bai-photos-2');
      (ex.items || []).forEach(function (it, i) {
        const fig = el('figure', 'bai-photo bai-photo-wide');
        fig.appendChild(makePhoto(it.img, it.name));
        if (it.example) {
          const cap = el('div', 'bai-fill-line');
          cap.appendChild(document.createTextNode((i + 1) + '\u00A0\u00A0'));
          cap.appendChild(el('span', 'bai-example', it.example));
          fig.appendChild(cap);
        } else {
          // Dòng 1: "Đây là ___ Name." — dòng 2: "___ Name làm ___."
          const line1 = el('div', 'bai-fill-line');

          line1.appendChild(document.createTextNode(' ' + it.name + '.'));

          p2.type = 'text'; p2.className = 'bai-blank bai-blank-wide'; p2.autocomplete = 'off';
          p2.setAttribute('aria-label', 'Đại từ cho ' + it.name + ' (câu 2)');
          line2.appendChild(p2);

    }

    function buildQATable(t) {
      const wrap = el('div');
      wrap.style.overflowX = 'auto';
      wrap.style.margin = '10px 0 20px';
      const table = document.createElement('table');
      table.className = 'grammar-table';
      // rows: nhãn hàng (vd. tên người); cols: nhãn cột (vd. món ăn/uống); marks[rowVal][colVal] = '✓' | 'x'
      const rowLabels = t.rows || t.people || [];
      const colLabels = t.cols || t.items || [];
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headRow.appendChild(document.createElement('th'));
      colLabels.forEach(function (c) {
        const th = document.createElement('th'); th.textContent = c; th.style.textAlign = 'center';
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      rowLabels.forEach(function (r) {
        const tr = document.createElement('tr');
        const th = document.createElement('td'); th.textContent = r;
        tr.appendChild(th);
        colLabels.forEach(function (c) {
          const td = document.createElement('td');
          td.style.textAlign = 'center';
          const mark = (t.marks && t.marks[r] && t.marks[r][c]) || '';
          td.textContent = mark;
          if (mark === '✓') { td.style.color = '#1E7A43'; td.style.fontWeight = '800'; }
          if (mark === 'x') { td.style.color = '#EB483F'; td.style.fontWeight = '800'; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    // Bài 11 (đọc): đoạn văn/bảng + câu hỏi, chỉ có nút xem đáp án (câu trả lời tự do, không chấm đúng/sai).
    function renderReadingQA(ex, n) {
      const box = el('div');
      if (ex.table) box.appendChild(buildQATable(ex.table));

        if (ex.blankFirst) {
          // Dạng "đặt câu hỏi": số + chỗ trống cùng 1 dòng (sát nhau), gợi ý cách dòng trên 1 khoảng rõ.
          input.setAttribute('aria-label', 'Câu hỏi cho câu ' + num);

          hint.style.margin = '10px 0 20px';

        }
        row.appendChild(el('span', 'bai-qa-q', num + '\u00A0\u00A0' + q.q));
        if (q.example) {

        } else {

    // Bài 12 (viết): chọn từ đúng trong ngoặc. Mỗi item: template có {0},{1}... và blanks[] { options, answer }.
    function renderChooseWord(ex, n) {
      const wrap = el('div', 'bai-choose');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-choose-row');
        if (!ex.noItemNum) row.appendChild(document.createTextNode((i + 1) + '\u00A0\u00A0'));
        let solvedCount = 0;
        const blanks = item.blanks || [];
        const total = blanks.filter(function (b) { return b.options && b.options.length; }).length;
        String(item.template).split(/(\{\d+\})/).forEach(function (part) {
          const m = /^\{(\d+)\}$/.exec(part);
          if (!m) { if (part) row.appendChild(document.createTextNode(part)); return; }
          const blank = blanks[Number(m[1])];
          blank.options.forEach(function (opt, oi) {
            if (oi) row.appendChild(document.createTextNode(' / '));
            const b = el('button', 'bai-chip bai-tone-pink bai-opt', opt);
            b.type = 'button';
            b.addEventListener('click', function () {
              if (b.dataset.solved) return;
              if (opt === blank.answer) { b.classList.add('is-correct'); b.dataset.solved = '1'; solvedCount++; }
              else b.classList.add('is-wrong');
            });
            row.appendChild(b);
          });
        });
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Bài 8 (b3): sắp xếp các từ thành câu hỏi. Bấm từ ở ngân hàng để đưa lên dòng câu, bấm lại để bỏ xuống.
    // item: { words:[...], answers:[câu chấp nhận...], example:true }
    function normSentence(s) {
      return String(s).normalize('NFC').toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function renderWordOrder(ex, n) {
      const box = el('div', 'bai-order-list');
      const rows = [];
      (ex.items || []).forEach(function (it, i) {
        const row = el('div', 'bai-order-row');
        row.appendChild(el('div', 'bai-order-num', it.example ? 'Ví dụ' : String(i + ((ex.items[0] && ex.items[0].example) ? 0 : 1))));
        const body = el('div', 'bai-order-body');
        const answerLine = el('div', 'bai-order-answer');
        const mark = el('span', 'bai-mark');
        const bank = el('div', 'bai-wordbank');
        const chips = [];
        const picked = [];
        function refresh() {
          answerLine.innerHTML = '';
          picked.forEach(function (c) {
            const b = el('button', 'bai-chip bai-tone-pink', c.word); b.type = 'button';
            b.addEventListener('click', function () {
              picked.splice(picked.indexOf(c), 1); c.used = false; refresh();
            });
            answerLine.appendChild(b);
          });
          chips.forEach(function (c) { c.btn.style.visibility = c.used ? 'hidden' : 'visible'; });
          answerLine.classList.remove('is-correct', 'is-wrong');
          mark.textContent = ''; mark.className = 'bai-mark';
        }
        (it.words || []).forEach(function (w) {
          const c = { word: w, used: false };
          c.btn = el('button', 'bai-chip bai-tone-lav', w); c.btn.type = 'button';
          c.btn.addEventListener('click', function () {
            if (c.used) return;
            c.used = true; picked.push(c); refresh();
          });
          chips.push(c); bank.appendChild(c.btn);
        });
        function setAnswer(sentence) {
          picked.length = 0;
          chips.forEach(function (c) { c.used = false; });
          const toks = String(sentence).replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean);
          let k = 0;
          while (k < toks.length) {   // khớp cả chip nhiều chữ (vd. "thứ năm"), ưu tiên chip dài nhất
            let best = null;
            chips.forEach(function (x) {
              if (x.used) return;
              const n = normSentence(x.word).split(' ').length;
              if (normSentence(toks.slice(k, k + n).join(' ')) === normSentence(x.word) && (!best || n > best.n)) best = { c: x, n: n };
            });
            if (best) { best.c.used = true; picked.push(best.c); k += best.n; } else k++;
          }
          refresh();
        }
        const accepted = (it.answers || []).map(normSentence);
        function check() {
          if (!picked.length) return;
          const v = normSentence(picked.map(function (c) { return c.word; }).join(' '));
          const ok = accepted.indexOf(v) !== -1;
          answerLine.classList.toggle('is-correct', ok); answerLine.classList.toggle('is-wrong', !ok);
          mark.textContent = ok ? '✓' : '✗'; mark.className = 'bai-mark ' + (ok ? 'ok' : 'bad');
        }
        function reveal() { setAnswer(it.answers[0]); answerLine.classList.add('is-correct'); mark.textContent = '✓'; mark.className = 'bai-mark ok'; }
        function reset() { picked.length = 0; chips.forEach(function (c) { c.used = false; }); refresh(); }
        body.appendChild(bank);
        answerLine.setAttribute('aria-label', 'Câu bạn sắp xếp');
        const lineWrap = el('div', 'bai-order-linewrap');
        lineWrap.appendChild(answerLine); lineWrap.appendChild(mark);
        body.appendChild(lineWrap);
        if (it.example) {
          setAnswer(it.answers[0]);
          chips.forEach(function (c) { c.btn.disabled = true; });
          answerLine.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          body.appendChild(el('div', 'bai-example', it.answers[0]));
        } else {
          const bar = el('div', 'bai-fill-actions');
          const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
          const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
          const bReset = el('button', 'bai-btn bai-btn-ghost', 'Làm lại'); bReset.type = 'button'; bReset.addEventListener('click', reset);
          bar.appendChild(bCheck); bar.appendChild(bShow); bar.appendChild(bReset);
          body.appendChild(bar);
          rows.push({ reveal: reveal });
        }
        row.appendChild(body);
        box.appendChild(row);
      });
      return box;
    }

    // Bài 9 (b3): viết câu trả lời theo gợi ý. answers dùng {p} = đại từ xưng hô (pronouns[]).
    function renderWriteAnswer(ex, n) {
      const box = el('div', 'bai-write-list');
      let seq = 0;
      (ex.items || []).forEach(function (it, i) {
        const row = el('div', 'bai-write-row');
        const q = el('div', 'bai-write-q');
        if (/\n/.test(it.question || '')) q.style.whiteSpace = 'pre-line';
        if (it.example) {
          q.appendChild(document.createTextNode('Ví dụ\u00A0\u00A0' + it.question));
          row.appendChild(q);
          const sample = el('div', 'bai-fill-line', '\u2192\u00A0' + it.model);
          sample.style.margin = '2px 0 18px';
          row.appendChild(sample);
          box.appendChild(row);
          return;
        }
        seq++;
        if (!it.given) {
          q.appendChild(document.createTextNode(seq + '\u00A0\u00A0' + it.question + ' '));
          if (it.hint) q.appendChild(el('span', 'bai-example', '(' + it.hint + ')'));
          row.appendChild(q);
        }
        const line = el('div', 'bai-fill-line');
        // it.given: bài đảo — ô trống là CÂU HỎI, câu trả lời cho sẵn bên dưới
        line.appendChild(document.createTextNode(it.given ? (seq + '\u00A0\u00A0') : ('→\u00A0' + (it.prefix ? it.prefix + '\u00A0' : ''))));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank bai-blank-full'; input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Câu trả lời ' + (i + 1));
        const mark = el('span', 'bai-mark');
        line.appendChild(input);
        if (it.given || ex.questionMark) line.appendChild(document.createTextNode('?'));
        line.appendChild(mark);
        row.appendChild(line);
        if (it.given) {
          const gl = el('div', 'bai-fill-line', '→\u00A0' + it.given);
          gl.style.marginTop = '4px';
          row.appendChild(gl);
        }
        const accepted = [];
        (it.answers || []).forEach(function (a) {
          (it.pronouns && a.indexOf('{p}') !== -1 ? it.pronouns : [null]).forEach(function (p) {
            const full = p ? a.replace(/\{p\}/g, p) : a;
            accepted.push(normSentence(full));
            if (it.prefix) accepted.push(normSentence(it.prefix + ' ' + full));   // chấp nhận cả khi gõ lại "Có." / "Không."
          });
        });
        const model = it.model || it.answers[0];
        function modelText() {
          const s = (it.pronouns ? model.replace(/\{p\}/g, it.pronouns[0]) : model);
          return s.charAt(0).toUpperCase() + s.slice(1);
        }
        function check() {
          const v = normSentence(input.value);
          markCell(input, mark, !v ? '' : (accepted.indexOf(v) !== -1 ? 'ok' : 'bad'));
        }
        function reveal() { input.value = modelText(); markCell(input, mark, 'ok'); }
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
        input.addEventListener('input', function () { markCell(input, mark, ''); });
        const bar = el('div', 'bai-fill-actions');
        const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
        const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
        bar.appendChild(bCheck); bar.appendChild(bShow);
        row.appendChild(bar);
        box.appendChild(row);
      });
      return box;
    }

    // Bài 10 (b3): bài nói, trả lời mở. Có ví dụ + ô ghi chú tự do (không chấm điểm).

    // Nối câu hỏi với câu trả lời (b4): mỗi câu hỏi chọn chữ cái của câu trả lời phù hợp.
    // ex.questions = [{q, answer:'b'}], ex.options = [{key:'a', text:'...'}]
    function renderMatchPairs(ex) {
      const wrap = el('div', 'bai-match');
      const left = el('div', 'bai-match-left');
      const right = el('div', 'bai-match-right');
      const rows = [];

        (ex.options || []).forEach(function (o) {

        });

      });
      (ex.options || []).forEach(function (o) {

      });

    // Nghe và điền (b6): mỗi câu có audio riêng, có thể nhiều chỗ trống. item.distinct = các ô phải khác nhau.
    function renderAudioFill(ex) {
      const wrap = el('div', 'bai-fill');
      const rows = [];
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-fill-row');
        const num = el('button', 'bai-chip bai-tone-lav bai-num', String(i + 1));
        num.type = 'button'; num.dataset.text = 'câu ' + (i + 1);
        num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));
        if (item.audio || ex.audio) {
          num.addEventListener('click', function () { play(resolveAudio(item.audio || ex.audio), num); });
        } else {
          num.disabled = true; num.style.cursor = 'default';   // bài điền không có audio
        }
        row.appendChild(num);
        const built = buildFillLine(item.template, item.answers || [], 'Câu ' + (i + 1));
        if (ex.blankWidth) built.cells.forEach(function (c) { c.input.style.width = ex.blankWidth; c.input.style.maxWidth = '100%'; });
        const mark = el('span', 'bai-mark'); built.line.appendChild(mark);
        row.appendChild(built.line);
        wrap.appendChild(row);
        rows.push({ item: item, cells: built.cells, mark: mark });
      });
      function nsp(t) { return normName(t).replace(/\s+/g, ''); }   // bỏ khoảng trắng: "1 4 7" = "147"
      function check() {
        rows.forEach(function (r) {
          const vals = r.cells.map(function (c) { return normName(c.input.value); });
          const filled = vals.every(Boolean);
          let ok = filled && r.cells.every(function (c, k) { return c.answers.some(function (a) { return nsp(a) === nsp(vals[k]); }); });
          if (ok && r.item.distinct && new Set(vals).size !== vals.length) ok = false;
          r.cells.forEach(function (c, k) { markCell(c.input, r.mark, ''); c.input.classList.toggle('is-correct', ok); c.input.classList.toggle('is-wrong', filled && !ok); });
          r.mark.textContent = !vals.some(Boolean) ? '' : (ok ? '✓' : '✗');
          r.mark.className = 'bai-mark ' + (!vals.some(Boolean) ? '' : (ok ? 'ok' : 'bad'));
        });
      }
      function reveal() {
        rows.forEach(function (r) {
          r.cells.forEach(function (c, k) { c.input.value = c.answers[0] || ''; c.input.classList.add('is-correct'); c.input.classList.remove('is-wrong'); });
          r.mark.textContent = '✓'; r.mark.className = 'bai-mark ok';
        });
      }
      rows.forEach(function (r) { r.cells.forEach(function (c) { c.input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); }); });
      wrap.appendChild(fillCheckBar(null, check, reveal));
      return wrap;
    }

    const RENDERERS = { letters: renderLetters, sounds: renderSounds, listenPick: renderListenPick, tones: renderTones, fillNames: renderFillNames, fillWords: renderFillNames, repeatSentences: renderRepeatSentences, photoVocab: renderPhotoVocab, bankSentences: renderBankSentences, photoOrder: renderPhotoOrder, photoFill: renderPhotoFill, grammarNote: renderGrammarNote, pronounPairs: renderPronounPairs, dialogueFill: renderDialogueFill, audioChoice: renderAudioChoice, chooseSentence: renderChooseSentence, wordBankFill: renderWordBankFill, openIntro: renderOpenIntro, readingQA: renderReadingQA, chooseWord: renderChooseWord, calendarFill: renderCalendarFill, wordOrder: renderWordOrder, writeAnswer: renderWriteAnswer, openAnswer: renderOpenAnswer, matchPairs: renderMatchPairs, audioFill: renderAudioFill };

    function buildExercise(ex, n) {
      const box = el('div', 'bai-exercise');
      n = ex.num != null ? ex.num : n;   // 'num' trong JSON = số bài in trong sách (vd. 6, 7)
      box.appendChild(exerciseHead(ex, n));
      const fn = RENDERERS[ex.type];
      box.appendChild(fn ? fn(ex, n) : emptyNote('Dạng bài “' + ex.type + '” chưa được hỗ trợ.'));
      if (ex.noteVi) {
        const note = el('div', 'grammar-callout');
        if (ex.noteTitleVi) { const t = el('div', '', ex.noteTitleVi); t.style.fontWeight = '700'; note.appendChild(t); }
        const nv = el('div', '', (ex.noteTitleVi ? '' : 'Ghi chú: ') + ex.noteVi); nv.style.whiteSpace = 'pre-line'; note.appendChild(nv);
        if (ex.noteTitleEn) { const t2 = el('div', 'grammar-note', ex.noteTitleEn); t2.style.fontWeight = '700'; t2.style.marginBottom = '0'; note.appendChild(t2); }
        if (ex.noteEn) { const en = el('div', 'grammar-note', (ex.noteTitleEn ? '' : 'Note: ') + ex.noteEn); en.style.whiteSpace = 'pre-line'; note.appendChild(en); }
        box.appendChild(note);
      }
      return box;
    }

    // Nhiều bài tập → mỗi bài 1 trang, bấm mũi tên (hoặc phím ← →) để chuyển.
    let pagerKeyHandler = null;
    function stopAudio() {
      try { player.pause(); } catch (e) {}
      if (currentEl) currentEl.classList.remove('playing');
    }
    function renderExercises(container, exercises) {
      exercises = exercises || [];
      if (pagerKeyHandler) { document.removeEventListener('keydown', pagerKeyHandler); pagerKeyHandler = null; }
      if (exercises.length <= 1) {
        exercises.forEach(function (ex, i) { container.appendChild(buildExercise(ex, i + 1)); });
        return;
      }
      const stage = el('div', 'bai-stage');
      const pager = el('div', 'bai-pager');
      const prev = el('button', 'bai-arrow', '←'); prev.type = 'button'; prev.setAttribute('aria-label', 'Bài trước');
      const next = el('button', 'bai-arrow', '→'); next.type = 'button'; next.setAttribute('aria-label', 'Bài tiếp theo');
      const count = el('span', 'bai-pager-count');
      pager.appendChild(prev); pager.appendChild(count); pager.appendChild(next);
      container.appendChild(stage);
      container.appendChild(pager);

      let idx = 0;
      function show(i) {
        idx = Math.max(0, Math.min(exercises.length - 1, i));
        stopAudio();
        stage.innerHTML = '';
        stage.appendChild(buildExercise(exercises[idx], idx + 1));
        count.textContent = (idx + 1) + ' / ' + exercises.length;
        prev.disabled = idx === 0;
        next.disabled = idx === exercises.length - 1;
      }
      prev.addEventListener('click', function () { show(idx - 1); });
      next.addEventListener('click', function () { show(idx + 1); });
      pagerKeyHandler = function (e) {
        const t = e.target && e.target.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') show(idx - 1);
        else if (e.key === 'ArrowRight') show(idx + 1);
      };
      document.addEventListener('keydown', pagerKeyHandler);
      show(0);
    }

    // ---------- Khung: sidebar (section → mục con) + nội dung ----------
    function buildLesson(item) {
      const sections = item.sections || [];
      $panel.innerHTML = '';

      const shell = buildSectionShell('', function () { location.href = 'lessons.html?level=' + encodeURIComponent(level); });
      const pill = shell.querySelector('.gram2-tab-pill');
      const topbar = shell.querySelector('.gram2-topbar');
      if (topbar) topbar.remove();   // bỏ ô mũi tên + tên phần (đã có nút Quay lại ở trên)
      $panel.appendChild(shell);

      const body = el('div', 'gram2-body');
      const sidebar = el('aside', 'gram2-sidebar');
      const content = el('div', 'gram2-content');
      body.appendChild(sidebar);
      body.appendChild(content);
      shell.appendChild(body);

      const entries = [];   // { key, section, sub, btn, header, list, chevron }

      function scrollToContentOnMobile() {
        if (!window.matchMedia('(max-width: 720px)').matches) return;
        window.requestAnimationFrame(function () {
          const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 0;
          window.scrollTo({ top: content.getBoundingClientRect().top + window.scrollY - headerH - 12, behavior: 'smooth' });
        });
      }

      function select(entry, opts) {
        entries.forEach(function (e) {
          e.btn && e.btn.classList.toggle('active', e === entry);
          e.isStatic && e.header.classList.toggle('active', e === entry);
        });
        // Mở section chứa mục đang chọn
        if (entry.list && entry.list.classList.contains('gram2-collapsed')) {
          entry.list.classList.remove('gram2-collapsed');
          entry.chevron.textContent = '▾';
        }

        pill.textContent = entry.section.titleVi;
        content.innerHTML = '';
        if (entry.sub) {
          content.appendChild(el('h2', 'gram2-content-title', entry.sub.label));
          if (entry.sub.exercises && entry.sub.exercises.length) renderExercises(content, entry.sub.exercises);
          else content.appendChild(emptyNote('Mục này đang được soạn.'));
        } else {
          content.appendChild(el('h2', 'gram2-content-title', entry.section.titleVi));
          content.appendChild(emptyNote('Phần “' + entry.section.titleVi + '” đang được soạn.'));
        }

        try { history.replaceState(null, '', '#' + entry.key); } catch (e) {}
        if (opts && opts.scroll) scrollToContentOnMobile();
      }

      sections.forEach(function (section, si) {
        const secBox = el('div', 'gram2-section');
        const header = el('button', 'gram2-section-header'); header.type = 'button';
        const titles = el('div', 'gram2-section-titles');
        titles.appendChild(el('div', 'gram2-section-title-vi', (si + 1) + '. ' + section.titleVi));
        if (section.titleEn) titles.appendChild(el('div', 'gram2-section-title-en', section.titleEn));
        header.appendChild(titles);
        const chevron = el('span', 'gram2-chevron', '▾');
        header.appendChild(chevron);
        secBox.appendChild(header);

        const subs = section.subtopics || [];
        if (!subs.length) {
          // Section chưa có mục con: bấm vào tiêu đề là chọn luôn section.
          header.classList.add('is-static');
          const entry = { key: section.id, section: section, sub: null, header: header, isStatic: true };
          entries.push(entry);
          header.addEventListener('click', function () { select(entry, { scroll: true }); });
        } else {
          const list = el('div', 'gram2-subtopic-list');
          subs.forEach(function (sub) {
            const btn = el('button', 'gram2-subtopic-btn', sub.label); btn.type = 'button';
            const entry = { key: section.id + '/' + sub.id, section: section, sub: sub, btn: btn, list: list, chevron: chevron };
            entries.push(entry);
            btn.addEventListener('click', function () { select(entry, { scroll: true }); });
            list.appendChild(btn);
          });
          secBox.appendChild(list);
          // Chỉ mở section đầu tiên lúc đầu; select() sẽ tự mở section chứa mục được chọn.
          if (si !== 0) { list.classList.add('gram2-collapsed'); chevron.textContent = '▸'; }
          header.addEventListener('click', function () {
            const collapsed = list.classList.toggle('gram2-collapsed');
            chevron.textContent = collapsed ? '▸' : '▾';
          });
        }
        sidebar.appendChild(secBox);
      });

      // Mở đúng chỗ đang dạy khi tải lại trang (#phat-am/bang-chu-cai), mặc định mục đầu tiên.
      const wanted = decodeURIComponent(location.hash.replace(/^#/, ''));
      const first = entries.filter(function (e) { return e.key === wanted; })[0]
        || entries.filter(function (e) { return e.sub; })[0]
        || entries[0];
      if (first) select(first);
    }

    // ---------- Load ----------
    (async function () {
      try {
        if (!SAFE_ID.test(itemId) || !SAFE_ID.test(level)) throw new Error('Bad id');
        const res = await fetch(level + '/bai/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();
        document.title = 'Bài ' + item.num + ': ' + item.title + ' — hoc voi hanh';
        $title.textContent = 'Bài ' + item.num + ': ' + item.title;
        buildLesson(item);
      } catch (err) {
        console.error(err);
        $title.textContent = 'Không tải được bài học';
        $panel.innerHTML = '<p class="note">Không tìm thấy file <code>' + level + '/bai/' + itemId + '.json</code>.</p>';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="account-widget.js"></script>
</body>
