    // Luyện nói theo hình: A hỏi "Bạn có biết X là ai không?", B trả lời nghề nghiệp + quốc tịch.
    // Câu example hiện đáp án màu đỏ; các câu còn lại để trống 4 ô (câu hỏi, nghề, đại từ, quốc tịch) + nút xem đáp án.
    function renderPhotoSpeak(ex, n) {
      const grid = el('div', 'bai-photos bai-photos-speak');
      (ex.items || []).forEach(function (it, i) {
        const fig = el('figure', 'bai-photo bai-photo-wide');
        fig.appendChild(makePhoto(it.img, it.name));
        const qFull = 'Bạn có biết ' + it.name + ' là ai không?';
        const aFull = it.name + ' là ' + it.job + '. ' + it.pronoun + ' là người ' + it.country + '.';
        const mkBlank = function (label, cls) {
          const inp = document.createElement('input');
          inp.type = 'text'; inp.className = 'bai-blank ' + (cls || 'bai-blank-wide'); inp.autocomplete = 'off';
          inp.setAttribute('aria-label', label + ' (' + it.name + ')');
          return inp;
        };
        const lineA = el('div', 'bai-fill-line');
        const lineB = el('div', 'bai-fill-line');
        if (it.example) {
          lineA.appendChild(document.createTextNode((i + 1) + '\u00A0\u00A0A: ' + qFull));
          lineB.appendChild(document.createTextNode('B: ' + it.name + ' là '));
          lineB.appendChild(el('span', 'bai-example', it.job));
          lineB.appendChild(document.createTextNode('. ' + it.pronoun + ' là '));
          lineB.appendChild(el('span', 'bai-example', 'người ' + it.country));
          lineB.appendChild(document.createTextNode('.'));
          fig.appendChild(lineA); fig.appendChild(lineB);
        } else {
          lineA.appendChild(document.createTextNode((i + 1) + '\u00A0\u00A0A: '));
          lineA.appendChild(mkBlank('Câu hỏi', 'bai-blank-wide bai-blank-q'));
          lineA.appendChild(document.createTextNode('?'));
          lineB.appendChild(document.createTextNode('B: ' + it.name + ' là '));
          lineB.appendChild(mkBlank('Nghề nghiệp'));
          lineB.appendChild(document.createTextNode('. ' + it.pronoun + ' là '));
          lineB.appendChild(mkBlank('Quốc tịch'));
          lineB.appendChild(document.createTextNode('.'));
          const key = el('details', 'bai-speak-key');
          key.appendChild(el('summary', '', 'Xem đáp án'));
          key.appendChild(el('div', '', 'A: ' + qFull));
          key.appendChild(el('div', '', 'B: ' + aFull));
          fig.appendChild(lineA); fig.appendChild(lineB); fig.appendChild(key);
        }
        grid.appendChild(fig);
      });
      return grid;
    }

    function buildQATable(t) {
      const wrap = el('div');
      wrap.style.overflowX = 'auto';
      wrap.style.margin = '10px 0 20px';
      const table = document.createElement('table');
      table.className = 'grammar-table';
      // rows: nhãn hàng (vd. tên người); cols: nhãn cột (vd. món ăn/uống); marks[rowVal][colVal] = '✓' | 'x'
      const rowLabels = t.rows || t.people || [];
      const colLabels = t.cols || t.items || [];
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headRow.appendChild(document.createElement('th'));
      colLabels.forEach(function (c) {
        const th = document.createElement('th'); th.textContent = c; th.style.textAlign = 'center';
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      rowLabels.forEach(function (r) {
        const tr = document.createElement('tr');
        const th = document.createElement('td'); th.textContent = r;
        tr.appendChild(th);
        colLabels.forEach(function (c) {
          const td = document.createElement('td');
          td.style.textAlign = 'center';
          const mark = (t.marks && t.marks[r] && t.marks[r][c]) || '';
          td.textContent = mark;
          if (mark === '✓') { td.style.color = '#1E7A43'; td.style.fontWeight = '800'; }
          if (mark === 'x') { td.style.color = '#EB483F'; td.style.fontWeight = '800'; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    // Bài 11 (đọc): đoạn văn/bảng + câu hỏi, chỉ có nút xem đáp án (câu trả lời tự do, không chấm đúng/sai).
    function renderReadingQA(ex, n) {
      const box = el('div');
      if (ex.table) box.appendChild(buildQATable(ex.table));
      if (ex.passage) { const ps = el('p', 'bai-passage', ex.passage); ps.style.whiteSpace = 'pre-line'; box.appendChild(ps); }
      const rows = [];
      (ex.questions || []).forEach(function (q, i) {
        const num = (q.num != null) ? q.num : (i + 1);
        const row = el('div', 'bai-fill-row bai-qa-row');
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank bai-blank-full'; input.autocomplete = 'off';
        if (ex.blankFirst && q.example) {   // câu ví dụ: hiện sẵn câu hỏi mẫu (tô đỏ) + câu trả lời gợi ý, không có ô nhập
          const exLine = el('div', 'bai-fill-line');
          exLine.appendChild(document.createTextNode('Ví dụ:\u00A0\u00A0'));
          exLine.appendChild(el('span', 'bai-fill-example', q.a));
          exLine.style.margin = '0 0 6px';
          box.appendChild(exLine);
          const exHint = el('div', 'bai-fill-line', q.q);
          exHint.style.margin = '0 0 20px';
          box.appendChild(exHint);
          return;
        }
        if (ex.blankFirst) {
          // Dạng "đặt câu hỏi": số + chỗ trống cùng 1 dòng (sát nhau), gợi ý cách dòng trên 1 khoảng rõ.
          input.setAttribute('aria-label', 'Câu hỏi cho câu ' + num);
          const line = el('div', 'bai-fill-row');
          line.style.gridTemplateColumns = '24px 1fr';
          line.style.columnGap = '8px';
          const numSpan = el('span', 'bai-qa-q', String(num));
          numSpan.style.marginBottom = '0';
          line.appendChild(numSpan);
          line.appendChild(input);
          box.appendChild(line);
          const hint = el('div', 'bai-fill-line', q.q);
          hint.style.margin = '10px 0 20px';
          box.appendChild(hint);
          rows.push({ input: input, answer: q.a });
          return;
        }
        row.appendChild(el('span', 'bai-qa-q', num + '\u00A0\u00A0' + q.q));
        if (q.example) {
          const sample = el('div', 'bai-fill-line', '\u2192\u00A0' + q.a);
          sample.style.margin = '2px 0 14px';
          row.appendChild(sample);
        } else {
          input.setAttribute('aria-label', 'Trả lời câu ' + num);
          row.appendChild(input);
          rows.push({ input: input, answer: q.a });
        }
        box.appendChild(row);
      });
      const bar = el('div', 'bai-fill-actions');
      const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án gợi ý'); bShow.type = 'button';
      bShow.addEventListener('click', function () { rows.forEach(function (r) { r.input.value = r.answer; }); });
      bar.appendChild(bShow);
      box.appendChild(bar);
      return box;
    }

    // Bài 12 (viết): chọn từ đúng trong ngoặc. Mỗi item: template có {0},{1}... và blanks[] { options, answer }.
    function renderChooseWord(ex, n) {
      const wrap = el('div', 'bai-choose');
      let itemNo = 0;
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-choose-row');
        if (item.example) row.appendChild(document.createTextNode('Ví dụ:\u00A0\u00A0'));   // câu ví dụ: hiện sẵn đáp án (tô đỏ), không đánh số
        else if (!ex.noItemNum) row.appendChild(document.createTextNode((++itemNo) + '\u00A0\u00A0'));
        let solvedCount = 0;
        const blanks = item.blanks || [];
        const total = blanks.filter(function (b) { return b.options && b.options.length; }).length;
        String(item.template).split(/(\{\d+\})/).forEach(function (part) {
          const m = /^\{(\d+)\}$/.exec(part);
          if (!m) { if (part) row.appendChild(document.createTextNode(part)); return; }
          const blank = blanks[Number(m[1])];
          if (item.example) { row.appendChild(el('span', 'bai-fill-example', blank.answer)); return; }
          blank.options.forEach(function (opt, oi) {
            if (oi) row.appendChild(document.createTextNode(' / '));
            const b = el('button', 'bai-chip bai-tone-pink bai-opt', opt);
            b.type = 'button';
            b.addEventListener('click', function () {
              if (b.dataset.solved) return;
              if (opt === blank.answer) { b.classList.add('is-correct'); b.dataset.solved = '1'; solvedCount++; }
              else b.classList.add('is-wrong');
            });
            row.appendChild(b);
          });
        });
        wrap.appendChild(row);
      });
      return wrap;
    }

    // Bài 8 (b2): sắp xếp các từ thành câu hỏi. Bấm từ ở ngân hàng để đưa lên dòng câu, bấm lại để bỏ xuống.
    // item: { words:[...], answers:[câu chấp nhận...], example:true }
    function normSentence(s) {
      return String(s).normalize('NFC').toLowerCase().replace(/[.,!?;:]/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function renderWordOrder(ex, n) {
      const box = el('div', 'bai-order-list');
      const rows = [];
      (ex.items || []).forEach(function (it, i) {
        const row = el('div', 'bai-order-row');
        row.appendChild(el('div', 'bai-order-num', it.example ? 'Ví dụ' : String(i + ((ex.items[0] && ex.items[0].example) ? 0 : 1))));
        const body = el('div', 'bai-order-body');
        const answerLine = el('div', 'bai-order-answer');
        const mark = el('span', 'bai-mark');
        const bank = el('div', 'bai-wordbank');
        const chips = [];
        const picked = [];
        function refresh() {
          answerLine.innerHTML = '';
          picked.forEach(function (c) {
            const b = el('button', 'bai-chip bai-tone-pink', c.word); b.type = 'button';
            b.addEventListener('click', function () {
              picked.splice(picked.indexOf(c), 1); c.used = false; refresh();
            });
            answerLine.appendChild(b);
          });
          chips.forEach(function (c) { c.btn.style.visibility = c.used ? 'hidden' : 'visible'; });
          answerLine.classList.remove('is-correct', 'is-wrong');
          mark.textContent = ''; mark.className = 'bai-mark';
        }
        (it.words || []).forEach(function (w) {
          const c = { word: w, used: false };
          c.btn = el('button', 'bai-chip bai-tone-lav', w); c.btn.type = 'button';
          c.btn.addEventListener('click', function () {
            if (c.used) return;
            c.used = true; picked.push(c); refresh();
          });
          chips.push(c); bank.appendChild(c.btn);
        });
        function setAnswer(sentence) {
          picked.length = 0;
          chips.forEach(function (c) { c.used = false; });
          const toks = String(sentence).replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean);
          let k = 0;
          while (k < toks.length) {   // khớp cả chip nhiều chữ (vd. "thứ năm"), ưu tiên chip dài nhất
            let best = null;
            chips.forEach(function (x) {
              if (x.used) return;
              const n = normSentence(x.word).split(' ').length;
              if (normSentence(toks.slice(k, k + n).join(' ')) === normSentence(x.word) && (!best || n > best.n)) best = { c: x, n: n };
            });
            if (best) { best.c.used = true; picked.push(best.c); k += best.n; } else k++;
          }
          refresh();
        }
        const accepted = (it.answers || []).map(normSentence);
        function check() {
          if (!picked.length) return;
          const v = normSentence(picked.map(function (c) { return c.word; }).join(' '));
          const ok = accepted.indexOf(v) !== -1;
          answerLine.classList.toggle('is-correct', ok); answerLine.classList.toggle('is-wrong', !ok);
          mark.textContent = ok ? '✓' : '✗'; mark.className = 'bai-mark ' + (ok ? 'ok' : 'bad');
        }
        function reveal() { setAnswer(it.answers[0]); answerLine.classList.add('is-correct'); mark.textContent = '✓'; mark.className = 'bai-mark ok'; }
        function reset() { picked.length = 0; chips.forEach(function (c) { c.used = false; }); refresh(); }
        body.appendChild(bank);
        answerLine.setAttribute('aria-label', 'Câu bạn sắp xếp');
        const lineWrap = el('div', 'bai-order-linewrap');
        lineWrap.appendChild(answerLine); lineWrap.appendChild(mark);
        body.appendChild(lineWrap);
        if (it.example) {
          setAnswer(it.answers[0]);
          chips.forEach(function (c) { c.btn.disabled = true; });
          answerLine.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
          body.appendChild(el('div', 'bai-example', it.answers[0]));
        } else {
          const bar = el('div', 'bai-fill-actions');
          const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
          const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
          const bReset = el('button', 'bai-btn bai-btn-ghost', 'Làm lại'); bReset.type = 'button'; bReset.addEventListener('click', reset);
          bar.appendChild(bCheck); bar.appendChild(bShow); bar.appendChild(bReset);
          body.appendChild(bar);
          rows.push({ reveal: reveal });
        }
        row.appendChild(body);
        box.appendChild(row);
      });
      return box;
    }

    // Bài 9 (b2): viết câu trả lời theo gợi ý. answers dùng {p} = đại từ xưng hô (pronouns[]).
    function renderWriteAnswer(ex, n) {
      const box = el('div', 'bai-write-list');
      let seq = 0;
      (ex.items || []).forEach(function (it, i) {
        const row = el('div', 'bai-write-row');
        const q = el('div', 'bai-write-q');
        if (/\n/.test(it.question || '')) q.style.whiteSpace = 'pre-line';
        if (it.example) {
          // it.numbered: ví dụ được đánh số như câu 1 (thay vì chữ "Ví dụ"); it.redExample: cả dòng đáp án in đỏ
          const lead = it.numbered ? (++seq) + '\u00A0\u00A0' : 'Ví dụ\u00A0\u00A0';
          q.appendChild(document.createTextNode(lead + it.question));
          row.appendChild(q);
          const sample = el('div', 'bai-fill-line');
          sample.appendChild(document.createTextNode('\u2192\u00A0'));
          if (it.redExample) sample.appendChild(el('span', 'bai-fill-example', it.model));
          else sample.appendChild(document.createTextNode(it.model));
          sample.style.margin = '2px 0 18px';
          row.appendChild(sample);
          box.appendChild(row);
          return;
        }
        seq++;
        if (!it.given) {
          q.appendChild(document.createTextNode(seq + '\u00A0\u00A0' + it.question + ' '));
          if (it.hint) q.appendChild(el('span', 'bai-example', '(' + it.hint + ')'));
          row.appendChild(q);
        }
        const line = el('div', 'bai-fill-line');
        // it.given: bài đảo — ô trống là CÂU HỎI, câu trả lời cho sẵn bên dưới
        line.appendChild(document.createTextNode(it.given ? (seq + '\u00A0\u00A0') : ('→\u00A0' + (it.prefix ? it.prefix + '\u00A0' : ''))));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank bai-blank-full'; input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Câu trả lời ' + (i + 1));
        const mark = el('span', 'bai-mark');
        line.appendChild(input);
        if (it.given || ex.questionMark) line.appendChild(document.createTextNode('?'));
        line.appendChild(mark);
        row.appendChild(line);
        if (it.given) {
          const gl = el('div', 'bai-fill-line', '→\u00A0' + it.given);
          gl.style.marginTop = '4px';
          row.appendChild(gl);
        }
        const accepted = [];
        (it.answers || []).forEach(function (a) {
          (it.pronouns && a.indexOf('{p}') !== -1 ? it.pronouns : [null]).forEach(function (p) {
            const full = p ? a.replace(/\{p\}/g, p) : a;
            accepted.push(normSentence(full));
            if (it.prefix) accepted.push(normSentence(it.prefix + ' ' + full));   // chấp nhận cả khi gõ lại "Có." / "Không."
          });
        });
        const model = it.model || it.answers[0];
        function modelText() {
          const s = (it.pronouns ? model.replace(/\{p\}/g, it.pronouns[0]) : model);
          return s.charAt(0).toUpperCase() + s.slice(1);
        }
        function check() {
          const v = normSentence(input.value);
          markCell(input, mark, !v ? '' : (accepted.indexOf(v) !== -1 ? 'ok' : 'bad'));
        }
        function reveal() { input.value = modelText(); markCell(input, mark, 'ok'); }
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
        input.addEventListener('input', function () { markCell(input, mark, ''); });
        const bar = el('div', 'bai-fill-actions');
        const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button'; bCheck.addEventListener('click', check);
        const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button'; bShow.addEventListener('click', reveal);
        bar.appendChild(bCheck); bar.appendChild(bShow);
        row.appendChild(bar);
        box.appendChild(row);
      });
      return box;
    }

    // Bài 10 (b2): bài nói, trả lời mở. Có ví dụ + ô ghi chú tự do (không chấm điểm).
    function renderOpenAnswer(ex, n) {
      const box = el('div', 'bai-write-list');
      if (ex.example) {
        const row = el('div', 'bai-write-row');
        row.appendChild(el('div', 'bai-write-q', ex.example.question));
        const line = el('div', 'bai-fill-line');
        line.appendChild(document.createTextNode('→\u00A0'));
        line.appendChild(el('span', 'bai-example', ex.example.answer));
        row.appendChild(line);
        box.appendChild(row);
      }
      (ex.items || []).forEach(function (it, i) {
        const row = el('div', 'bai-write-row');
        row.appendChild(el('div', 'bai-write-q', (i + 1) + '\u00A0\u00A0' + it.question));
        const line = el('div', 'bai-fill-line');
        line.appendChild(document.createTextNode('→\u00A0' + (it.prefix ? it.prefix + '\u00A0' : '')));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'bai-blank bai-blank-full'; input.autocomplete = 'off';
        input.setAttribute('aria-label', 'Câu trả lời ' + (i + 1));
        line.appendChild(input);
        row.appendChild(line);
        box.appendChild(row);
      });
      return box;
    }

    // Danh sách từ/cụm từ có phần âm cần học tô đỏ + nghĩa nhỏ bên dưới (ngoài khung chip).
    // ex.groups = [{ sound: "ia", tone: "lav", items: [{ text, hl, gloss, audio }] }]
    //   hl = đoạn chữ tô đỏ (đúng như trong text, kể cả dấu thanh); gloss = nghĩa (tuỳ chọn); audio = đường dẫn riêng (có thể chứa {voice}).
    function renderWordList(ex) {
      const wrap = el('div', 'bai-wl');
      (ex.groups || []).forEach(function (g) {
        const grp = el('div', 'bai-wl-group');
        if (g.sound) grp.appendChild(el('div', 'bai-chip is-static bai-wl-head', g.sound));   // âm đang học: ô trắng nằm trên hàng từ
        const row = el('div', 'bai-wl-row');
        (g.items || []).forEach(function (it) {
          const cell = el('div', 'bai-wl-cell');
          const b = el('button', 'bai-chip bai-wl-chip bai-tone-' + (g.tone || 'lav'));
          b.type = 'button';
          b.dataset.text = it.text;
          b.setAttribute('aria-label', 'Nghe “' + it.text + '”');
          const txt = el('span', 'bai-wl-text');   // gói trong 1 span: chip là flex nên nếu không sẽ bị tách khoảng trắng quanh phần tô đỏ
          // hl: một đoạn chữ, hoặc mảng nhiều đoạn (mỗi đoạn tìm tiếp theo sau đoạn trước, vd. ["l","l"] cho "lo lắng")
          const hls = it.hl ? (Array.isArray(it.hl) ? it.hl : [it.hl]) : [];
          let pos = 0;
          hls.forEach(function (h) {
            const i = it.text.indexOf(h, pos);
            if (i < 0) return;
            if (i > pos) txt.appendChild(document.createTextNode(it.text.slice(pos, i)));
            txt.appendChild(el('span', 'bai-wl-hl', h));
            pos = i + h.length;
          });
          if (pos < it.text.length) txt.appendChild(document.createTextNode(it.text.slice(pos)));
          b.appendChild(txt);
          b.addEventListener('click', function () { if (it.audio) play(resolveAudio(it.audio), b); });
          cell.appendChild(b);
          if (it.gloss) cell.appendChild(el('div', 'bai-wl-gloss', it.gloss));
          row.appendChild(cell);
        });
        grp.appendChild(row);
        wrap.appendChild(grp);
      });
      return wrap;
    }

    // Viết đoạn văn tự do: danh sách câu hỏi gợi ý + (tuỳ chọn) đoạn mẫu + khung viết nhiều dòng.
    // ex.questions = ["...", ...]; ex.example = { label: "Mẫu", text: "..." }; ex.rows = số dòng khung viết.
    function renderWriteParagraph(ex) {
      const box = el('div', 'bai-write-list');
      (ex.questions || []).forEach(function (q) {
        const row = el('div', 'bai-write-q', '\u2022\u00A0\u00A0' + q);
        row.style.whiteSpace = 'pre-line';
        box.appendChild(row);
      });
      if (ex.example) {
        const mau = el('div', 'bai-write-q');
        mau.style.margin = '14px 0 6px';
        mau.appendChild(el('span', 'bai-example', (ex.example.label || 'Mẫu') + ':'));
        box.appendChild(mau);
        const ps = el('p', 'bai-passage', ex.example.text); ps.style.whiteSpace = 'pre-line';
        box.appendChild(ps);
      }
      const ta = document.createElement('textarea');
      ta.className = 'bai-textarea'; ta.rows = ex.rows || 6; ta.autocomplete = 'off';
      ta.setAttribute('aria-label', 'Đoạn văn của bạn');
      box.appendChild(ta);
      return box;
    }

    // Nối câu hỏi với câu trả lời (b4): mỗi câu hỏi chọn chữ cái của câu trả lời phù hợp.
    // ex.questions = [{q, answer:'b'}], ex.options = [{key:'a', text:'...'}]
    function renderMatchPairs(ex) {
      const wrap = el('div', 'bai-match');
      const left = el('div', 'bai-match-left');
      const right = el('div', 'bai-match-right');
      const rows = [];
      (ex.questions || []).forEach(function (q, i) {
        const row = el('div', 'bai-match-row');
        row.appendChild(el('span', 'bai-match-q', (i + 1) + '\u00A0\u00A0' + q.q));
        const sel = document.createElement('select');
        sel.className = 'bai-match-sel';
        sel.setAttribute('aria-label', 'Chọn câu trả lời cho câu ' + (i + 1));
        const blank = document.createElement('option'); blank.value = ''; blank.textContent = '—'; sel.appendChild(blank);
        (ex.options || []).forEach(function (o) {
          const op = document.createElement('option'); op.value = o.key; op.textContent = o.key; sel.appendChild(op);
        });
        const mark = el('span', 'bai-mark');
        sel.addEventListener('change', function () { markCell(sel, mark, ''); });
        row.appendChild(sel); row.appendChild(mark);
        left.appendChild(row);
        rows.push({ q: q, sel: sel, mark: mark });
      });
      (ex.options || []).forEach(function (o) {
        right.appendChild(el('div', 'bai-match-opt', o.key + '.\u00A0\u00A0' + o.text));
      });
      const bar = el('div', 'bai-fill-actions');
      const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button';
      bCheck.addEventListener('click', function () {
        rows.forEach(function (r) { markCell(r.sel, r.mark, !r.sel.value ? '' : (r.sel.value === r.q.answer ? 'ok' : 'bad')); });
      });
      const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button';
      bShow.addEventListener('click', function () {

    // Nối bằng kéo-thả: cột trái cố định (tiếng Việt), cột phải là các chip kéo để sắp xếp cho khớp từng dòng.
    // Dữ liệu giống matchPairs (questions[{q,answer}] + options[{key,text}]); thứ tự ban đầu = thứ tự options.
    function renderMatchDrag(ex) {
      const wrap = el('div', 'bai-drag');
      const list = el('div', 'bai-drag-cols');
      const opts = (ex.options || []);
      const chips = opts.map(function (o) {
        const c = el('div', 'bai-drag-chip');
        c.tabIndex = 0;
        c.setAttribute('role', 'button');
        c.setAttribute('aria-label', o.text + ' (kéo để sắp xếp, hoặc dùng phím mũi tên lên xuống)');
        c.appendChild(el('span', 'bai-drag-grip', '\u2807\u2807'));
        c.appendChild(el('span', 'bai-drag-text', o.text));
        c.dataset.key = o.key;
        return c;
      });
      let order = chips.slice();            // order[i] = chip đang nằm ở dòng i
      const slots = [], marks = [];
      const colL = el('div', 'bai-drag-left'), colR = el('div', 'bai-drag-right');
      (ex.questions || []).forEach(function (q, i) {
        const qc = el('div', 'bai-drag-q');
        qc.appendChild(el('span', 'bai-drag-qt', (i + 1) + '\u00A0\u00A0' + q.q));
        const mark = el('span', 'bai-mark');
        qc.appendChild(mark);
        colL.appendChild(qc);
        const slot = el('div', 'bai-drag-slot');
        colR.appendChild(slot);
        slots.push(slot); marks.push(mark);
      });
      list.appendChild(colL); list.appendChild(colR);
      function place() { order.forEach(function (c, i) { if (slots[i]) slots[i].appendChild(c); }); }
      function clearMarks() {
        order.forEach(function (c, i) { if (marks[i]) markCell(c, marks[i], ''); });
      }
      function moveTo(chip, to) {
        const from = order.indexOf(chip);
        if (from < 0 || to === from) return false;
        to = Math.max(0, Math.min(order.length - 1, to));
        order.splice(from, 1); order.splice(to, 0, chip);
        place(); return true;
      }
      chips.forEach(function (chip) {
        let grab = 0, active = false;
        function follow(e) {
          const r = slots[order.indexOf(chip)].getBoundingClientRect();
          chip.style.transform = 'translateY(' + (e.clientY - grab - (r.top + r.height / 2)) + 'px)';
        }
        function onMove(e) {
          if (!active) return;
          let target = order.indexOf(chip);
          for (let i = 0; i < slots.length; i++) {
            const r = slots[i].getBoundingClientRect();
            if (e.clientY >= r.top && e.clientY <= r.bottom) { target = i; break; }
          }
          if (e.clientY < slots[0].getBoundingClientRect().top) target = 0;
          if (e.clientY > slots[slots.length - 1].getBoundingClientRect().bottom) target = slots.length - 1;
          moveTo(chip, target);
          follow(e);
          if (e.clientY < 50) window.scrollBy(0, -12);
          else if (e.clientY > window.innerHeight - 50) window.scrollBy(0, 12);
        }
        function end() {
          if (!active) return;
          active = false;
          chip.classList.remove('is-dragging');
          chip.style.transform = '';
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', end);
          document.removeEventListener('pointercancel', end);
        }
        chip.addEventListener('pointerdown', function (e) {
          if (e.button != null && e.button !== 0) return;
          if (e.pointerType === 'touch' && !e.target.closest('.bai-drag-grip')) return;  // cảm ứng: chỉ kéo bằng tay nắm để vẫn cuộn trang được
          const r = chip.getBoundingClientRect();
          grab = e.clientY - (r.top + r.height / 2);
          active = true;
          chip.classList.add('is-dragging');
          clearMarks();
          // nghe ở document (không dùng pointer capture) vì chip bị chuyển sang ô khác trong lúc kéo
          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', end);
          document.addEventListener('pointercancel', end);
          e.preventDefault();
        });
        chip.addEventListener('keydown', function (e) {
          if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
          e.preventDefault();
          clearMarks();
          moveTo(chip, order.indexOf(chip) + (e.key === 'ArrowUp' ? -1 : 1));
          chip.focus();
        });
      });
      place();
      const bar = el('div', 'bai-fill-actions');
      const bCheck = el('button', 'bai-btn', 'Kiểm tra'); bCheck.type = 'button';
      bCheck.addEventListener('click', function () {
        (ex.questions || []).forEach(function (q, i) {
          markCell(order[i], marks[i], order[i].dataset.key === q.answer ? 'ok' : 'bad');
        });
      });
      const bShow = el('button', 'bai-btn bai-btn-ghost', 'Xem đáp án'); bShow.type = 'button';
      bShow.addEventListener('click', function () {
        const byKey = {}; chips.forEach(function (c) { byKey[c.dataset.key] = c; });
        order = (ex.questions || []).map(function (q) { return byKey[q.answer]; });
        const used = {}; order.forEach(function (c) { used[c.dataset.key] = 1; });
        chips.forEach(function (c) { if (!used[c.dataset.key]) order.push(c); });
        place();
        (ex.questions || []).forEach(function (q, i) { markCell(order[i], marks[i], 'ok'); });
      });
      bar.appendChild(bCheck); bar.appendChild(bShow);
      wrap.appendChild(list); wrap.appendChild(bar);
      // Chiều cao mỗi dòng = dòng cao nhất (câu dài xuống dòng vẫn không bị tràn, 2 cột luôn thẳng hàng)
      let lastW = -1;
      function fit() {
        wrap.style.setProperty('--drag-row-h', 'auto');
        let h = 56;
        wrap.querySelectorAll('.bai-drag-q, .bai-drag-chip').forEach(function (n) { h = Math.max(h, n.offsetHeight); });
        wrap.style.setProperty('--drag-row-h', h + 'px');
      }
      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          const w = Math.round(wrap.clientWidth);
          if (w === lastW || !w) return;
          lastW = w; fit();

      }
      return wrap;
    }

    // Nghe và điền (b6): mỗi câu có audio riêng, có thể nhiều chỗ trống. item.distinct = các ô phải khác nhau.
    function renderAudioFill(ex) {
      const wrap = el('div', 'bai-fill');

        const row = el('div', 'bai-fill-row');

        num.setAttribute('aria-label', 'Nghe câu ' + (i + 1));

        } else {
          num.disabled = true; num.style.cursor = 'default';   // bài điền không có audio
        }
        row.appendChild(num);

        if (ex.blankWidth) built.cells.forEach(function (c) { c.input.style.width = ex.blankWidth; c.input.style.maxWidth = '100%'; });

      function nsp(t) { return normName(t).replace(/\s+/g, ''); }   // bỏ khoảng trắng: "1 4 7" = "147"
      function check() {
        rows.forEach(function (r) {
          const vals = r.cells.map(function (c) { return normName(c.input.value); });
          const filled = vals.every(Boolean);
          let ok = filled && r.cells.every(function (c, k) { return c.answers.some(function (a) { return nsp(a) === nsp(vals[k]); }); });
          if (ok && r.item.distinct && new Set(vals).size !== vals.length) ok = false;
          r.cells.forEach(function (c, k) { markCell(c.input, r.mark, ''); c.input.classList.toggle('is-correct', ok); c.input.classList.toggle('is-wrong', filled && !ok); });
          r.mark.textContent = !vals.some(Boolean) ? '' : (ok ? '✓' : '✗');
          r.mark.className = 'bai-mark ' + (!vals.some(Boolean) ? '' : (ok ? 'ok' : 'bad'));
        });
      }
      function reveal() {

      wrap.appendChild(fillCheckBar(null, check, reveal));
      return wrap;
    }

    // ---------- Trang tổng hợp từ vựng + ngữ pháp (summary) ----------
    // Giống bảng tổng hợp bài học: header tối, bảng 2 cột (tiếng Việt ▶ | nghĩa), cấu trúc, ví dụ, ô mẹo.
    // Audio mỗi dòng: row.audio (đường dẫn riêng) hoặc ex.audio với {slug} = chữ không dấu, nối bằng "_" (vd: "tuần trước" → tuan_truoc).
    function sumPlain(t) { return String(t).replace(/\{\{(.*?)(::\w+)?\}\}/g, '$1'); }

    function sumPlayBtn(ex, text, audio) {

    // Nhiều bài tập → mỗi bài 1 trang, bấm mũi tên (hoặc phím ← →) để chuyển.

    function renderExercises(container, exercises, opts) {

      const stage = el('div', 'bai-stage' + (flow ? ' bai-stage-flow' : ''));   // bài flow: mọi trang cao bằng nhau để nút Next đứng yên
      const pager = el('div', 'bai-pager');
      const prev = el('button', 'bai-arrow', '←'); prev.type = 'button'; prev.setAttribute('aria-label', 'Bài trước');
      const next = el('button', 'bai-arrow', '→'); next.type = 'button'; next.setAttribute('aria-label', 'Bài tiếp theo');
      const count = el('span', 'bai-pager-count');
      pager.appendChild(prev); pager.appendChild(count); pager.appendChild(next);
      container.appendChild(stage);
      container.appendChild(pager);

      let idx = 0;
      const last = exercises.length - 1;
      function show(i, revealAll) {
        idx = Math.max(0, Math.min(last, i));
        stopAudio();
        stage.innerHTML = '';
        teachRevealAll = !!revealAll;   // quay lại trang cũ thì hiện sẵn hết các bước
        stage.appendChild(buildExercise(exercises[idx], idx + 1));
        teachRevealAll = false;
        count.textContent = (idx + 1) + ' / ' + exercises.length;
        prev.disabled = idx === 0 && !(flow && opts.goPrev);
        next.disabled = idx === last && !(flow && opts.goNext);
      }
      // Next: hiện bước tiếp theo của trang hiện tại; hết bước thì sang trang sau; hết trang thì sang mục sau (flow).
      function forward() {
        const cur = stage.firstChild;
        if (cur && cur.__adv && cur.__adv()) return;
        if (idx < last) show(idx + 1);
        else if (flow && opts.goNext) opts.goNext();
      }
      function backward() {
        const cur = stage.firstChild;
        if (cur && cur.__back && cur.__back()) return;
        if (idx > 0) show(idx - 1, true);
        else if (flow && opts.goPrev) opts.goPrev();
      }
      prev.addEventListener('click', backward);
      next.addEventListener('click', forward);
      pagerKeyHandler = function (e) {
        const t = e.target && e.target.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') backward();
        else if (e.key === 'ArrowRight') forward();
      };
      document.addEventListener('keydown', pagerKeyHandler);
      if (opts.startLast) show(last, true); else show(0);
    }

    // ---------- Khung: sidebar (section → mục con) + nội dung ----------
    function buildLesson(item) {
      const sections = item.sections || [];
      $panel.innerHTML = '';

      const shell = buildSectionShell('', function () { location.href = 'lessons.html?level=' + encodeURIComponent(level); });
      const pill = shell.querySelector('.gram2-tab-pill');
      const topbar = shell.querySelector('.gram2-topbar');
      if (topbar) topbar.remove();   // bỏ ô mũi tên + tên phần (đã có nút Quay lại ở trên)
      $panel.appendChild(shell);

      const body = el('div', 'gram2-body');
      const sidebar = el('aside', 'gram2-sidebar');
      const content = el('div', 'gram2-content');
      body.appendChild(sidebar);
      body.appendChild(content);
      shell.appendChild(body);

      const entries = [];   // { key, section, sub, btn, header, list, chevron }
      // màu từng phần: ô số (nhạt) + nền khung nội dung (rất nhạt)
      // màu chủ đạo theo chương: Bài 1–10 tím, Bài 11–20 xanh lá mạ, ...
      const CH_ACCENTS = ['#C6C9FF', '#D1FF94', '#C6E2FF', '#FFC6EF', '#FFDCC6', '#FAFF94', '#FFC6C7', '#C6FFF9'];
      const lessonNum = parseInt((String(itemId).match(/\d+/) || ['1'])[0], 10) || 1;
      const SEC_SQ   = [CH_ACCENTS[Math.floor((lessonNum - 1) / 10) % CH_ACCENTS.length]];
      const SEC_PALE = ['#FFFFFF'];   // nền khung nội dung: trắng

      function scrollToContentOnMobile() {
        if (!window.matchMedia('(max-width: 720px)').matches) return;
        window.requestAnimationFrame(function () {
          const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 0;
          window.scrollTo({ top: content.getBoundingClientRect().top + window.scrollY - headerH - 12, behavior: 'smooth' });
        });
      }

      function select(entry, opts) {
        entries.forEach(function (e) {
          e.btn && e.btn.classList.toggle('active', e === entry);
          e.isStatic && e.header.classList.toggle('active', e === entry);
        });
        // Mở section chứa mục đang chọn
        if (entry.list && entry.list.classList.contains('gram2-collapsed')) {
          entry.list.classList.remove('gram2-collapsed');
          entry.chevron.textContent = '▾';
        }

        pill.textContent = entry.section.titleVi;
        content.innerHTML = '';
        enOnly = entry.section.id === 'ngu-phap' || !!entry.section.enOnly;
        content.classList.toggle('is-flow-grammar', !!item.flow && enOnly);   // bài kiểu flow: trang ngữ pháp chữ to, canh giữa   // enOnly: section chỉ có phần giải thích tiếng Anh (ngữ pháp)
        entries.forEach(function (e) { if (e.secBox) e.secBox.classList.toggle('is-current', e.section === entry.section); });
        content.style.setProperty('--ch', SEC_SQ[entry.si % SEC_SQ.length]);
        content.style.setProperty('--ch-l', SEC_PALE[entry.si % SEC_PALE.length]);
        const head = el('div', 'bai-sec-head');
        const segs = el('div', 'bai-sec-segs');
        sections.forEach(function (_, i) { segs.appendChild(el('i', i <= entry.si ? 'on' : '')); });
        head.appendChild(segs);
        const hrow = el('div', 'bai-sec-row');
        hrow.appendChild(el('span', 'bai-sec-big', String(entry.si + 1).padStart(2, '0')));
        const htx = el('div', 'bai-sec-tx');
        htx.appendChild(el('div', 'bai-sec-name', entry.section.titleVi));
        if (entry.section.titleEn) htx.appendChild(el('div', 'bai-sec-en', entry.section.titleEn));
        hrow.appendChild(htx);
        head.appendChild(hrow);
        content.appendChild(head);
        if (entry.sub) {
          if (!entry.sub.hideLabel) content.appendChild(el('h2', 'gram2-content-title', entry.sub.label));   // hideLabel: bỏ dòng nhãn mục (vd: trang Tổng hợp)
          if (entry.sub.exercises && entry.sub.exercises.length) {
            const ei = entries.indexOf(entry);
            const nextE = entries[ei + 1], prevE = entries[ei - 1];
            renderExercises(content, entry.sub.exercises, {
              flow: !!item.flow,
              startLast: !!(opts && opts.last),
              goNext: nextE ? function () { select(nextE, { scroll: true }); } : null,
              goPrev: prevE ? function () { select(prevE, { scroll: true, last: true }); } : null
            });
          }
          else content.appendChild(emptyNote('Mục này đang được soạn.'));
        } else {
          content.appendChild(el('h2', 'gram2-content-title', entry.section.titleVi));
          content.appendChild(emptyNote('Phần “' + entry.section.titleVi + '” đang được soạn.'));
        }

        try { history.replaceState(null, '', '#' + entry.key); } catch (e) {}
        if (opts && opts.scroll) scrollToContentOnMobile();
      }

      sections.forEach(function (section, si) {
        const secBox = el('div', 'gram2-section');
        secBox.style.setProperty('--ch', SEC_SQ[si % SEC_SQ.length]);
        const header = el('button', 'gram2-section-header'); header.type = 'button';
        const titles = el('div', 'gram2-section-titles');
        header.appendChild(el('span', 'gram2-section-num', String(si + 1)));
        titles.appendChild(el('div', 'gram2-section-title-vi', section.titleVi));
        if (section.titleEn) titles.appendChild(el('div', 'gram2-section-title-en', section.titleEn));
        header.appendChild(titles);
        const chevron = el('span', 'gram2-chevron', '▾');
        header.appendChild(chevron);
        secBox.appendChild(header);

        const subs = section.subtopics || [];
        if (item.flat && subs.length === 1) {
          // Sidebar phẳng ("flat": true ở cấp bài): mỗi chủ đề là 1 nút, không có toggle / mục con.
          header.classList.add('is-static');
          const sub = subs[0];
          const entry = { key: section.id + '/' + sub.id, section: section, sub: sub, btn: header, secBox: secBox, si: si };
          entries.push(entry);
          header.addEventListener('click', function () { select(entry, { scroll: true }); });
        } else if (!subs.length) {
          // Section chưa có mục con: bấm vào tiêu đề là chọn luôn section.
          header.classList.add('is-static');
          const entry = { key: section.id, section: section, sub: null, header: header, isStatic: true, secBox: secBox, si: si };
          entries.push(entry);
          header.addEventListener('click', function () { select(entry, { scroll: true }); });
        } else {
          const list = el('div', 'gram2-subtopic-list');
          subs.forEach(function (sub) {
            const btn = el('button', 'gram2-subtopic-btn', sub.label); btn.type = 'button';
            const entry = { key: section.id + '/' + sub.id, section: section, sub: sub, btn: btn, list: list, chevron: chevron, secBox: secBox, si: si };
            entries.push(entry);
            btn.addEventListener('click', function () { select(entry, { scroll: true }); });
            list.appendChild(btn);
          });
          secBox.appendChild(list);
          // Chỉ mở section đầu tiên lúc đầu; select() sẽ tự mở section chứa mục được chọn.
          if (si !== 0) { list.classList.add('gram2-collapsed'); chevron.textContent = '▸'; }
          header.addEventListener('click', function () {
            const collapsed = list.classList.toggle('gram2-collapsed');
            chevron.textContent = collapsed ? '▸' : '▾';
          });
        }
        sidebar.appendChild(secBox);
      });

      // Mở đúng chỗ đang dạy khi tải lại trang (#phat-am/bang-chu-cai), mặc định mục đầu tiên.
      const wanted = decodeURIComponent(location.hash.replace(/^#/, ''));
      const first = entries.filter(function (e) { return e.key === wanted; })[0]
        || entries.filter(function (e) { return e.sub; })[0]
        || entries[0];
      if (first) select(first);
    }

    // ---------- Nút chuyển bài (trước / sau) ----------
    async function buildLessonNav() {
      const nav = document.getElementById('lesson-nav');
      if (!nav) return;
      try {
        const res = await fetch(level + '/units.json', { cache: 'no-cache' });
        const lessons = ((await res.json()).lessons || []).slice().sort(function (a, b) { return a.num - b.num; });
        const i = lessons.findIndex(function (l) { return l.id === itemId; });
        if (i < 0) return;
        const open = function (l) { return l && l.status !== 'todo'; };
        let prev = null, next = null;
        for (let k = i - 1; k >= 0; k--) { if (open(lessons[k])) { prev = lessons[k]; break; } }
        for (let k = i + 1; k < lessons.length; k++) { if (open(lessons[k])) { next = lessons[k]; break; } }
        const mk = function (l, cls, label) {
          const a = document.createElement(l ? 'a' : 'span');
          a.className = 'lesson-nav-btn ' + cls + (l ? '' : ' is-disabled');
          a.textContent = label;
          if (l) a.href = (l.page || 'bai.html') + '?id=' + encodeURIComponent(l.id) + '&level=' + encodeURIComponent(level);
          return a;
        };
        nav.appendChild(mk(prev, 'is-prev', '← Bài ' + (prev ? prev.num : 'trước')));
        nav.appendChild(mk(next, 'is-next', 'Bài ' + (next ? next.num : 'sau') + ' →'));
      } catch (e) { console.error(e); }
    }

    // ---------- Load ----------
    (async function () {
      try {
        if (!SAFE_ID.test(itemId) || !SAFE_ID.test(level)) throw new Error('Bad id');
        const res = await fetch(level + '/bai/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();
        document.title = 'Bài ' + item.num + ': ' + item.title + ' — hoc voi hanh';
        $title.textContent = ''; const hl = document.createElement('span'); hl.className = 'title-hl'; hl.textContent = 'Bài ' + item.num + ': ' + item.title; $title.appendChild(hl);
        buildLesson(item);
        buildLessonNav();
      } catch (err) {
        console.error(err);
        $title.textContent = 'Không tải được bài học';
        $panel.innerHTML = '<p class="note">Không tìm thấy file <code>' + level + '/bai/' + itemId + '.json</code>.</p>';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>
