<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <div id="account-widget-slot"></div>
        </div>
      </nav>
    </div>
  </header>

  <div class="page-back-bar wrap">
    <a class="back-link" id="back-link" href="lessons.html">← Back</a>
  </div>

  <main class="wrap">
    <div class="lesson-head">
      <h1 id="title">Đang tải…</h1>
    </div>
    <section class="tab-panel" id="panel"></section>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <div class="bai-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lesson-shared.js"></script>
  <script>
    // ========================================================
    // bai.html — bài học kiểu "slide dạy học"
    // Dữ liệu: <level>/bai/<id>.json  (xem _guide trong file JSON)
    // Khung: sidebar trái = các section (giống Grammar v2), nội dung bên phải.
    // ========================================================
    const params = new URLSearchParams(location.search);
    const itemId = params.get('id') || 'b1';
    const level = params.get('level') || 'mam';
    const SAFE_ID = /^[a-z0-9_-]+$/i;

    const $title = document.getElementById('title');
    const $panel = document.getElementById('panel');
    const $toast = document.getElementById('toast');
    document.getElementById('back-link').href = 'lessons.html?level=' + encodeURIComponent(level);

    // ---------- Thông báo nhỏ (dùng khi chưa có file audio) ----------
    let toastTimer = null;
    function toast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 2200);
    }

    // ---------- Audio: tên file theo kiểu Telex ----------
    // Mũ/móc: ă→aw  â→aa  đ→dd  ê→ee  ô→oo  ơ→ow  ư→uw
    // Thanh điệu (gõ cuối âm tiết, như Telex): sắc=s  huyền=f  hỏi=r  ngã=x  nặng=j
    // Ví dụ: "đi" → ddi, "bơ" → bow, "bố" → boos, "phở" → phowr, "mẹ" → mej.
    const SHAPE = { '\u0306': 'w', '\u031B': 'w' };      // ă, ơ, ư → thêm w
    const TONE_KEY = { '\u0301': 's', '\u0300': 'f', '\u0309': 'r', '\u0303': 'x', '\u0323': 'j' };
    function audioKey(text) {
      let out = '', tone = '';
      String(text).normalize('NFC').toLowerCase().split('').forEach(function (ch) {
        if (ch === 'đ') { out += 'dd'; return; }
        const parts = ch.normalize('NFD');            // chữ cái gốc + các dấu
        out += parts[0];
        for (let i = 1; i < parts.length; i++) {
          const m = parts[i];
          if (m === '\u0302') out += parts[0];         // â ê ô → nhân đôi nguyên âm
          else if (SHAPE[m]) out += SHAPE[m];
          else if (TONE_KEY[m]) tone = TONE_KEY[m];
        }
      });
      return out + tone;
    }
    function audioSrc(template, text, n) {
      if (!template) return '';
      return resolveAudio(template.replace('{key}', audioKey(text)).replace('{n}', n == null ? '' : n));
    }

    // File audio chưa có → trình phát báo lỗi → hiện thông báo thay vì im lặng.
    player.addEventListener('error', function () {
      if (!currentEl) return;
      currentEl.classList.remove('playing');
      toast('Chưa có audio cho ' + (currentEl.dataset.label || '“' + (currentEl.dataset.text || '') + '”'));
    });

    function makeChip(text, template, extraClass, n) {
      const b = el('button', 'bai-chip' + (extraClass ? ' ' + extraClass : ''), text);
      b.type = 'button';
      b.dataset.text = text;
      b.setAttribute('aria-label', 'Nghe “' + text + '”');
      b.addEventListener('click', function () { play(audioSrc(template, text, n), b); });
      return b;
    }

    // Nút số thứ tự: bấm để nghe (bài nghe). audioText = chữ dùng để suy ra tên file.
    function makeNumberChip(n, template, audioText) {
      const b = el('button', 'bai-chip bai-num', String(n));
      b.type = 'button';
      b.dataset.label = 'câu ' + n;
      b.setAttribute('aria-label', 'Nghe câu ' + n);
      b.addEventListener('click', function () { play(audioSrc(template, audioText, n), b); });
      return b;
    }

    // Nút "Hiện đáp án / Ẩn đáp án" — bật/tắt class is-revealed trên vùng bài tập.
    function makeRevealButton(area) {
      const btn = el('button', 'gram2-toggle-btn bai-reveal', 'Hiện đáp án');
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', function () {
        const on = area.classList.toggle('is-revealed');
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        btn.textContent = on ? 'Ẩn đáp án' : 'Hiện đáp án';
      });
      return btn;
    }

    // ---------- Các dạng bài tập ----------
    function exerciseHead(ex, n) {
      const wrap = el('div');
      const h = el('h3', 'bai-ex-head');
      h.appendChild(el('span', 'bai-ex-num', String(n)));
      h.appendChild(el('span', 'bai-ex-vi', ex.instructionVi || ''));
      wrap.appendChild(h);
      if (ex.instructionEn) wrap.appendChild(el('p', 'bai-ex-en', ex.instructionEn));
      return wrap;
    }

    // Nghe và lặp lại — lưới chữ cái
    function renderLetters(ex) {
      const grid = el('div', 'bai-letters');
      (ex.rows || []).forEach(function (row) {
        row.forEach(function (ch) { grid.appendChild(makeChip(ch, ex.audio)); });
      });
      return grid;
    }

    // Nghe và lặp lại — bảng vần theo nhóm màu
    function renderSounds(ex) {
      const wrap = el('div', 'bai-sounds');
      (ex.columns || []).forEach(function (groups) {
        const col = el('div', 'bai-sound-col');
        groups.forEach(function (g) {
          (g.rows || []).forEach(function (row) {
            for (let i = 0; i < 3; i++) {
              if (row[i] == null) {
                const gap = el('span'); gap.setAttribute('aria-hidden', 'true');
                col.appendChild(gap);
              } else {
                col.appendChild(makeChip(row[i], ex.audio, 'bai-tone-' + (g.tone || 'violet')));
              }
            }
          });
        });
        wrap.appendChild(col);
      });
      return wrap;
    }

    // Nghe và khoanh tròn: bấm số → nghe đáp án; bấm ô → khoanh tròn; nút hiện đáp án
    function renderListenChoose(ex) {
      const area = el('div', 'bai-answer-area');
      const grid = el('div', 'bai-choose');
      (ex.items || []).forEach(function (item, i) {
        grid.appendChild(makeNumberChip(i + 1, ex.audio, item.answer));
        const opts = [];
        (item.options || []).forEach(function (o) {
          const b = el('button', 'bai-chip bai-tone-pink bai-option', o);
          b.type = 'button';
          b.setAttribute('aria-pressed', 'false');
          if (o === item.answer) b.classList.add('is-answer');
          b.addEventListener('click', function () {
            const on = !b.classList.contains('is-circled');
            opts.forEach(function (x) { x.classList.remove('is-circled'); x.setAttribute('aria-pressed', 'false'); });
            if (on) { b.classList.add('is-circled'); b.setAttribute('aria-pressed', 'true'); }
          });
          opts.push(b);
          grid.appendChild(b);
        });
      });
      area.appendChild(grid);
      const row = el('div', 'bai-reveal-row');
      row.appendChild(makeRevealButton(area));
      area.appendChild(row);
      return area;
    }

    // Nghe và lặp lại — âm tiết theo 6 thanh điệu
    function renderTones(ex) {
      const grid = el('div', 'bai-tones');
      (ex.rows || []).forEach(function (r) {
        const tone = 'bai-tone-' + (r.tone || 'violet');
        grid.appendChild(el('div', 'bai-label ' + tone, r.label));
        (r.words || []).forEach(function (w) { grid.appendChild(makeChip(w, ex.audio, tone)); });
      });
      return grid;
    }

    // Nghe và điền tên vào chỗ trống: bấm số → nghe cả câu; nút hiện đáp án
    function renderFillBlank(ex) {
      const area = el('div', 'bai-answer-area');
      const list = el('div', 'bai-sentences');
      (ex.items || []).forEach(function (item, i) {
        const row = el('div', 'bai-sentence');
        row.appendChild(makeNumberChip(i + 1, ex.audio, item.answer));
        const text = el('p', 'bai-sentence-text');
        text.appendChild(document.createTextNode(item.before || ''));
        const blank = el('span', 'bai-blank');
        blank.appendChild(el('span', 'bai-blank-answer', item.answer));
        text.appendChild(blank);
        text.appendChild(document.createTextNode(item.after || ''));
        row.appendChild(text);
        list.appendChild(row);
      });
      area.appendChild(list);
      const row = el('div', 'bai-reveal-row');
      row.appendChild(makeRevealButton(area));
      area.appendChild(row);
      return area;
    }

    const RENDERERS = {
      'letters': renderLetters,
      'sounds': renderSounds,
      'listen-choose': renderListenChoose,
      'tones': renderTones,
      'fill-blank': renderFillBlank
    };

    function renderExercises(container, exercises) {
      (exercises || []).forEach(function (ex, i) {
        const box = el('div', 'bai-exercise');
        box.appendChild(exerciseHead(ex, ex.num != null ? ex.num : i + 1));
        const fn = RENDERERS[ex.type];
        box.appendChild(fn ? fn(ex) : emptyNote('Dạng bài “' + ex.type + '” chưa được hỗ trợ.'));
        container.appendChild(box);
      });
    }

    // Một mục con có thể có nhiều trang: pages = [{exercises:[...]}, ...] (hoặc exercises = [...] cho 1 trang)
    function pagesOf(sub) {
      if (!sub) return [];
      if (sub.pages && sub.pages.length) return sub.pages;
      if (sub.exercises && sub.exercises.length) return [{ exercises: sub.exercises }];
      return [];
    }

    // ---------- Khung: sidebar (section → mục con) + nội dung ----------
    function buildLesson(item) {
      const sections = item.sections || [];
      $panel.innerHTML = '';

      const shell = buildSectionShell('', function () { location.href = 'lessons.html?level=' + encodeURIComponent(level); });
      const pill = shell.querySelector('.gram2-tab-pill');
      $panel.appendChild(shell);

      const body = el('div', 'gram2-body');
      const sidebar = el('aside', 'gram2-sidebar');
      const content = el('div', 'gram2-content');
      body.appendChild(sidebar);
      body.appendChild(content);
      shell.appendChild(body);

      const entries = [];   // { key, section, sub, btn, header, list, chevron }
      let current = null;   // { entry, page } — để phím ← → biết đang ở đâu

      function scrollToContentOnMobile() {
        if (!window.matchMedia('(max-width: 720px)').matches) return;
        window.requestAnimationFrame(function () {
          const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 0;
          window.scrollTo({ top: content.getBoundingClientRect().top + window.scrollY - headerH - 12, behavior: 'smooth' });
        });
      }

      function makePager(entry, page, total) {
        const pager = el('div', 'bai-pager');
        const prev = el('button', 'bai-pager-btn', '←'); prev.type = 'button';
        const next = el('button', 'bai-pager-btn', '→'); next.type = 'button';
        prev.setAttribute('aria-label', 'Trang trước');
        next.setAttribute('aria-label', 'Trang sau');
        prev.disabled = page === 0;
        next.disabled = page === total - 1;
        prev.addEventListener('click', function () { show(entry, page - 1); });
        next.addEventListener('click', function () { show(entry, page + 1); });
        pager.appendChild(prev);
        pager.appendChild(el('span', 'bai-pager-count', (page + 1) + ' / ' + total));
        pager.appendChild(next);
        return pager;
      }

      // Vẽ nội dung của một mục (và một trang trong mục đó)
      function show(entry, page) {
        const pages = pagesOf(entry.sub);
        page = Math.max(0, Math.min(page || 0, Math.max(pages.length - 1, 0)));
        current = { entry: entry, page: page, total: pages.length };

        pill.textContent = entry.section.titleVi;
        content.innerHTML = '';
        const head = el('div', 'bai-content-head');
        head.appendChild(el('h2', 'gram2-content-title', entry.sub ? entry.sub.label : entry.section.titleVi));
        if (pages.length > 1) head.appendChild(makePager(entry, page, pages.length));
        content.appendChild(head);

        if (!entry.sub) content.appendChild(emptyNote('Phần “' + entry.section.titleVi + '” đang được soạn.'));
        else if (!pages.length) content.appendChild(emptyNote('Mục này đang được soạn.'));
        else renderExercises(content, pages[page].exercises);

        const hash = entry.key + (pages.length > 1 ? '/' + (page + 1) : '');
        try { history.replaceState(null, '', '#' + hash); } catch (e) {}
      }

      function select(entry, opts) {
        entries.forEach(function (e) {
          e.btn && e.btn.classList.toggle('active', e === entry);
          e.isStatic && e.header.classList.toggle('active', e === entry);
        });
        // Mở section chứa mục đang chọn
        if (entry.list && entry.list.classList.contains('gram2-collapsed')) {
          entry.list.classList.remove('gram2-collapsed');
          entry.chevron.textContent = '▾';
        }
        show(entry, (opts && opts.page) || 0);
        if (opts && opts.scroll) scrollToContentOnMobile();
      }

      // Phím ← → để lật trang khi đang dạy
      document.addEventListener('keydown', function (e) {
        if (!current || current.total < 2 || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        const t = e.target && e.target.tagName;
        if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
        if (e.key === 'ArrowRight' && current.page < current.total - 1) { e.preventDefault(); show(current.entry, current.page + 1); }
        else if (e.key === 'ArrowLeft' && current.page > 0) { e.preventDefault(); show(current.entry, current.page - 1); }
      });

      sections.forEach(function (section, si) {
        const secBox = el('div', 'gram2-section');
        const header = el('button', 'gram2-section-header'); header.type = 'button';
        const titles = el('div', 'gram2-section-titles');
        titles.appendChild(el('div', 'gram2-section-title-vi', (si + 1) + '. ' + section.titleVi));
        if (section.titleEn) titles.appendChild(el('div', 'gram2-section-title-en', section.titleEn));
        header.appendChild(titles);
        const chevron = el('span', 'gram2-chevron', '▾');
        header.appendChild(chevron);
        secBox.appendChild(header);

        const subs = section.subtopics || [];
        if (!subs.length) {
          // Section chưa có mục con: bấm vào tiêu đề là chọn luôn section.
          header.classList.add('is-static');
          const entry = { key: section.id, section: section, sub: null, header: header, isStatic: true };
          entries.push(entry);
          header.addEventListener('click', function () { select(entry, { scroll: true }); });
        } else {
          const list = el('div', 'gram2-subtopic-list');
          subs.forEach(function (sub) {
            const btn = el('button', 'gram2-subtopic-btn', sub.label); btn.type = 'button';
            const entry = { key: section.id + '/' + sub.id, section: section, sub: sub, btn: btn, list: list, chevron: chevron };
            entries.push(entry);
            btn.addEventListener('click', function () { select(entry, { scroll: true }); });
            list.appendChild(btn);
          });
          secBox.appendChild(list);
          // Chỉ mở section đầu tiên lúc đầu; select() sẽ tự mở section chứa mục được chọn.
          if (si !== 0) { list.classList.add('gram2-collapsed'); chevron.textContent = '▸'; }
          header.addEventListener('click', function () {
            const collapsed = list.classList.toggle('gram2-collapsed');
            chevron.textContent = collapsed ? '▸' : '▾';
          });
        }
        sidebar.appendChild(secBox);
      });

      // Mở đúng chỗ đang dạy khi tải lại trang: #phat-am/bang-chu-cai/3 (mục con + số trang), mặc định mục đầu tiên.
      const hashParts = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
      const wantedKey = hashParts.length >= 2 ? hashParts[0] + '/' + hashParts[1] : hashParts[0];
      const wantedPage = hashParts.length >= 3 ? (parseInt(hashParts[2], 10) || 1) - 1 : 0;
      const first = entries.filter(function (e) { return e.key === wantedKey; })[0]
        || entries.filter(function (e) { return e.sub; })[0]
        || entries[0];
      if (first) select(first, { page: wantedPage });
    }

    // ---------- Load ----------
    (async function () {
      try {
        if (!SAFE_ID.test(itemId) || !SAFE_ID.test(level)) throw new Error('Bad id');
        const res = await fetch(level + '/bai/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();
        document.title = 'Bài ' + item.num + ': ' + item.title + ' — hoc voi hanh';
        $title.textContent = 'Bài ' + item.num + ': ' + item.title;
        buildLesson(item);
      } catch (err) {
        console.error(err);
        $title.textContent = 'Không tải được bài học';
        $panel.innerHTML = '<p class="note">Không tìm thấy file <code>' + level + '/bai/' + itemId + '.json</code>.</p>';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="account-widget.js"></script>
</body>
