<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in &amp; Progress — hoc voi hanh</title>

<!-- ========================================================= -->
<!--  FIREBASE SDK (phiên bản compat — dễ dùng, không cần build tool) -->
<!-- ========================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink:#1c2333;
    --ink-soft:#4a5268;
    --paper:#f7f6f2;
    --paper-raised:#ffffff;
    --line:#dcd9d0;
    --accent:#c8781f;
    --accent-soft:#f2e2cf;
    --good:#2f6f52;
    --good-soft:#e2efe6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .shell{
    max-width:560px;
    margin:0 auto;
    padding:48px 20px 80px;
  }
  h1{
    font-size:1.5rem;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:0.95rem;
    margin:0 0 32px;
  }
  .panel{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px;
    margin-bottom:20px;
  }
  label{
    display:block;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:14px 0 6px;
  }
  label:first-child{ margin-top:0; }
  input[type=email], input[type=password], input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:0.95rem;
    background:var(--paper);
    color:var(--ink);
  }
  input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:10px 16px;
    font-size:0.9rem;
    font-weight:600;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    flex:1;
  }
  .btn-primary:hover{ background:#b3691a; }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    flex:1;
  }
  .btn-ghost:hover{ background:var(--paper); }
  .msg{
    font-size:0.85rem;
    margin-top:12px;
    padding:8px 10px;
    border-radius:6px;
  }
  .msg.error{ background:#fbeaea; color:#a3342a; }
  .msg.ok{ background:var(--good-soft); color:var(--good); }
  .hidden{ display:none !important; }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  .who{ font-size:0.9rem; color:var(--ink-soft); }
  .who b{ color:var(--ink); }
  .logout{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:6px 12px;
    font-size:0.82rem;
    font-weight:500;
  }
  .logout:hover{ background:var(--paper); }

  .lesson{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .lesson:last-child{ border-bottom:none; }
  .lesson-name{ font-weight:600; font-size:0.95rem; }
  .lesson-meta{ font-size:0.8rem; color:var(--ink-soft); margin-top:2px; }
  .tag{
    font-size:0.78rem;
    font-weight:600;
    padding:4px 10px;
    border-radius:99px;
  }
  .tag.done{ background:var(--good-soft); color:var(--good); }
  .tag.todo{ background:var(--accent-soft); color:var(--accent); }
  .lesson-action{ display:flex; align-items:center; gap:10px; }
  .mark-btn{
    background:var(--ink);
    color:#fff;
    padding:6px 12px;
    font-size:0.8rem;
  }
  .mark-btn:hover{ background:#000; }

  .switch-link{
    font-size:0.87rem;
    color:var(--ink-soft);
    margin:16px 0 0;
    text-align:center;
  }
  .switch-link a{
    color:var(--accent);
    font-weight:600;
    text-decoration:none;
  }
  .switch-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="shell">

  <!-- ============ SIGN IN / CREATE ACCOUNT SCREENS ============ -->
  <div id="auth-screen">

    <!-- ---- Sign in ---- -->
    <div id="view-signin">
      <h1>Sign in</h1>
      <p class="subtitle">Sign in to save your progress.</p>

      <div class="panel">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" placeholder="email@example.com" />

        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" placeholder="At least 6 characters" />

        <div class="row">
          <button class="btn-primary" onclick="dangNhap()">Sign in</button>
        </div>

        <p class="switch-link">New here? <a href="#" onclick="showView('signup'); return false;">Create your new account</a></p>

        <div id="signin-msg"></div>
      </div>
    </div>

    <!-- ---- Create account ---- -->
    <div id="view-signup" class="hidden">
      <h1>Create your account</h1>
      <p class="subtitle">Create an account to save your progress and get a personalized learning path.</p>

      <div class="panel">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="username123" />

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="email@example.com" />

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters" />

        <div class="row">
          <button class="btn-primary" onclick="dangKy()">Create account</button>
        </div>

        <p class="switch-link">Already have an account? <a href="#" onclick="showView('signin'); return false;">Sign in</a></p>

        <div id="signup-msg"></div>
      </div>
    </div>

  </div>

  <!-- ============ SCREEN AFTER SIGN IN ============ -->
  <div id="app-screen" class="hidden">
    <div class="topbar">
      <div class="who">Welcome, <b id="user-email"></b></div>
      <button class="logout" onclick="dangXuat()">Sign out</button>
    </div>

    <div class="panel">
      <div id="lesson-list"></div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   1) CẤU HÌNH FIREBASE
   -----------------------------------------------------------
   Thay các giá trị bên dưới bằng thông tin project Firebase
   của bạn: vào https://console.firebase.google.com
   -> Tạo project -> Project settings -> "Your apps" -> Web app
   -> Bật Authentication (Email/Password) và Firestore Database.
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDX1lJ_xBPAgWpireowMwQMbrmof7gtHfQ",
  authDomain: "hocvoihanh.firebaseapp.com",
  projectId: "hocvoihanh",
  storageBucket: "hocvoihanh.firebasestorage.app",
  messagingSenderId: "447968761171",
  appId: "1:447968761171:web:8d4ec91591fd02dd22fda6",
  measurementId: "G-X94RF3RXCT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =========================================================
   2) DANH SÁCH BÀI HỌC — sửa lại cho đúng nội dung của bạn
========================================================= */
const DANH_SACH_BAI = [
  { id: "bai1", ten: "Lesson 1 — Introduction" },
  { id: "bai2", ten: "Lesson 2 — Basic grammar" },
  { id: "bai3", ten: "Lesson 3 — Practice exercises" },
  { id: "bai4", ten: "Lesson 4 — Chapter test" }
];

let uidHienTai = null;
let tienDoHienTai = {};

/* =========================================================
   0) CHUYỂN GIỮA 2 VIEW (Sign in / Create account)
   -----------------------------------------------------------
   Cho phép trang chủ liên kết thẳng tới đúng thao tác:
   hoc-tap-demo.html?mode=signup  -> mở màn Create account
   hoc-tap-demo.html?mode=login   -> mở màn Sign in (mặc định)
========================================================= */
function showView(view) {
  const isSignup = view === "signup";
  document.getElementById("view-signin").classList.toggle("hidden", isSignup);
  document.getElementById("view-signup").classList.toggle("hidden", !isSignup);

  const url = new URL(location.href);
  url.searchParams.set("mode", isSignup ? "signup" : "login");
  history.replaceState(null, "", url);

  const focusId = isSignup ? "signup-username" : "signin-email";
  document.getElementById(focusId).focus();
}

(function apDungCheDo() {
  const mode = new URLSearchParams(location.search).get("mode");
  showView(mode === "signup" ? "signup" : "signin");
})();

/* =========================================================
   3) ĐĂNG KÝ / ĐĂNG NHẬP / ĐĂNG XUẤT
========================================================= */
function hienThiLoi(targetId, text) {
  const el = document.getElementById(targetId);
  el.innerHTML = `<div class="msg error">${text}</div>`;
}

function dangKy() {
  const username = document.getElementById("signup-username").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  if (!username || !email || !password) {
    return hienThiLoi("signup-msg", "Please fill in username, email, and password.");
  }

  auth.createUserWithEmailAndPassword(email, password)
    .then(cred => {
      return cred.user.updateProfile({ displayName: username })
        .then(() => db.collection("users").doc(cred.user.uid).set({
          username: username,
          email: email,
          progress: {}
        }));
    })
    .catch(err => hienThiLoi("signup-msg", dichLoi(err)));
}

function dangNhap() {
  const email = document.getElementById("signin-email").value.trim();
  const password = document.getElementById("signin-password").value;
  if (!email || !password) return hienThiLoi("signin-msg", "Please enter your email and password.");

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => hienThiLoi("signin-msg", dichLoi(err)));
}

function dangXuat() {
  auth.signOut();
}

function dichLoi(err) {
  const map = {
    "auth/email-already-in-use": "This email is already registered.",
    "auth/invalid-email": "Invalid email address.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Incorrect email or password."
  };
  return map[err.code] || ("Something went wrong: " + err.message);
}

/* =========================================================
   4) THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
   -----------------------------------------------------------
   Đăng nhập/tạo tài khoản xong thì quay về trang chủ luôn,
   không ở lại đây nữa.
========================================================= */
auth.onAuthStateChanged(user => {
  if (user) {
    uidHienTai = user.uid;
    location.href = "index.html";
  } else {
    uidHienTai = null;
    document.getElementById("app-screen").classList.add("hidden");
    document.getElementById("auth-screen").classList.remove("hidden");
  }
});

/* =========================================================
   5) ĐỌC / GHI TIẾN ĐỘ TỪ FIRESTORE
========================================================= */
function taiTienDo() {
  db.collection("users").doc(uidHienTai).get()
    .then(doc => {
      tienDoHienTai = (doc.exists && doc.data().progress) ? doc.data().progress : {};
      veLaiDanhSachBai();
    })
    .catch(err => console.error("Error loading progress:", err));
}

function danhDauHoanThanh(baiId) {
  tienDoHienTai[baiId] = {
    done: true,
    date: new Date().toISOString()
  };

  db.collection("users").doc(uidHienTai)
    .set({ progress: tienDoHienTai }, { merge: true })
    .then(() => veLaiDanhSachBai())
    .catch(err => console.error("Error saving progress:", err));
}

/* =========================================================
   6) VẼ GIAO DIỆN DANH SÁCH BÀI
========================================================= */
function veLaiDanhSachBai() {
  const container = document.getElementById("lesson-list");
  container.innerHTML = "";

  DANH_SACH_BAI.forEach(bai => {
    const daXong = tienDoHienTai[bai.id] && tienDoHienTai[bai.id].done;
    const ngay = daXong ? new Date(tienDoHienTai[bai.id].date).toLocaleDateString("en-US") : null;

    const div = document.createElement("div");
    div.className = "lesson";
    div.innerHTML = `
      <div>
        <div class="lesson-name">${bai.ten}</div>
        <div class="lesson-meta">${daXong ? "Completed on " + ngay : "Not started"}</div>
      </div>
      <div class="lesson-action">
        <span class="tag ${daXong ? "done" : "todo"}">${daXong ? "Done" : "Not done"}</span>
        ${daXong ? "" : `<button class="mark-btn" onclick="danhDauHoanThanh('${bai.id}')">Mark as done</button>`}
      </div>
    `;
    container.appendChild(div);
  });
}
</script>
</body>
</html>
