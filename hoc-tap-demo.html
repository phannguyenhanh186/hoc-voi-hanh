<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in &amp; Progress — hoc voi hanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- ========================================================= -->
<!--  FIREBASE SDK (phiên bản compat — dễ dùng, không cần build tool) -->
<!-- ========================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  /* Scoped styles for the auth screen — reuses design tokens from style.css
     (colors, stroke borders, hard shadows, Nunito/Main font) so this page
     matches the rest of the site instead of having its own look. */

  .auth-main{ padding: 40px 0 80px; }
  .shell{
    max-width:440px;
    margin:0 auto;
  }
  .auth-head{ text-align:center; margin-bottom:22px; }
  .auth-head h1{
    font-family: var(--font-display);
    font-size:1.7rem;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-.3px;
    color:var(--ink);
  }
  .subtitle{
    color:var(--muted);
    font-size:.95rem;
    margin:0;
  }
  .panel{
    background:var(--surface);
    border:2px solid var(--stroke);
    border-radius:22px;
    padding:26px 24px;
    box-shadow:6px 6px 0 0 var(--stroke);
  }
  label{
    display:block;
    font-family: var(--font-display);
    font-weight:700;
    font-size:.82rem;
    color:var(--ink);
    margin:16px 0 6px;
  }
  label:first-child{ margin-top:0; }
  input[type=email], input[type=password], input[type=text]{
    width:100%;
    padding:11px 14px;
    border:1.5px solid var(--stroke);
    border-radius:12px;
    font-family: var(--font-body);
    font-size:.95rem;
    background:var(--surface);
    color:var(--ink);
  }
  input[type=email]::placeholder, input[type=password]::placeholder, input[type=text]::placeholder{ color:#9694a0; }
  input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .row{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  button{
    cursor:pointer;
    font-family: var(--font-display);
  }
  .btn-primary{
    display:block; width:100%;
    background:var(--primary);
    color:var(--ink);
    border:1.5px solid var(--stroke);
    border-radius:999px;
    padding:12px 16px;
    font-weight:700;
    font-size:1rem;
    flex:1;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{ transform: translate(-2px, -2px); box-shadow: 4px 4px 0 0 var(--stroke); }
  .msg{
    font-family: var(--font-body);
    font-size:.85rem;
    margin-top:14px;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--stroke);
  }
  .msg.error{ background:#FDEAEA; color:#9A2E2C; }
  .msg.ok{ background:var(--green); color:#274a24; }
  .hidden{ display:none !important; }

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .who{ font-size:.92rem; color:var(--muted); }
  .who b{ color:var(--ink); }
  .logout{
    background:var(--surface);
    border:1.5px solid var(--stroke);
    color:var(--ink);
    border-radius:999px;
    padding:7px 16px;
    font-size:.85rem;
    font-weight:700;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .logout:hover{ transform: translate(-2px, -2px); box-shadow: 4px 4px 0 0 var(--stroke); }

  .lesson{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px dotted var(--line);
  }
  .lesson:last-child{ border-bottom:none; }
  .lesson-name{ font-family: var(--font-display); font-weight:700; font-size:.96rem; color:var(--ink); }
  .lesson-meta{ font-size:.8rem; color:var(--muted); margin-top:2px; }
  .tag{
    font-family: var(--font-display);
    font-size:.72rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:999px;
    border:1.5px solid var(--stroke);
  }
  .tag.done{ background:var(--green); color:#274a24; }
  .tag.todo{ background:var(--yellow); color:#6b4e1f; }
  .lesson-action{ display:flex; align-items:center; gap:10px; }
  .mark-btn{
    background:var(--accent-deep);
    color:#fff;
    border:1.5px solid var(--stroke);
    border-radius:999px;
    padding:7px 14px;
    font-size:.8rem;
    font-weight:700;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .mark-btn:hover{ transform: translate(-2px, -2px); box-shadow: 3px 3px 0 0 var(--stroke); }

  .switch-link{
    font-size:.88rem;
    color:var(--muted);
    margin:18px 0 0;
    text-align:center;
  }
  .switch-link a{
    color:var(--accent-deep);
    font-weight:700;
    text-decoration:none;
  }
  .switch-link a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <a class="back-link" href="index.html">← home</a>
        </div>
      </nav>
    </div>
  </header>

<main class="wrap auth-main">
<div class="shell">

  <!-- ============ SIGN IN / CREATE ACCOUNT SCREENS ============ -->
  <div id="auth-screen">

    <!-- ---- Sign in ---- -->
    <div id="view-signin">
      <div class="auth-head">
        <h1>Sign in</h1>
        <p class="subtitle">Sign in to save your progress.</p>
      </div>

      <div class="panel">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" placeholder="email@example.com" />

        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" placeholder="At least 6 characters" />

        <div class="row">
          <button class="btn-primary" onclick="dangNhap()">Sign in</button>
        </div>

        <p class="switch-link">New here? <a href="#" onclick="showView('signup'); return false;">Create your new account</a></p>

        <div id="signin-msg"></div>
      </div>
    </div>

    <!-- ---- Create account ---- -->
    <div id="view-signup" class="hidden">
      <div class="auth-head">
        <h1>Create your account</h1>
        <p class="subtitle">Create an account to save your progress and get a personalized learning path.</p>
      </div>

      <div class="panel">
        <label for="signup-username">Firstname/Nickname</label>
        <input type="text" id="signup-username" placeholder="e.g. Hạnh" />

        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="email@example.com" />

        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="At least 6 characters" />

        <div class="row">
          <button class="btn-primary" onclick="dangKy()">Create account</button>
        </div>

        <p class="switch-link">Already have an account? <a href="#" onclick="showView('signin'); return false;">Sign in</a></p>

        <div id="signup-msg"></div>
      </div>
    </div>

  </div>

  <!-- ============ SCREEN AFTER SIGN IN ============ -->
  <div id="app-screen" class="hidden">
    <div class="topbar">
      <div class="who">Welcome, <b id="user-email"></b></div>
      <button class="logout" onclick="dangXuat()">Sign out</button>
    </div>

    <div class="panel">
      <div id="lesson-list"></div>
    </div>
  </div>

</div>
</main>

<script>
/* =========================================================
   1) CẤU HÌNH FIREBASE
   -----------------------------------------------------------
   Thay các giá trị bên dưới bằng thông tin project Firebase
   của bạn: vào https://console.firebase.google.com
   -> Tạo project -> Project settings -> "Your apps" -> Web app
   -> Bật Authentication (Email/Password) và Firestore Database.
========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDX1lJ_xBPAgWpireowMwQMbrmof7gtHfQ",
  authDomain: "hocvoihanh.firebaseapp.com",
  projectId: "hocvoihanh",
  storageBucket: "hocvoihanh.firebasestorage.app",
  messagingSenderId: "447968761171",
  appId: "1:447968761171:web:8d4ec91591fd02dd22fda6",
  measurementId: "G-X94RF3RXCT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =========================================================
   2) DANH SÁCH BÀI HỌC — sửa lại cho đúng nội dung của bạn
========================================================= */
const DANH_SACH_BAI = [
  { id: "bai1", ten: "Lesson 1 — Introduction" },
  { id: "bai2", ten: "Lesson 2 — Basic grammar" },
  { id: "bai3", ten: "Lesson 3 — Practice exercises" },
  { id: "bai4", ten: "Lesson 4 — Chapter test" }
];

let uidHienTai = null;
let tienDoHienTai = {};
let dangTaoTaiKhoan = false; // true trong lúc đang tạo tài khoản, để tạm hoãn redirect
                              // cho đến khi đã lưu xong username (displayName)

/* =========================================================
   0) CHUYỂN GIỮA 2 VIEW (Sign in / Create account)
   -----------------------------------------------------------
   Cho phép trang chủ liên kết thẳng tới đúng thao tác:
   hoc-tap-demo.html?mode=signup  -> mở màn Create account
   hoc-tap-demo.html?mode=login   -> mở màn Sign in (mặc định)
========================================================= */
function showView(view) {
  const isSignup = view === "signup";
  document.getElementById("view-signin").classList.toggle("hidden", isSignup);
  document.getElementById("view-signup").classList.toggle("hidden", !isSignup);

  const url = new URL(location.href);
  url.searchParams.set("mode", isSignup ? "signup" : "login");
  history.replaceState(null, "", url);

  const focusId = isSignup ? "signup-username" : "signin-email";
  document.getElementById(focusId).focus();
}

(function apDungCheDo() {
  const mode = new URLSearchParams(location.search).get("mode");
  showView(mode === "signup" ? "signup" : "signin");
})();

/* =========================================================
   3) ĐĂNG KÝ / ĐĂNG NHẬP / ĐĂNG XUẤT
========================================================= */
function hienThiLoi(targetId, text) {
  const el = document.getElementById(targetId);
  el.innerHTML = `<div class="msg error">${text}</div>`;
}

function dangKy() {
  const username = document.getElementById("signup-username").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  if (!username || !email || !password) {
    return hienThiLoi("signup-msg", "Please fill in username, email, and password.");
  }

  dangTaoTaiKhoan = true; // hoãn redirect ở onAuthStateChanged cho tới khi xong bên dưới
  auth.createUserWithEmailAndPassword(email, password)
    .then(cred => {
      return cred.user.updateProfile({ displayName: username })
        .then(() => db.collection("users").doc(cred.user.uid).set({
          username: username,
          email: email,
          progress: {}
        }));
    })
    .then(() => {
      dangTaoTaiKhoan = false;
      location.href = "index.html"; // lúc này displayName đã chắc chắn được lưu
    })
    .catch(err => {
      dangTaoTaiKhoan = false;
      hienThiLoi("signup-msg", dichLoi(err));
    });
}

function dangNhap() {
  const email = document.getElementById("signin-email").value.trim();
  const password = document.getElementById("signin-password").value;
  if (!email || !password) return hienThiLoi("signin-msg", "Please enter your email and password.");

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => hienThiLoi("signin-msg", dichLoi(err)));
}

function dangXuat() {
  auth.signOut();
}

function dichLoi(err) {
  const map = {
    "auth/email-already-in-use": "This email is already registered.",
    "auth/invalid-email": "Invalid email address.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/user-not-found": "No account found with this email.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-credential": "Incorrect email or password."
  };
  return map[err.code] || ("Something went wrong: " + err.message);
}

/* =========================================================
   4) THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
   -----------------------------------------------------------
   Đăng nhập/tạo tài khoản xong thì quay về trang chủ luôn,
   không ở lại đây nữa.
========================================================= */
auth.onAuthStateChanged(user => {
  if (user) {
    uidHienTai = user.uid;
    if (!dangTaoTaiKhoan) {
      location.href = "index.html";
    }
    // nếu đang trong lúc dangKy() xử lý, để hàm đó tự redirect
    // sau khi displayName đã lưu xong (tránh hiện email thay vì username)
  } else {
    uidHienTai = null;
    document.getElementById("app-screen").classList.add("hidden");
    document.getElementById("auth-screen").classList.remove("hidden");
  }
});

/* =========================================================
   5) ĐỌC / GHI TIẾN ĐỘ TỪ FIRESTORE
========================================================= */
function taiTienDo() {
  db.collection("users").doc(uidHienTai).get()
    .then(doc => {
      tienDoHienTai = (doc.exists && doc.data().progress) ? doc.data().progress : {};
      veLaiDanhSachBai();
    })
    .catch(err => console.error("Error loading progress:", err));
}

function danhDauHoanThanh(baiId) {
  tienDoHienTai[baiId] = {
    done: true,
    date: new Date().toISOString()
  };

  db.collection("users").doc(uidHienTai)
    .set({ progress: tienDoHienTai }, { merge: true })
    .then(() => veLaiDanhSachBai())
    .catch(err => console.error("Error saving progress:", err));
}

/* =========================================================
   6) VẼ GIAO DIỆN DANH SÁCH BÀI
========================================================= */
function veLaiDanhSachBai() {
  const container = document.getElementById("lesson-list");
  container.innerHTML = "";

  DANH_SACH_BAI.forEach(bai => {
    const daXong = tienDoHienTai[bai.id] && tienDoHienTai[bai.id].done;
    const ngay = daXong ? new Date(tienDoHienTai[bai.id].date).toLocaleDateString("en-US") : null;

    const div = document.createElement("div");
    div.className = "lesson";
    div.innerHTML = `
      <div>
        <div class="lesson-name">${bai.ten}</div>
        <div class="lesson-meta">${daXong ? "Completed on " + ngay : "Not started"}</div>
      </div>
      <div class="lesson-action">
        <span class="tag ${daXong ? "done" : "todo"}">${daXong ? "Done" : "Not done"}</span>
        ${daXong ? "" : `<button class="mark-btn" onclick="danhDauHoanThanh('${bai.id}')">Mark as done</button>`}
      </div>
    `;
    container.appendChild(div);
  });
}
</script>
</body>
</html>
