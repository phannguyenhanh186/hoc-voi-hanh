<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <a class="back-link" href="index.html">← trang chủ</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="lesson-head">
      <h1 id="title">Đang tải…</h1>
    </div>
    <div class="lesson-grid" id="cards"><p class="note">Đang tải…</p></div>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <script>
    const LEVELS = { mam: 'mầm', choi: 'chồi', la: 'lá' };
    const activeLevel = new URLSearchParams(location.search).get('level') || 'mam';
    document.getElementById('title').textContent = 'Cấp ' + (LEVELS[activeLevel] || activeLevel);
    document.title = 'Cấp ' + (LEVELS[activeLevel] || activeLevel) + ' — hoc voi hanh';

    function el(tag, cls) { const n = document.createElement(tag); if (cls) n.className = cls; return n; }

    // ===== Bảng màu + hoạ tiết xoay tua (độc lập với nhau) =====
    const TILE_COLORS = [
      { bg: '#7A63EE', pat: '#8C78F1' }, // tím
      { bg: '#F8C670', pat: '#F7B749' }, // cam
      { bg: '#BDE5F9', pat: '#9AD7F5' }, // cyan
      { bg: '#F1CDDE', pat: '#EBB5CF' }, // hồng
      { bg: '#4E58EC', pat: '#5C65E6' }, // xanh dương
      { bg: '#FB7476', pat: '#F89697' }  // đỏ
    ];
    const TILE_PATTERNS = ['diagonal', 'dots-filled', 'wave-h', 'diamond', 'stripes-v', 'polka', 'rings', 'stripes-h', 'wave-v', 'plaid'];

    function patternSvg(name, color) {
      const S = 28, sw = 2, op = 0.4;
      let inner = '';
      if (name === 'diagonal') {
        inner = '<path d="M-7 7 L7 -7" stroke="' + color + '" stroke-width="' + sw + '" opacity="' + op + '"/>'
          + '<path d="M7 35 L35 7" stroke="' + color + '" stroke-width="' + sw + '" opacity="' + op + '"/>'
          + '<path d="M-7 35 L21 7" stroke="' + color + '" stroke-width="' + sw + '" opacity="' + op + '"/>';
      } else if (name === 'dots-filled') {
        inner = '<circle cx="7" cy="7" r="4.5" fill="' + color + '" opacity="' + op + '"/>'
          + '<circle cx="21" cy="21" r="4.5" fill="' + color + '" opacity="' + op + '"/>';
      } else if (name === 'wave-h') {
        inner = '<path d="M0 14 Q7 5 14 14 T28 14" stroke="' + color + '" stroke-width="' + sw + '" fill="none" opacity="' + op + '"/>';
      } else if (name === 'diamond') {
        inner = '<rect x="9" y="9" width="10" height="10" transform="rotate(45 14 14)" fill="none" stroke="' + color + '" stroke-width="' + sw + '" opacity="' + op + '"/>';
      } else if (name === 'stripes-v') {
        inner = '<line x1="5" y1="0" x2="5" y2="28" stroke="' + color + '" stroke-width="3" opacity="' + op + '"/>'
          + '<line x1="19" y1="0" x2="19" y2="28" stroke="' + color + '" stroke-width="3" opacity="' + op + '"/>';
      } else if (name === 'polka') {
        inner = '<circle cx="7" cy="7" r="2.2" fill="' + color + '" opacity="' + op + '"/>'
          + '<circle cx="21" cy="21" r="2.2" fill="' + color + '" opacity="' + op + '"/>'
          + '<circle cx="21" cy="7" r="1" fill="' + color + '" opacity="' + (op * 0.7) + '"/>'
          + '<circle cx="7" cy="21" r="1" fill="' + color + '" opacity="' + (op * 0.7) + '"/>';
      } else if (name === 'rings') {
        inner = '<circle cx="14" cy="14" r="7" fill="none" stroke="' + color + '" stroke-width="' + sw + '" opacity="' + op + '"/>';
      } else if (name === 'stripes-h') {
        inner = '<line x1="0" y1="5" x2="28" y2="5" stroke="' + color + '" stroke-width="3" opacity="' + op + '"/>'
          + '<line x1="0" y1="19" x2="28" y2="19" stroke="' + color + '" stroke-width="3" opacity="' + op + '"/>';
      } else if (name === 'wave-v') {
        inner = '<path d="M14 0 Q5 7 14 14 T14 28" stroke="' + color + '" stroke-width="' + sw + '" fill="none" opacity="' + op + '"/>';
      } else if (name === 'plaid') {
        inner = '<line x1="0" y1="9" x2="28" y2="9" stroke="' + color + '" stroke-width="1.5" opacity="' + op + '"/>'
          + '<line x1="0" y1="20" x2="28" y2="20" stroke="' + color + '" stroke-width="1.5" opacity="' + op + '"/>'
          + '<line x1="9" y1="0" x2="9" y2="28" stroke="' + color + '" stroke-width="1.5" opacity="' + op + '"/>'
          + '<line x1="20" y1="0" x2="20" y2="28" stroke="' + color + '" stroke-width="1.5" opacity="' + op + '"/>';
      }
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + S + '" height="' + S + '">' + inner + '</svg>';
      return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
    }

    let tileIndex = 0;
    function nextTileTheme() {
      const c = TILE_COLORS[tileIndex % TILE_COLORS.length];
      const p = TILE_PATTERNS[tileIndex % TILE_PATTERNS.length];
      tileIndex++;
      return { bg: c.bg, pat: c.pat, pattern: p };
    }

    function readLessonProgress(level, id) {
      try {
        const saved = JSON.parse(localStorage.getItem('progress:' + level + ':' + id) || 'null');
        if (saved && typeof saved === 'object') {
          const total = saved.total || 0;
          const done = saved.done ? Object.keys(saved.done).filter(function (k) { return saved.done[k]; }).length : 0;
          return { done: Math.min(done, total || done), total: total };
        }
      } catch (e) {}
      return { done: 0, total: 0 };
    }

    function makeTile(opts) {
      // opts: { eyebrow, title, locked, href, hrefReview, progress: {done,total} }
      const theme = nextTileTheme();
      const tile = el('div', 'lesson-tile' + (opts.locked ? ' lesson-tile-locked' : ''));
      tile.style.background = theme.bg;
      tile.style.backgroundImage = patternSvg(theme.pattern, theme.pat);
      tile.style.backgroundRepeat = 'repeat';
      tile.style.backgroundSize = '28px 28px';

      const badge = el('span', 'lesson-tile-badge'); badge.textContent = opts.eyebrow;
      tile.appendChild(badge);

      const title = el('h3', 'lesson-tile-title'); title.textContent = opts.title;
      tile.appendChild(title);

      const status = el('div', 'lesson-tile-status');
      if (opts.locked) {
        status.textContent = '🔒 Sắp ra mắt';
      } else if (opts.progress) {
        const p = opts.progress;
        const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
        status.textContent = p.total ? ('✓ ' + p.done + '/' + p.total + ' (' + pct + '%)') : 'Chưa bắt đầu học';
      }
      tile.appendChild(status);

      const actions = el('div', 'lesson-tile-actions');
      if (opts.locked) {
        const soon = el('span', 'lesson-tile-btn lesson-tile-btn-disabled'); soon.textContent = 'Sắp ra mắt';
        actions.appendChild(soon);
      } else {
        const learnBtn = el('a', 'lesson-tile-btn'); learnBtn.textContent = 'Học ›'; learnBtn.href = opts.href;
        actions.appendChild(learnBtn);
        if (opts.hrefReview) {
          const reviewBtn = el('a', 'lesson-tile-btn lesson-tile-btn-secondary'); reviewBtn.textContent = 'Ôn tập ›'; reviewBtn.href = opts.hrefReview;
          actions.appendChild(reviewBtn);
        }
      }
      tile.appendChild(actions);
      return tile;
    }

    (async function () {
      const cards = document.getElementById('cards');
      try {
        const data = await (await fetch(activeLevel + '/units.json', { cache: 'no-cache' })).json();
        cards.innerHTML = '';

        (data.selfStudy || []).forEach(s => {
          const locked = s.status === 'todo';
          const href = s.id === 'tones' ? 'tones.html' : ('lesson.html?id=' + encodeURIComponent(s.id) + '&level=' + encodeURIComponent(activeLevel));
          cards.appendChild(makeTile({
            eyebrow: 'Tự học', title: s.title, locked: locked, href: href
          }));
        });

        const lessons = data.lessons || [];
        if (!lessons.length) { cards.innerHTML += '<p class="note">Chưa có bài nào ở cấp này.</p>'; return; }

        lessons.forEach(function (b) {
          const locked = b.status === 'todo';
          const base = 'lesson.html?id=' + encodeURIComponent(b.id) + '&level=' + encodeURIComponent(activeLevel);
          cards.appendChild(makeTile({
            eyebrow: 'BÀI ' + b.num,
            title: b.title,
            locked: locked,
            progress: locked ? null : readLessonProgress(activeLevel, b.id),
            href: base,
            hrefReview: base + '&tab=postclass'
          }));
        });
      } catch (e) { cards.innerHTML = '<p class="note">Could not load the lesson list.</p>'; }
    })();
  </script>
  <script src="pomodoro.js" defer></script>
</body>
</html>
