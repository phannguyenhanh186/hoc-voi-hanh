<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <a class="back-link" id="back-link" href="lessons.html">← lesson</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="lesson-head">
      <div class="meta-badges" id="meta-badges"></div>
      <h1 id="title">Loading…</h1>
    </div>

    <!-- Landing page của bài: chọn 1 trong 4 kỹ năng -> chuyển hẳn sang trang riêng
         (vocabulary.html / grammar.html / listening.html / reading.html), không còn
         là tab/panel trong cùng 1 trang nữa. Mỗi trang kỹ năng có nút back quay
         thẳng về đây (xem $backLink trong từng trang). -->
    <div class="lesson-hub" id="lesson-hub">
      <a class="hub-card hub-vocab" id="hub-vocab">
        <span class="hub-card-title">Vocabulary</span>
        <span class="hub-card-sub" id="hub-stat-vocab">…</span>
      </a>
      <a class="hub-card hub-grammar" id="hub-grammar">
        <span class="hub-card-title">Grammar</span>
        <span class="hub-card-sub" id="hub-stat-grammar">…</span>
      </a>
      <a class="hub-card hub-reading" id="hub-reading">
        <span class="hub-card-title">Reading</span>
        <span class="hub-card-sub" id="hub-stat-reading">…</span>
      </a>
      <a class="hub-card hub-listening" id="hub-listening">
        <span class="hub-card-title">Listening</span>
        <span class="hub-card-sub" id="hub-stat-listening">…</span>
      </a>
    </div>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <script>
    const params = new URLSearchParams(location.search);
    const itemId = params.get('id') || '';
    let level = params.get('level') || 'mam';

    const $title = document.getElementById('title');
    const $backLink = document.getElementById('back-link');

    function el(tag, cls, txt) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt != null) n.textContent = txt;
      return n;
    }

    function pageUrl(page) {
      return page + '.html?id=' + encodeURIComponent(itemId) + '&level=' + encodeURIComponent(level);
    }
    document.getElementById('hub-vocab').href = pageUrl('vocabulary');
    document.getElementById('hub-grammar').href = pageUrl('grammar');
    document.getElementById('hub-reading').href = pageUrl('reading');
    document.getElementById('hub-listening').href = pageUrl('listening');

    // ---------- Badge số liệu đầu trang (tổng số mục theo dữ liệu bài, không phải tiến độ) ----------
    function renderMetaBadges(item) {
      const wrap = document.getElementById('meta-badges');
      wrap.innerHTML = '';
      const counts = [
        ['🔤', ((item.vocab && item.vocab.items) || []).length + ' words'],
        ['📖', ((item.grammar && item.grammar.points) || []).length + ' grammar'],
        ['🎧', ((item.listening && item.listening.items) || []).length + ' listening'],
        ['📄', ((item.reading && item.reading.passages) || []).length + ' reading']
      ];
      counts.forEach(function (c) {
        wrap.appendChild(el('span', 'meta-badge', c[0] + ' ' + c[1]));
      });
    }

    // ---------- Số liệu trên từng thẻ hub ----------
    // Vocabulary: đọc trực tiếp từ localStorage (số từ đã "Remembered"), không cần tải nội dung.
    // Grammar/Listening/Reading: đọc số bài tập đã hoàn thành đã lưu bởi từng trang riêng
    // (tổng số bài tập của phần đó chỉ biết chính xác khi mở trang đó ra).
    function learnedWordsCountFor(vocabTotal) {
      try {
        const saved = JSON.parse(localStorage.getItem('learnedWords:' + level + ':' + itemId) || 'null');
        if (saved && typeof saved === 'object') {
          const n = Object.keys(saved).filter(function (k) { return saved[k]; }).length;
          return Math.min(n, vocabTotal);
        }
      } catch (e) {}
      return 0;
    }
    function sectionProgress(section) {
      try {
        const saved = JSON.parse(localStorage.getItem('progress:' + level + ':' + itemId + ':' + section) || 'null');
        if (saved && typeof saved === 'object') {
          const done = saved.done ? Object.keys(saved.done).filter(function (k) { return saved.done[k]; }).length : 0;
          return { done: done, total: saved.total || 0 };
        }
      } catch (e) {}
      return { done: 0, total: 0 };
    }
    function setHubStat(section, text) {
      const node = document.getElementById('hub-stat-' + section);
      if (node) node.textContent = text;
    }

    (async function () {
      try {
        const res = await fetch(level + '/items/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();

        document.title = (item.title || itemId) + ' — hoc voi hanh';
        $title.textContent = 'Bài ' + (item.num != null ? item.num : '') + (item.title ? ': ' + item.title : '');
        $backLink.href = 'lessons.html?level=' + encodeURIComponent(level);

        renderMetaBadges(item);

        const vocabTotal = (item.vocab && item.vocab.items) ? item.vocab.items.length : 0;
        setHubStat('vocab', learnedWordsCountFor(vocabTotal) + '/' + vocabTotal + ' words learned');

        ['grammar', 'listening', 'reading'].forEach(function (sec) {
          const p = sectionProgress(sec);
          setHubStat(sec, p.total ? (p.done + '/' + p.total + ' exercises done') : 'Chưa bắt đầu học');
        });
      } catch (err) {
        console.error(err);
        $title.textContent = 'Could not load the lesson';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>
</body>
</html>
