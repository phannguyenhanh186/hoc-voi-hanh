<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <a class="back-link" id="back-link" href="lessons.html">← Back</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="lesson-head">
      <div class="meta-badges" id="meta-badges"></div>
      <h1 id="title">Loading…</h1>
    </div>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-tab="vocab">Vocabulary</button>
        <button class="tab-btn" data-tab="grammar">Grammar</button>
        <button class="tab-btn" data-tab="listening">Listening</button>
        <button class="tab-btn" data-tab="reading">Reading</button>
      </div>
    </div>

    <section class="tab-panel" id="panel-vocab"><p class="note">Loading…</p></section>
    <section class="tab-panel" id="panel-grammar" hidden><p class="note">Loading…</p></section>
    <section class="tab-panel" id="panel-listening" hidden><p class="note">Loading…</p></section>
    <section class="tab-panel" id="panel-reading" hidden><p class="note">Loading…</p></section>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <script>
    const params = new URLSearchParams(location.search);
    const itemId = params.get('id') || '';
    let level = params.get('level') || 'mam';

    const $title = document.getElementById('title');
    const $backLink = document.getElementById('back-link');
    const $tabs = document.getElementById('tabs');
    const PANELS = ['vocab', 'grammar', 'listening', 'reading'];

    let voice = 'nam';
    try { voice = localStorage.getItem('voice') || 'nam'; } catch (e) {}
    function resolveAudio(path) { return (path || '').replace('{voice}', voice); }

    let player = new Audio();
    player.preload = 'auto';
    let currentEl = null;
    const customAudios = [];
    player.addEventListener('ended', function () { if (currentEl) currentEl.classList.remove('playing'); });
    function play(src, elm) {
      if (!src) return;
      customAudios.forEach(function (a) { try { a.pause(); } catch (e) {} });
      if (currentEl) currentEl.classList.remove('playing');
      currentEl = elm || null;
      if (currentEl) currentEl.classList.add('playing');
      try { player.pause(); } catch (e) {}
      player.src = src;
      try { player.currentTime = 0; } catch (e) {}
      const pr = player.play();
      if (pr && pr.catch) pr.catch(function (e) {
        if (currentEl) currentEl.classList.remove('playing');
        console.warn('Could not play audio:', src, e && e.message);
      });
    }

    function fmtAudioTime(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      s = Math.floor(s);
      const m = Math.floor(s / 60), sec = s % 60;
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function renderAudioPlayer(rawSrc) {
      const wrap = el('div', 'audio-player');
      if (!rawSrc) { wrap.classList.add('audio-player-disabled'); return wrap; }
      const src = resolveAudio(rawSrc);
      const audio = new Audio(src);
      audio.preload = 'metadata';
      customAudios.push(audio);

      const btn = el('button', 'audio-play-btn', '▶');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Play / pause');

      const seek = document.createElement('input');
      seek.type = 'range'; seek.min = '0'; seek.max = '0'; seek.value = '0'; seek.step = '0.1';
      seek.className = 'audio-seek';

      const time = el('span', 'audio-time', '0:00 / 0:00');

      let seeking = false;
      audio.addEventListener('loadedmetadata', function () {
        seek.max = String(audio.duration || 0);
        time.textContent = fmtAudioTime(0) + ' / ' + fmtAudioTime(audio.duration);
      });
      audio.addEventListener('timeupdate', function () {
        if (!seeking) seek.value = String(audio.currentTime);
        time.textContent = fmtAudioTime(audio.currentTime) + ' / ' + fmtAudioTime(audio.duration);
      });
      audio.addEventListener('play', function () { btn.textContent = '⏸'; btn.classList.add('playing'); });
      audio.addEventListener('pause', function () { btn.textContent = '▶'; btn.classList.remove('playing'); });
      audio.addEventListener('ended', function () { btn.textContent = '▶'; btn.classList.remove('playing'); });

      btn.addEventListener('click', function () {
        if (audio.paused) {
          try { player.pause(); } catch (e) {}
          customAudios.forEach(function (a) { if (a !== audio) { try { a.pause(); } catch (e) {} } });
          const pr = audio.play();
          if (pr && pr.catch) pr.catch(function (e) { console.warn('Could not play audio:', src, e && e.message); });
        } else {
          audio.pause();
        }
      });
      seek.addEventListener('input', function () { seeking = true; audio.currentTime = Number(seek.value); });
      seek.addEventListener('change', function () { seeking = false; });

      wrap.appendChild(btn);
      wrap.appendChild(seek);
      wrap.appendChild(time);
      return wrap;
    }

    function el(tag, cls, txt) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt != null) n.textContent = txt;
      return n;
    }
    function playBtn(src) {
      const b = el('button', 'play-sentence');
      b.type = 'button';
      b.setAttribute('aria-label', 'Play audio');
      b.innerHTML = '▶';
      if (src) { b.addEventListener('click', function () { play(resolveAudio(src), b); }); }
      else { b.disabled = true; }
      return b;
    }
    function norm(s) {
      return (s || '')
        .toString().trim().toLowerCase()
        .normalize('NFC')
        .replace(/[.,!?;:"'“”]/g, '')
        .replace(/\s+/g, ' ');
    }
    function emptyNote(text) { return el('p', 'note', text); }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    // ---------- Tabs ----------
    const tabMemoKey = 'lastTab:' + level + ':' + itemId;
    function setActiveTab(tab) {
      if (PANELS.indexOf(tab) === -1) return;
      document.querySelectorAll('#tabs .tab-btn').forEach(function (b) {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      PANELS.forEach(function (p) { document.getElementById('panel-' + p).hidden = (p !== tab); });
    }
    $tabs.addEventListener('click', function (e) {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      const tab = btn.dataset.tab;
      setActiveTab(tab);
      toggleToolbar(false);
      try { sessionStorage.setItem(tabMemoKey, tab); } catch (e) {}
    });
    (function () {
      let initialTab = params.get('tab');
      if (!initialTab) {
        try { initialTab = sessionStorage.getItem(tabMemoKey); } catch (e) {}
      }
      if (initialTab && initialTab !== 'vocab') setActiveTab(initialTab);
    })();

    // ========================================================
    // TỪ VỰNG — Danh sách / Flashcards / Trắc nghiệm
    // ========================================================
    function savedKey(w) { return 'saved:' + level + ':' + itemId + ':' + w.id; }
    function isSaved(w) { try { return localStorage.getItem(savedKey(w)) === '1'; } catch (e) { return false; } }
    function toggleSaved(w, starEl) {
      try {
        const now = !isSaved(w);
        localStorage.setItem(savedKey(w), now ? '1' : '0');
        starEl.classList.toggle('starred', now);
      } catch (e) {}
    }

    function renderVocabList(items) {
      const wrap = el('div', 'vocab-list');
      items.forEach(function (w, i) {
        const row = el('div', 'vocab-row');
        row.appendChild(el('span', 'vocab-idx', String(i + 1) + '.'));
        const main = el('div', 'vocab-row-main');
        main.appendChild(el('span', 'vocab-row-word', w.word));
        if (w.ipa) main.appendChild(el('span', 'vocab-row-ipa', w.ipa));
        main.appendChild(el('span', 'vocab-row-sep', '—'));
        main.appendChild(el('span', 'vocab-row-meaning', w.meaning));
        row.appendChild(main);
        const actions = el('div', 'vocab-row-actions');
        const star = el('button', 'icon-btn star-btn' + (isSaved(w) ? ' starred' : ''));
        star.type = 'button'; star.innerHTML = '★'; star.setAttribute('aria-label', 'Save word');
        star.addEventListener('click', function () { toggleSaved(w, star); });
        actions.appendChild(star);
        actions.appendChild(playBtn(w.audio));
        row.appendChild(actions);
        wrap.appendChild(row);
      });
      return wrap;
    }

    let flashKeydownHandler = null;
    function detachFlashKeydown() {
      if (flashKeydownHandler) { document.removeEventListener('keydown', flashKeydownHandler); flashKeydownHandler = null; }
    }

    function renderVocabFlashcards(items, onFinished) {
      const wrap = el('div', 'flash-wrap-simple');
      let queue = items.slice();
      let i = 0;
      let revealed = false;
      let rememberedCount = 0;
      let notRememberedCount = 0;
      const progressKeyForThis = nextProgressKey();
      let progressMarked = false;

      const card = el('div', 'flash-card-simple');
      const ctrlRow = el('div', 'flash-controls-row');
      const forgetBtn = el('button', 'flash-ctrl-btn flash-ctrl-forget', 'Not remember');
      const nextBtn = el('button', 'flash-ctrl-btn flash-ctrl-skip', 'Next');
      const rememberBtn = el('button', 'flash-ctrl-btn flash-ctrl-remember', 'Remembered');
      forgetBtn.type = 'button'; nextBtn.type = 'button'; rememberBtn.type = 'button';

      const progressWrap = el('div', 'flash-progress-wrap');
      const progressLabel = el('div', 'flash-progress-label');
      const progressTrack = el('div', 'flash-progress-track');
      const progressFill = el('div', 'flash-progress-fill-grad');
      const progressPct = el('div', 'flash-progress-pct');
      progressTrack.appendChild(progressFill);
      progressWrap.appendChild(progressLabel); progressWrap.appendChild(progressTrack); progressWrap.appendChild(progressPct);

      function currentWord() { return queue[i]; }

      function updateProgress() {
        const total = queue.length;
        const pos = Math.min(i + 1, total);
        const pct = total ? Math.round((pos / total) * 100) : 0;
        progressLabel.textContent = pos + '/' + total;
        progressFill.style.width = pct + '%';
        progressPct.textContent = pct + '%';
      }

      function renderFront() {
        revealed = false;
        card.className = 'flash-card-simple';
        card.innerHTML = '';
        const w = currentWord();
        card.appendChild(el('div', 'flash-word-simple', w.word));
        const iconRow = el('div', 'flash-icon-row');
        const playBtnEl = el('button', 'flash-round-btn'); playBtnEl.type = 'button'; playBtnEl.innerHTML = '▶';
        playBtnEl.addEventListener('click', function (e) { e.stopPropagation(); play(resolveAudio(w.audio)); });
        iconRow.appendChild(playBtnEl);
        const starBtnEl = el('button', 'flash-round-btn' + (isSaved(w) ? ' starred' : '')); starBtnEl.type = 'button'; starBtnEl.innerHTML = '★';
        starBtnEl.addEventListener('click', function (e) { e.stopPropagation(); toggleSaved(w, starBtnEl); });
        iconRow.appendChild(starBtnEl);
        card.appendChild(iconRow);
        card.appendChild(el('span', 'flash-corner-prompt', 'Show meaning ›'));
        updateProgress();
      }

      function renderBack() {
        revealed = true;
        const w = currentWord();
        card.className = 'flash-card-simple flash-card-back';
        card.innerHTML = '';
        card.appendChild(el('div', 'flash-word-simple', w.meaning));
        if (w.example) {
          const ex = el('div', 'flash-example-box');
          ex.appendChild(el('div', 'flash-example-label', 'Example:'));
          ex.appendChild(el('div', 'flash-example-text', w.example));
          card.appendChild(ex);
        }
        card.appendChild(el('span', 'flash-corner-prompt', '‹ Flip back'));
        play(resolveAudio(w.audio));
      }

      function toggleFlip() {
        if (i >= queue.length) return;
        if (revealed) renderFront(); else renderBack();
      }

      function showComplete() {
        detachFlashKeydown();
        card.className = 'flash-card-simple';
        card.innerHTML = '';
        const done = el('div', 'flash-complete');
        done.appendChild(el('div', 'flash-complete-title', '🎉 Deck complete!'));
        done.appendChild(el('p', 'flash-complete-stats', 'Remembered ' + rememberedCount + ' words · Forgot ' + notRememberedCount + ' times.'));
        const quizBtn = el('button', 'btn-purple', 'Take the quiz →');
        quizBtn.type = 'button';
        quizBtn.addEventListener('click', function () { if (onFinished) onFinished(); });
        done.appendChild(quizBtn);
        const retryBtn = el('button', 'btn-check', 'Restart deck');
        retryBtn.type = 'button';
        retryBtn.addEventListener('click', function () {
          queue = items.slice(); i = 0; rememberedCount = 0; notRememberedCount = 0;
          renderFront(); ctrlRow.style.display = ''; progressWrap.style.display = '';
        });
        done.appendChild(retryBtn);
        card.appendChild(done);
        ctrlRow.style.display = 'none';
        if (!progressMarked) { progressMarked = true; markProgressDone(progressKeyForThis); }
      }

      function goNext(judgement) {
        if (i >= queue.length) return;
        if (judgement === 'remember') { rememberedCount++; }
        else if (judgement === 'forget') { notRememberedCount++; queue.push(queue[i]); }
        i++;
        if (i >= queue.length) { showComplete(); } else { renderFront(); }
      }

      card.addEventListener('click', toggleFlip);
      forgetBtn.addEventListener('click', function () { goNext('forget'); });
      nextBtn.addEventListener('click', function () { goNext('skip'); });
      rememberBtn.addEventListener('click', function () { goNext('remember'); });
      ctrlRow.appendChild(forgetBtn); ctrlRow.appendChild(nextBtn); ctrlRow.appendChild(rememberBtn);

      detachFlashKeydown();
      flashKeydownHandler = function (e) {
        if (i >= queue.length) return;
        if (e.code === 'Space') { e.preventDefault(); toggleFlip(); }
        else if (e.key === '1') { goNext('forget'); }
        else if (e.key === '2') { goNext('remember'); }
        else if (e.key === 'ArrowRight') { goNext('skip'); }
      };
      document.addEventListener('keydown', flashKeydownHandler);

      renderFront();
      wrap.appendChild(card);
      wrap.appendChild(ctrlRow);
      wrap.appendChild(progressWrap);
      return wrap;
    }

    function renderVocabQuiz(items) {
      const wrap = el('div', 'quiz-wrap');
      const order = shuffle(items);
      let i = 0, correct = 0, answered = false;
      const progressKeyForThis = nextProgressKey();
      let progressMarked = false;
      const body = el('div', 'quiz-body');
      const foot = el('div', 'quiz-foot');
      function nextQuestion() {
        answered = false;
        body.innerHTML = '';
        if (i >= order.length) {
          body.appendChild(el('p', 'quiz-score', 'Done! ' + correct + '/' + order.length + ' correct.'));
          if (!progressMarked) { progressMarked = true; markProgressDone(progressKeyForThis); }
          const retry = el('button', 'btn-check', 'Retry');
          retry.type = 'button';
          retry.addEventListener('click', function () { i = 0; correct = 0; nextQuestion(); });
          body.appendChild(retry);
          foot.textContent = '';
          return;
        }
        const w = order[i];
        foot.textContent = 'Question ' + (i + 1) + '/' + order.length;
        const qHead = el('div', 'quiz-q-head');
        qHead.appendChild(el('span', 'quiz-word', w.word));
        qHead.appendChild(playBtn(w.audio));
        body.appendChild(qHead);
        if (w.ipa) body.appendChild(el('p', 'vocab-row-ipa', w.ipa));

        const distractors = shuffle(items.filter(function (x) { return x.id !== w.id; })).slice(0, 3);
        const options = shuffle([w].concat(distractors));
        const optWrap = el('div', 'quiz-options');
        options.forEach(function (opt) {
          const btn = el('button', 'quiz-option', opt.meaning);
          btn.type = 'button';
          btn.addEventListener('click', function () {
            if (answered) return;
            answered = true;
            const ok = opt.id === w.id;
            btn.classList.add(ok ? 'opt-correct' : 'opt-wrong');
            if (!ok) {
              Array.from(optWrap.children).forEach(function (c) {
                if (c.textContent === w.meaning) c.classList.add('opt-correct');
              });
            } else { correct++; }
            const nextBtn = el('button', 'btn-check', i + 1 >= order.length ? 'See results →' : 'Next question →');
            nextBtn.type = 'button';
            nextBtn.style.marginTop = '14px';
            nextBtn.addEventListener('click', function () { i++; nextQuestion(); });
            body.appendChild(nextBtn);
          });
          optWrap.appendChild(btn);
        });
        body.appendChild(optWrap);
      }
      nextQuestion();
      wrap.appendChild(foot);
      wrap.appendChild(body);
      return wrap;
    }

    function renderVocabTab(item) {
      const panel = document.getElementById('panel-vocab');
      panel.innerHTML = '';
      const items = (item.vocab && item.vocab.items) || [];
      if (!items.length) { panel.appendChild(emptyNote('Vocabulary is being updated.')); return; }

      if (!panel.hidden) toggleToolbar(false);
      const shell = buildSectionShell('Vocabulary', function () {
        location.href = $backLink.href;
      });
      panel.appendChild(shell);

      const modeBar = el('div', 'mode-bar');
      const modes = [['flashcards', 'Flashcards'], ['quiz', 'Quiz'], ['list', 'List']];
      const content = el('div', 'vocab-content');
      let activeMode = 'flashcards';
      function setMode(m) {
        activeMode = m;
        modeBar.querySelectorAll('.mode-btn').forEach(function (x) { x.classList.toggle('active', x.dataset.mode === m); });
        draw();
      }
      function draw() {
        detachFlashKeydown();
        content.innerHTML = '';
        if (activeMode === 'list') content.appendChild(renderVocabList(items));
        else if (activeMode === 'flashcards') content.appendChild(renderVocabFlashcards(items, function () { setMode('quiz'); }));
        else content.appendChild(renderVocabQuiz(items));
      }
      modes.forEach(function (m) {
        const b = el('button', 'mode-btn' + (m[0] === activeMode ? ' active' : ''), m[1]);
        b.type = 'button';
        b.dataset.mode = m[0];
        b.addEventListener('click', function () { setMode(m[0]); });
        modeBar.appendChild(b);
      });
      shell.appendChild(modeBar);
      shell.appendChild(content);
      draw();
    }

    // ========================================================
    // TOGGLE (dùng cho Ví dụ / Quiz nhỏ trong Ngữ pháp)
    // ========================================================
    function makeToggleSection(label, buildContent) {
      const wrap = el('div', 'toggle-section');
      const btn = el('button', 'toggle-btn', label);
      btn.type = 'button';
      const content = el('div', 'toggle-content hidden');
      content.appendChild(buildContent());
      btn.addEventListener('click', function () {
        const willOpen = content.classList.contains('hidden');
        content.classList.toggle('hidden');
        btn.classList.toggle('open', willOpen);
      });
      wrap.appendChild(btn);
      wrap.appendChild(content);
      return wrap;
    }

    // ========================================================
    // NỘI DUNG DANH XƯNG (pronounContent) — hiển thị trực tiếp trong tab Ngữ pháp
    // ========================================================
    function renderExampleLines(lines) {
      const wrap = el('div', 'grammar-examples');
      (lines || []).forEach(function (ln) {
        const row = el('div', 'example');
        if (typeof ln === 'string') {
          row.appendChild(el('div', 'ex-vi', ln));
        } else {
          row.appendChild(el('div', 'ex-vi', ln.vi));
          if (ln.en) row.appendChild(el('div', 'ex-en', ln.en));
        }
        wrap.appendChild(row);
      });
      return wrap;
    }

    // ========================================================
    // VÒNG TRÒN KẾT QUẢ (Đúng / Sai / Bỏ qua) — dùng chung cho mọi loại quiz
    // ========================================================
    function createResultsRing(total) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const r = 42, c = 2 * Math.PI * r;
      const wrap = el('div', 'results-summary hidden');
      const ringWrap = el('div', 'results-ring-wrap');
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('class', 'results-ring-svg');
      const bg = document.createElementNS(svgNS, 'circle');
      bg.setAttribute('cx', '50'); bg.setAttribute('cy', '50'); bg.setAttribute('r', String(r));
      bg.setAttribute('class', 'ring-bg');
      const correctArc = document.createElementNS(svgNS, 'circle');
      correctArc.setAttribute('cx', '50'); correctArc.setAttribute('cy', '50'); correctArc.setAttribute('r', String(r));
      correctArc.setAttribute('class', 'ring-correct');
      const wrongArc = document.createElementNS(svgNS, 'circle');
      wrongArc.setAttribute('cx', '50'); wrongArc.setAttribute('cy', '50'); wrongArc.setAttribute('r', String(r));
      wrongArc.setAttribute('class', 'ring-wrong');
      svg.appendChild(bg); svg.appendChild(correctArc); svg.appendChild(wrongArc);
      const center = el('div', 'ring-center');
      ringWrap.appendChild(svg);
      ringWrap.appendChild(center);

      function legendRow(cls, label) {
        const row = el('div', 'legend-row');
        const dot = el('span', 'legend-dot ' + cls);
        const lbl = el('span', 'legend-label', label + ':');
        const count = el('span', 'legend-count', '0 questions');
        row.appendChild(dot); row.appendChild(lbl); row.appendChild(count);
        return { row: row, count: count };
      }
      const rowCorrect = legendRow('dot-correct', 'Correct');
      const rowWrong = legendRow('dot-wrong', 'Sai');
      const rowSkip = legendRow('dot-skip', 'Skipped');
      const legend = el('div', 'results-legend');
      legend.appendChild(rowCorrect.row);
      legend.appendChild(rowWrong.row);
      legend.appendChild(rowSkip.row);

      wrap.appendChild(ringWrap);
      wrap.appendChild(legend);

      function update(correct, incorrect) {
        const skipped = Math.max(0, total - correct - incorrect);
        const correctLen = total ? (correct / total) * c : 0;
        const wrongLen = total ? (incorrect / total) * c : 0;
        correctArc.setAttribute('stroke-dasharray', correctLen + ' ' + (c - correctLen));
        correctArc.setAttribute('stroke-dashoffset', '0');
        wrongArc.setAttribute('stroke-dasharray', wrongLen + ' ' + (c - wrongLen));
        wrongArc.setAttribute('stroke-dashoffset', String(-correctLen));
        center.innerHTML = '<div class="ring-score">' + correct + '/' + total + '</div><div class="ring-label">correct</div>';
        rowCorrect.count.textContent = correct + ' questions';
        rowWrong.count.textContent = incorrect + ' questions';
        rowSkip.count.textContent = skipped + ' questions';
      }
      function reveal() { wrap.classList.remove('hidden'); }
      update(0, 0);
      return { el: wrap, update: update, reveal: reveal };
    }

    // Tiện ích: theo dõi 1 mảng trạng thái (true/false/null); chỉ tính & hiện ring khi finalize() (bấm Nộp bài)
    function trackQuizState(total) {
      const state = new Array(total).fill(null);
      const ring = createResultsRing(total);
      function set(idx, ok) { state[idx] = ok; }
      function finalize() {
        const correctCount = state.filter(function (s) { return s === true; }).length;
        const wrongCount = state.filter(function (s) { return s === false; }).length;
        ring.update(correctCount, wrongCount);
        ring.reveal();
      }
      return { ring: ring, set: set, finalize: finalize };
    }

    // Thêm nút "Nộp bài" cuối 1 bài — bấm vào mới tính & hiện vòng tròn kết quả; đồng thời tính là đã hoàn thành phần này
    function appendSubmitAndRing(container, tracker) {
      const progressKeyForThis = nextProgressKey();
      const submitBtn = el('button', 'btn-check btn-submit', 'Submit ✓');
      submitBtn.type = 'button';
      submitBtn.addEventListener('click', function () {
        tracker.finalize();
        markProgressDone(progressKeyForThis);
      });
      container.appendChild(submitBtn);
      container.appendChild(tracker.ring.el);
    }

    // Chỉ tạo vòng tròn kết quả (không có nút Submit riêng) — dùng khi từng câu đã tự chấm ngay lúc làm,
    // và kết quả tổng sẽ tự hiện ra khi làm xong câu cuối (thông qua opts.onFinish của buildStepper).
    // Không tự appendChild — để caller tự chèn ringEl vào đúng vị trí (thường là sau khối câu hỏi).
    function createResultsRingReveal(tracker) {
      const progressKeyForThis = nextProgressKey();
      return {
        ringEl: tracker.ring.el,
        finish: function () {
          tracker.finalize();
          markProgressDone(progressKeyForThis);
        }
      };
    }

    function buildQuizBlock(quiz, onReviewTheory) {
      const wrap = el('div', 'gram2-quiz-wrap');
      wrap.appendChild(el('div', 'gram2-quiz-banner', 'Choose the correct answers.'));

      const progressTrack = el('div', 'gram2-quiz-progress-track');
      const progressFill = el('div', 'gram2-quiz-progress-fill');
      progressTrack.appendChild(progressFill);
      wrap.appendChild(progressTrack);

      const qSlot = el('div', 'gram2-quiz-item');
      wrap.appendChild(qSlot);

      let tracker = trackQuizState(quiz.length);
      const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
      let i = 0;

      function updateProgress() {
        const pct = quiz.length ? Math.round((i / quiz.length) * 100) : 0;
        progressFill.style.width = pct + '%';
      }

      function renderQuestion() {
        qSlot.innerHTML = '';
        if (i >= quiz.length) {
          updateProgress();
          tracker.finalize();
          markProgressDone(nextProgressKey());
          qSlot.appendChild(tracker.ring.el);

          const actionsRow = el('div', 'gram2-quiz-result-actions');
          const retryBtn = el('button', 'btn-check btn-secondary gram2-quiz-next', '↺ Try again'); retryBtn.type = 'button';
          retryBtn.addEventListener('click', function () {
            i = 0;
            tracker = trackQuizState(quiz.length);
            renderQuestion();
          });
          actionsRow.appendChild(retryBtn);
          if (onReviewTheory) {
            const reviewBtn = el('button', 'btn-purple gram2-quiz-next', 'Review theory →'); reviewBtn.type = 'button';
            reviewBtn.addEventListener('click', function () { onReviewTheory(); });
            actionsRow.appendChild(reviewBtn);
          }
          qSlot.appendChild(actionsRow);
          return;
        }
        const q = quiz[i];
        qSlot.appendChild(el('p', 'gram2-quiz-question', (i + 1) + '. ' + q.question));
        const optWrap = el('div', 'gram2-quiz-options');
        let answered = false;
        (q.options || []).forEach(function (opt, oi) {
          const card = el('button', 'gram2-quiz-option'); card.type = 'button';
          card.appendChild(el('span', 'gram2-quiz-badge', letters[oi] || ''));
          card.appendChild(el('span', 'gram2-quiz-option-text', opt));
          card.addEventListener('click', function () {
            if (answered) return;
            answered = true;
            const ok = opt === q.answer;
            card.classList.add(ok ? 'opt-correct' : 'opt-wrong');
            if (!ok) {
              Array.from(optWrap.children).forEach(function (b) {
                if (b.querySelector('.gram2-quiz-option-text').textContent === q.answer) b.classList.add('opt-correct');
              });
            }
            tracker.set(i, ok);
            const nextBtn = el('button', 'btn-purple gram2-quiz-next', i === quiz.length - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →');
            nextBtn.type = 'button';
            nextBtn.addEventListener('click', function () { i++; updateProgress(); renderQuestion(); });
            qSlot.appendChild(nextBtn);
          });
          optWrap.appendChild(card);
        });
        qSlot.appendChild(optWrap);
        updateProgress();
      }

      renderQuestion();
      return wrap;
    }

    function renderQuizToggle(quiz, label) {
      return makeToggleSection(label || 'Small quiz', function () {
        return buildQuizBlock(quiz);
      });
    }

    // Render pattern + notes + toggle(examples) + optional tip + optional answer-note/examples + toggle(quiz)
    // into `container`. Used both for standalone grammar points and for subsections grouped in one card.
    function renderPatternBody(container, g) {
      if (g.pattern) container.appendChild(el('div', 'grammar-pattern', g.pattern));
      if (g.explanation) container.appendChild(el('p', 'ex-instruction', g.explanation));
      if (g.notes && g.notes.length) {
        const ul = document.createElement('ul');
        ul.className = 'grammar-notes';
        g.notes.forEach(function (n) {
          const li = document.createElement('li');
          li.textContent = n;
          ul.appendChild(li);
        });
        container.appendChild(ul);
      }
      if (g.examples && g.examples.length) {
        container.appendChild(makeToggleSection('Examples', function () { return renderExampleLines(g.examples); }));
      }
      if (g.tip) {
        const tipBox = el('div', 'grammar-callout');
        tipBox.appendChild(el('p', '', g.tip.label + (g.tip.text ? ': ' + g.tip.text : '')));
        if (g.tip.correct) tipBox.appendChild(el('p', 'tip-correct', '✅ ' + g.tip.correct));
        if (g.tip.incorrect) tipBox.appendChild(el('p', 'tip-incorrect', '❌ ' + g.tip.incorrect));
        container.appendChild(tipBox);
      }
      if (g.tipBlocks && g.tipBlocks.length) {
        g.tipBlocks.forEach(function (tb) {
          if (tb.tip) container.appendChild(el('p', 'grammar-callout', '💡 ' + tb.tip));
          if (tb.examples && tb.examples.length) {
            container.appendChild(makeToggleSection('Examples', function () { return renderExampleLines(tb.examples); }));
          }
        });
      }
      if (g.answerNote) {
        container.appendChild(el('p', 'ex-instruction', g.answerNote));
        if (g.answerExamples && g.answerExamples.length) {
          container.appendChild(makeToggleSection('Examples', function () { return renderExampleLines(g.answerExamples); }));
        }
      }
      if (g.quiz && g.quiz.length) container.appendChild(renderQuizToggle(g.quiz));
      if (g.extraTip) container.appendChild(renderTipBox(g.extraTip));
      if (g.extraTips && g.extraTips.length) {
        g.extraTips.forEach(function (et) { container.appendChild(renderTipBox(et)); });
      }
    }

    function renderTipBox(et) {
      const box = el('div', 'grammar-callout');
      box.appendChild(el('p', '', et.label));
      if (et.text) box.appendChild(el('p', '', et.text));
      if (et.dialogue && et.dialogue.length) {
        et.dialogue.forEach(function (d) { box.appendChild(el('p', '', d)); });
      }
      if (et.table) {
        const table = document.createElement('table');
        table.className = 'grammar-table';
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        et.table.headers.forEach(function (h) {
          const th = document.createElement('th');
          th.textContent = h;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        et.table.rows.forEach(function (r) {
          const tr = document.createElement('tr');
          r.forEach(function (cell) {
            const td = document.createElement('td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        box.appendChild(table);
      }
      if (et.examples && et.examples.length) box.appendChild(renderExampleLines(et.examples));
      if (et.footer) box.appendChild(el('p', '', et.footer));
      return box;
    }

    function boldMarkup(text) {
      return String(text).replace(/\*\*(.*?)\*\*/g, '<strong class="pronoun-hl">$1</strong>');
    }

    function renderPronounContent(pc) {
      const box = el('div', 'pronoun-content');
      if (pc.table) {
        const table = document.createElement('table');
        table.className = 'grammar-table';
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        pc.table.headers.forEach(function (h) {
          const th = document.createElement('th');
          th.textContent = h;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        pc.table.rows.forEach(function (r) {
          const tr = document.createElement('tr');
          r.forEach(function (cell) {
            const td = document.createElement('td');
            td.innerHTML = boldMarkup(cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        box.appendChild(table);
      }
      if (pc.tip) box.appendChild(el('p', 'grammar-callout', '💡 Tip: ' + pc.tip));
      if (pc.exampleGroups && pc.exampleGroups.length) {
        box.appendChild(makeToggleSection('Examples', function () {
          const wrap = el('div');
          pc.exampleGroups.forEach(function (grp) {
            wrap.appendChild(el('p', 'example-group-title', grp.heading));
            wrap.appendChild(renderExampleLines(grp.lines));
          });
          return wrap;
        }));
      }
      if (pc.specialRule) {
        box.appendChild(makeToggleSection(pc.specialRule.heading, function () {
          const wrap = el('div');
          if (pc.specialRule.text) wrap.appendChild(el('p', 'ex-instruction', pc.specialRule.text));
          (pc.specialRule.examples || []).forEach(function (ex) {
            wrap.appendChild(renderExampleLines(ex.lines));
            if (ex.note) wrap.appendChild(el('p', 'grammar-note', ex.note));
          });
          return wrap;
        }));
      }
      if (pc.remember) {
        box.appendChild(el('h4', 'grammar-subhead', pc.remember.heading));
        if (pc.remember.text) box.appendChild(el('p', 'ex-instruction', pc.remember.text));
        if (pc.remember.pairs && pc.remember.pairs.length) {
          const ul = document.createElement('ul');
          ul.className = 'grammar-notes';
          pc.remember.pairs.forEach(function (p) {
            const li = document.createElement('li');
            li.textContent = p;
            ul.appendChild(li);
          });
          box.appendChild(ul);
        }
        if (pc.remember.footer) box.appendChild(el('p', 'ex-instruction', pc.remember.footer));
      }
      if (pc.cultureNote) box.appendChild(el('p', 'grammar-callout', '💡 Culture Note: ' + pc.cultureNote));
      return box;
    }

    // ========================================================
    // NGỮ PHÁP
    // ========================================================
    // ========================================================
    // NGỮ PHÁP KIỂU MỚI — sidebar 2 cấp + nội dung Theory/Practice
    // (dùng khi item.grammar.sections tồn tại; không ảnh hưởng bài dùng "points")
    // ========================================================
    function toggleToolbar(show) {
      const bar = document.querySelector('.toolbar');
      if (bar) bar.hidden = !show;
    }

    // ---------- Section shell dùng chung: thanh trên cùng có tên phần + mũi tên back ----------
    function buildSectionShell(labelText, onBack) {
      const shell = el('div', 'gram2-shell');
      const topbar = el('div', 'gram2-topbar');
      const backBtn = el('button', 'gram2-back-btn', '←'); backBtn.type = 'button';
      backBtn.setAttribute('aria-label', 'Back');
      backBtn.addEventListener('click', onBack);
      topbar.appendChild(backBtn);
      topbar.appendChild(el('div', 'gram2-tab-pill', labelText));
      shell.appendChild(topbar);
      return shell;
    }
    // Back về màn hình chọn phần (hiện lại toolbar, không phần nào được chọn sẵn)
    function backToTabs() {
      toggleToolbar(true);
      setActiveTab('vocab');
      try { sessionStorage.setItem(tabMemoKey, 'vocab'); } catch (e) {}
    }

    function buildSimpleTheory(sub, container) {
      (sub.paragraphs || []).forEach(function (p) { container.appendChild(el('p', 'gram2-intro', p)); });
      if (sub.notes && sub.notes.length) {
        const ul = document.createElement('ul');
        ul.className = 'grammar-notes';
        sub.notes.forEach(function (n) {
          const li = document.createElement('li');
          li.textContent = n;
          ul.appendChild(li);
        });
        container.appendChild(ul);
      }
      if (sub.table) {
        if (sub.table.caption) container.appendChild(el('div', 'gram2-table-caption', sub.table.caption.toUpperCase()));
        const table = document.createElement('table');
        table.className = 'grammar-table';
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        sub.table.headers.forEach(function (h) { const th = document.createElement('th'); th.textContent = h; headRow.appendChild(th); });
        thead.appendChild(headRow); table.appendChild(thead);
        const tbody = document.createElement('tbody');
        sub.table.rows.forEach(function (r) {
          const tr = document.createElement('tr');
          r.forEach(function (cell) { const td = document.createElement('td'); td.textContent = cell; tr.appendChild(td); });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        container.appendChild(table);
      }
      if (sub.chips && sub.chips.length) {
        const chipRow = el('div', 'gram2-chip-row');
        sub.chips.forEach(function (c) {
          const item = el('div', 'gram2-chip-item');
          if (c.label) item.appendChild(el('span', 'gram2-chip-label', c.label));
          item.appendChild(el('span', 'gram2-chip', c.pattern));
          chipRow.appendChild(item);
        });
        container.appendChild(chipRow);
      }
      if (sub.examples && sub.examples.length) {
        container.appendChild(el('div', 'gram2-examples-label', 'Examples'));
        container.appendChild(renderExampleLines(sub.examples));
      }
      if (sub.tip) {
        const tipBox = el('div', 'grammar-callout');
        tipBox.appendChild(el('p', '', sub.tip.label ? (sub.tip.label + (sub.tip.text ? ': ' + sub.tip.text : '')) : ('💡 ' + sub.tip)));
        if (sub.tip.correct) tipBox.appendChild(el('p', 'tip-correct', '✅ ' + sub.tip.correct));
        if (sub.tip.incorrect) tipBox.appendChild(el('p', 'tip-incorrect', '❌ ' + sub.tip.incorrect));
        container.appendChild(tipBox);
      }
      if (sub.tipBlocks && sub.tipBlocks.length) {
        sub.tipBlocks.forEach(function (tb) {
          if (tb.tip) container.appendChild(el('p', 'grammar-callout', '💡 ' + tb.tip));
          if (tb.examples && tb.examples.length) {
            container.appendChild(el('div', 'gram2-examples-label', 'Examples'));
            container.appendChild(renderExampleLines(tb.examples));
          }
        });
      }
      if (sub.answerNote) {
        container.appendChild(el('p', 'gram2-intro', sub.answerNote));
        if (sub.answerExamples && sub.answerExamples.length) {
          container.appendChild(el('div', 'gram2-examples-label', 'Examples'));
          container.appendChild(renderExampleLines(sub.answerExamples));
        }
      }
      if (sub.cultureNote) container.appendChild(el('p', 'grammar-callout', '💡 Culture Note: ' + sub.cultureNote));
    }

    function renderGrammarTabSidebar(item, sections) {
      const panel = document.getElementById('panel-grammar');
      panel.innerHTML = '';
      if (!panel.hidden) toggleToolbar(false);

      const shell = buildSectionShell('Grammar', backToTabs);

      const body = el('div', 'gram2-body');
      const sidebar = el('aside', 'gram2-sidebar');
      const content = el('div', 'gram2-content');
      body.appendChild(sidebar);
      body.appendChild(content);
      shell.appendChild(body);
      panel.appendChild(shell);

      let firstEntry = null;

      function renderContent(section, sub, showSubHeading) {
        content.innerHTML = '';
        content.appendChild(el('h2', 'gram2-content-title', section.titleVi.toUpperCase() + (section.titleEn ? ' - ' + section.titleEn.toUpperCase() : '')));

        const toggleRow = el('div', 'gram2-toggle-row');
        const theoryBtn = el('button', 'gram2-toggle-btn active', 'Theory'); theoryBtn.type = 'button';
        const practiceBtn = el('button', 'gram2-toggle-btn', 'Practice'); practiceBtn.type = 'button';
        toggleRow.appendChild(theoryBtn); toggleRow.appendChild(practiceBtn);
        content.appendChild(toggleRow);

        const theoryPanel = el('div', 'gram2-theory-panel');
        const practicePanel = el('div', 'gram2-practice-panel');
        practicePanel.hidden = true;

        (section.intro || []).forEach(function (p) { theoryPanel.appendChild(el('p', 'gram2-intro', p)); });

        if (showSubHeading) {
          const hVi = sub.subHeadingVi || sub.label;
          const hEn = sub.subHeadingEn;
          theoryPanel.appendChild(el('h3', 'gram2-sub-heading', hVi.toUpperCase() + (hEn ? ' - ' + hEn.toUpperCase() : '')));
        }

        if (sub.pronounContent) {
          theoryPanel.appendChild(renderPronounContent(sub.pronounContent));
        } else {
          buildSimpleTheory(sub, theoryPanel);
        }

        const quizToUse = (sub.quiz && sub.quiz.length) ? sub.quiz : section.quiz;
        if (quizToUse && quizToUse.length) {
          practicePanel.appendChild(buildQuizBlock(quizToUse, function () {
            theoryBtn.classList.add('active'); practiceBtn.classList.remove('active');
            theoryPanel.hidden = false; practicePanel.hidden = true;
          }));
        }
        else practicePanel.appendChild(el('p', 'note', 'Practice exercises coming soon.'));

        content.appendChild(theoryPanel);
        content.appendChild(practicePanel);

        theoryBtn.addEventListener('click', function () {
          theoryBtn.classList.add('active'); practiceBtn.classList.remove('active');
          theoryPanel.hidden = false; practicePanel.hidden = true;
        });
        practiceBtn.addEventListener('click', function () {
          practiceBtn.classList.add('active'); theoryBtn.classList.remove('active');
          practicePanel.hidden = false; theoryPanel.hidden = true;
        });
      }

      sections.forEach(function (section, si) {
        const secBox = el('div', 'gram2-section');
        const header = el('button', 'gram2-section-header'); header.type = 'button';
        const titles = el('div', 'gram2-section-titles');
        titles.appendChild(el('div', 'gram2-section-title-vi', (si + 1) + '. ' + section.titleVi.toUpperCase()));
        if (section.titleEn) titles.appendChild(el('div', 'gram2-section-title-en', section.titleEn));
        header.appendChild(titles);
        const chevron = el('span', 'gram2-chevron', '▾');
        header.appendChild(chevron);
        secBox.appendChild(header);

        const list = el('div', 'gram2-subtopic-list');
        const multi = (section.subtopics || []).length > 1;
        (section.subtopics || []).forEach(function (sub) {
          const btn = el('button', 'gram2-subtopic-btn', sub.label); btn.type = 'button';
          btn.addEventListener('click', function () {
            sidebar.querySelectorAll('.gram2-subtopic-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderContent(section, sub, multi);
          });
          list.appendChild(btn);
          if (!firstEntry) firstEntry = { btn: btn, section: section, sub: sub, multi: multi };
        });
        secBox.appendChild(list);
        header.addEventListener('click', function () {
          const collapsed = list.classList.toggle('gram2-collapsed');
          chevron.textContent = collapsed ? '▸' : '▾';
        });
        sidebar.appendChild(secBox);
      });

      if (firstEntry) {
        firstEntry.btn.classList.add('active');
        renderContent(firstEntry.section, firstEntry.sub, firstEntry.multi);
      }
    }

    function renderGrammarTab(item) {
      const sections = item.grammar && item.grammar.sections;
      if (sections && sections.length) { renderGrammarTabSidebar(item, sections); return; }
      const panel = document.getElementById('panel-grammar');
      panel.innerHTML = '';
      const points = (item.grammar && item.grammar.points) || [];
      if (!points.length) { panel.appendChild(emptyNote('Grammar is being updated.')); return; }

      if (!panel.hidden) toggleToolbar(false);
      const shell = buildSectionShell('Grammar', backToTabs);
      panel.appendChild(shell);
      const gPanel = el('div', 'gram2-legacy-content');
      shell.appendChild(gPanel);

      points.forEach(function (g) {
        const box = el('div', 'exercise');
        if (g.pronounContent) {
          box.appendChild(el('h3', 'ex-title', g.title));
          box.appendChild(renderPronounContent(g.pronounContent));
          if (g.quiz && g.quiz.length) {
            nextProgressKey('grammar:' + g.id);
            const actions = el('div', 'grammar-actions');
            const quizBtn = document.createElement('a');
            quizBtn.className = 'btn-purple';
            quizBtn.href = 'quiz.html?id=' + encodeURIComponent(itemId) +
              '&level=' + encodeURIComponent(level) +
              '&point=' + encodeURIComponent(g.id);
            quizBtn.textContent = 'Quiz →';
            actions.appendChild(quizBtn);
            box.appendChild(actions);
          }
          gPanel.appendChild(box);
          return;
        }
        if (g.subsections && g.subsections.length) {
          box.appendChild(el('h3', 'ex-title', g.title));
          g.subsections.forEach(function (sub, i) {
            const subBox = el('div', 'grammar-subsection');
            subBox.appendChild(el('h4', 'grammar-subhead grammar-subhead-purple', sub.subtitle));
            renderPatternBody(subBox, sub);
            box.appendChild(subBox);
          });
          if (g.extraTips && g.extraTips.length) {
            g.extraTips.forEach(function (et) { box.appendChild(renderTipBox(et)); });
          }
          if (g.quiz && g.quiz.length) box.appendChild(renderQuizToggle(g.quiz));
          gPanel.appendChild(box);
          return;
        }
        if (g.pattern) {
          box.appendChild(el('h3', 'ex-title', g.title));
          renderPatternBody(box, g);
          gPanel.appendChild(box);
          return;
        }
        if (g.quiz && g.quiz.length && !g.pattern && !g.subsections && !g.pronounContent && !g.refInput) {
          nextProgressKey('grammar:' + g.id);
          box.appendChild(el('h3', 'ex-title', g.title));
          const actions = el('div', 'grammar-actions');
          const quizBtn = document.createElement('a');
          quizBtn.className = 'btn-purple';
          quizBtn.href = 'quiz.html?id=' + encodeURIComponent(itemId) +
            '&level=' + encodeURIComponent(level) +
            '&point=' + encodeURIComponent(g.id);
          quizBtn.textContent = 'Quiz →';
          actions.appendChild(quizBtn);
          box.appendChild(actions);
          gPanel.appendChild(box);
          return;
        }
        if (g.refInput) {
          box.appendChild(el('h3', 'ex-title', g.title));
          const actions = el('div', 'grammar-actions');
          const readBtn = document.createElement('a');
          readBtn.className = 'btn-purple';
          readBtn.href = 'input.html?id=' + encodeURIComponent(g.refInput) +
            '&level=' + encodeURIComponent(level) +
            '&lesson=' + encodeURIComponent(itemId) +
            '&point=' + encodeURIComponent(g.id);
          readBtn.textContent = 'Read →';
          actions.appendChild(readBtn);
          if (g.quiz && g.quiz.length) {
            nextProgressKey('grammar:' + g.id);
            const quizBtn = document.createElement('a');
            quizBtn.className = 'btn-purple';
            quizBtn.href = 'quiz.html?id=' + encodeURIComponent(itemId) +
              '&level=' + encodeURIComponent(level) +
              '&point=' + encodeURIComponent(g.id);
            quizBtn.textContent = 'Quiz →';
            actions.appendChild(quizBtn);
          }
          box.appendChild(actions);
          gPanel.appendChild(box);
          return;
        }
        const headRow = el('div', 'grammar-head');
        headRow.appendChild(el('h3', 'ex-title', g.title));
        box.appendChild(headRow);
        if (g.explanation) box.appendChild(el('p', 'ex-instruction', g.explanation));
        (g.examples || []).forEach(function (ex) {
          const row = el('div', 'turn');
          row.appendChild(el('span', 'turn-text', ex));
          box.appendChild(row);
        });
        gPanel.appendChild(box);
      });
    }

    // ========================================================
    // NGHE
    // ========================================================
    // ---------- Stepper dùng chung: hiện từng bước một, Tiếp mới qua bước sau ----------
    function buildStepper(container, steps, renderStepFn, opts) {
      opts = opts || {};
      let i = 0;
      let answeredForStep = false;
      const stage = el('div', opts.stageClass || '');
      const dots = el('div', 'step-dots');
      const nav = el('div', 'step-nav');
      container.appendChild(stage);
      container.appendChild(dots);
      container.appendChild(nav);

      function markAnswered() {
        answeredForStep = true;
        if (nextBtnRef) nextBtnRef.disabled = false;
      }

      let nextBtnRef = null;

      function draw() {
        answeredForStep = false;
        stage.innerHTML = '';
        stage.appendChild(renderStepFn(steps[i], i, markAnswered));

        dots.innerHTML = '';
        steps.forEach(function (_, idx) { dots.appendChild(el('span', 'step-dot' + (idx === i ? ' active' : ''))); });

        nav.innerHTML = '';
        const isLast = i >= steps.length - 1;
        if (!opts.noBack) {
          const prev = el('button', 'btn-check btn-secondary', '← Back'); prev.type = 'button';
          prev.style.visibility = i === 0 ? 'hidden' : 'visible';
          prev.addEventListener('click', function () { i--; draw(); });
          nav.appendChild(prev);
        }
        const next = el('button', 'btn-check', isLast ? (opts.lastLabel || 'Done ✓') : 'Next →'); next.type = 'button';
        if (opts.requireAnswer) next.disabled = !answeredForStep;
        next.addEventListener('click', function () {
          if (!isLast) { i++; draw(); }
          else if (opts.onFinish) { opts.onFinish(); }
        });
        nav.appendChild(next);
        nextBtnRef = next;
      }
      draw();
    }

    function renderDictationLine(line, onResult) {
      const wrap = el('div', 'dictation-item');
      const row = el('div', 'listen-row');
      row.appendChild(playBtn(line.audio));
      const resultSlot = el('span', 'result-slot');
      row.appendChild(resultSlot);
      wrap.appendChild(row);

      const bankWords = line.wordBank || [];
      const built = el('div', 'scramble-built');
      const bank = el('div', 'scramble-bank');
      const displayOrder = shuffle(bankWords.map(function (_, i) { return i; }));
      let chosen = [];
      let locked = false;

      function refreshBuilt() {
        built.innerHTML = '';
        if (!chosen.length) {
          built.appendChild(el('span', 'dictation-placeholder', 'Tap the words below to build the sentence…'));
        }
        chosen.forEach(function (idx) {
          const chip = el('span', 'chip chip-placed', bankWords[idx]);
          if (locked) {
            chip.classList.add('chip-locked');
          } else {
            chip.addEventListener('click', function () {
              chosen = chosen.filter(function (i) { return i !== idx; });
              refreshBuilt(); refreshBank();
            });
          }
          built.appendChild(chip);
        });
      }
      function refreshBank() {
        bank.innerHTML = '';
        displayOrder.forEach(function (idx) {
          if (chosen.indexOf(idx) !== -1) return;
          const chip = el('span', 'chip chip-pickable', bankWords[idx]);
          if (locked) {
            chip.classList.add('chip-locked');
          } else {
            chip.addEventListener('click', function () {
              chosen.push(idx);
              refreshBuilt(); refreshBank();
            });
          }
          bank.appendChild(chip);
        });
      }
      refreshBuilt(); refreshBank();
      wrap.appendChild(built);
      if (bankWords.length) wrap.appendChild(bank);

      const checkBtn = el('button', 'btn-check', 'Submit');
      checkBtn.type = 'button';
      checkBtn.addEventListener('click', function () {
        if (locked) return;
        locked = true;
        const builtStr = chosen.map(function (i) { return bankWords[i]; }).join(' ');
        const ok = norm(builtStr) === norm(line.text);
        resultSlot.innerHTML = '';
        resultSlot.appendChild(checkRow(ok));
        if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + line.text + ')'));
        checkBtn.disabled = true;
        refreshBuilt(); refreshBank();
        if (onResult) onResult(ok);
      });
      wrap.appendChild(checkBtn);
      return wrap;
    }

    function makeSplitDraggable(container, leftPane, divider) {
      let dragging = false;
      divider.addEventListener('pointerdown', function (e) {
        dragging = true;
        divider.setPointerCapture(e.pointerId);
      });
      divider.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        const rect = container.getBoundingClientRect();
        let pct = ((e.clientX - rect.left) / rect.width) * 100;
        pct = Math.min(80, Math.max(20, pct));
        leftPane.style.flexBasis = pct + '%';
      });
      function endDrag() { dragging = false; }
      divider.addEventListener('pointerup', endDrag);
      divider.addEventListener('pointercancel', endDrag);
    }

    function checkRow(ok) { return el('span', 'result ' + (ok ? 'result-ok' : 'result-bad'), ok ? '✓' : '✗'); }

    function renderMatching(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const groups = ex.groups || [{ label: null, prompts: ex.prompts || [] }];
      const selects = [];
      groups.forEach(function (g) {
        if (g.label) box.appendChild(el('h4', 'group-label', g.label));
        (g.prompts || []).forEach(function (p) {
          const row = el('div', 'match-row');
          row.appendChild(el('span', 'match-prompt', p.text));
          const select = document.createElement('select');
          select.className = 'answer-select';
          const optEmpty = el('option', null, '— choose —'); optEmpty.value = ''; select.appendChild(optEmpty);
          ex.answerBank.forEach(function (a) {
            const opt = el('option', null, a.text); opt.value = a.id; select.appendChild(opt);
          });
          select.dataset.answer = p.answer;
          row.appendChild(select);
          const resultSlot = el('span', 'result-slot');
          row.appendChild(resultSlot);
          row._resultSlot = resultSlot; row._select = select;
          selects.push(row);
          box.appendChild(row);
        });
      });
      const checkBtn = el('button', 'btn-check', 'Check'); checkBtn.type = 'button';
      const tracker = trackQuizState(selects.length);
      checkBtn.addEventListener('click', function () {
        selects.forEach(function (row, idx) {
          if (!row._select.value) { return; }
          const ok = row._select.value === row._select.dataset.answer;
          row._resultSlot.innerHTML = '';
          row._resultSlot.appendChild(checkRow(ok));
          if (!ok) {
            const correctText = ex.answerBank.find(function (a) { return a.id === row._select.dataset.answer; });
            row._resultSlot.appendChild(el('span', 'correct-hint', correctText ? ' (' + correctText.text + ')' : ''));
          }
          tracker.set(idx, ok);

    function renderSort(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      let selectedChip = null;
      const assignment = {};
      const bank = el('div', 'word-bank');
      const chipEls = {};
      ex.wordBank.forEach(function (w) {
        const chip = el('span', 'chip chip-pickable', w);
        chip.addEventListener('click', function () {
          if (chip.classList.contains('chip-used')) return;
          if (selectedChip) selectedChip.classList.remove('chip-selected');
          selectedChip = chip;
          chip.classList.add('chip-selected');
        });
        chipEls[w] = chip;
        bank.appendChild(chip);
      });
      box.appendChild(bank);
      const catsWrap = el('div', 'sort-cats');
      (ex.categories || []).forEach(function (cat) {
        const catBox = el('div', 'sort-cat');
        catBox.appendChild(el('h4', 'group-label', cat.label));
        if (cat.example) catBox.appendChild(el('span', 'chip chip-given', cat.example));
        const dropZone = el('div', 'sort-dropzone');
        catBox.appendChild(dropZone);
        catBox.addEventListener('click', function () {
          if (!selectedChip) return;
          const word = selectedChip.textContent;
          selectedChip.classList.add('chip-used');
          selectedChip.classList.remove('chip-selected');
          assignment[word] = cat.id;
          dropZone.appendChild(el('span', 'chip chip-placed', word));
          selectedChip = null;
        });
        catsWrap.appendChild(catBox);
      });
      box.appendChild(catsWrap);
      const resetBtn = el('button', 'btn-check btn-secondary', 'Retry'); resetBtn.type = 'button';
      resetBtn.addEventListener('click', function () {
        Object.keys(assignment).forEach(function (k) { delete assignment[k]; });
        catsWrap.querySelectorAll('.sort-dropzone').forEach(function (z) { z.innerHTML = ''; });
        Object.values(chipEls).forEach(function (c) { c.classList.remove('chip-used', 'chip-selected'); });
        selectedChip = null;
      });
      const checkBtn = el('button', 'btn-check', 'Check'); checkBtn.type = 'button';
      const resultLine = el('p', 'ex-instruction');
      const expectedWords = [];
      (ex.categories || []).forEach(function (cat) { (cat.answers || []).forEach(function (w) { expectedWords.push({ word: w, catId: cat.id }); }); });
      const tracker = trackQuizState(expectedWords.length);
      checkBtn.addEventListener('click', function () {
        let correct = 0;
        expectedWords.forEach(function (e, idx) {
          if (!(e.word in assignment)) { return; }
          const ok = assignment[e.word] === e.catId;
          if (ok) correct++;
          tracker.set(idx, ok);
        });
        resultLine.textContent = 'Correct ' + correct + '/' + expectedWords.length + '.';
      });
      box.appendChild(checkBtn); box.appendChild(resetBtn); box.appendChild(resultLine);
      if (expectedWords.length) appendSubmitAndRing(box, tracker);
      return box;

    function renderScramble(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const items = ex.items || [];
      const tracker = trackQuizState(items.length);
      items.forEach(function (item, itemIdx) {
        const itemBox = el('div', 'scramble-item');
        itemBox.appendChild(el('p', 'match-prompt', item.prompt));
        const built = el('div', 'scramble-built');
        const bank = el('div', 'scramble-bank');
        let order = [];
        function refreshBuilt() {
          built.innerHTML = '';
          order.forEach(function (idx) {
            const chip = el('span', 'chip chip-placed', item.tokens[idx]);
            chip.addEventListener('click', function () {
              order = order.filter(function (i) { return i !== idx; });
              refreshBuilt(); refreshBank();
            });
            built.appendChild(chip);
          });
        }
        function refreshBank() {
          bank.innerHTML = '';
          item.tokens.forEach(function (tok, idx) {
            if (order.indexOf(idx) !== -1) return;
            const chip = el('span', 'chip chip-pickable', tok);
            chip.addEventListener('click', function () { order.push(idx); refreshBuilt(); refreshBank(); });
            bank.appendChild(chip);
          });
        }
        refreshBuilt(); refreshBank();
        itemBox.appendChild(built); itemBox.appendChild(bank);
        const resultSlot = el('span', 'result-slot');
        const checkBtn = el('button', 'btn-check', 'Check'); checkBtn.type = 'button';
        checkBtn.addEventListener('click', function () {
          const builtStr = order.map(function (i) { return item.tokens[i]; }).join(' ');
          const ok = norm(builtStr) === norm(item.answer);
          resultSlot.innerHTML = '';
          resultSlot.appendChild(checkRow(ok));
          if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + item.answer + ')'));
          tracker.set(itemIdx, ok);
        });
        itemBox.appendChild(checkBtn); itemBox.appendChild(resultSlot);
        box.appendChild(itemBox);
      });
      if (items.length) appendSubmitAndRing(box, tracker);
      return box;
    }

    function renderFillBlanksText(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const inputs = [];
      (ex.lines || []).forEach(function (line) {
        const row = el('div', 'turn dialogue-fill-line');
        if (line.speaker) row.appendChild(el('span', 'turn-speaker', line.speaker + ':'));
        const textSpan = el('span', 'turn-text');
        (line.parts || []).forEach(function (part) {
          if (typeof part === 'string') {
            textSpan.appendChild(document.createTextNode(part));
          } else if (part && part.blank) {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'blank-input fill-blank-input';
            const accepted = Array.isArray(part.blank) ? part.blank : [part.blank];
            inputs.push({ input: input, accepted: accepted });
            textSpan.appendChild(input);
          }
        });
        row.appendChild(textSpan);
        box.appendChild(row);
      });
      const tracker = trackQuizState(inputs.length);
      const resultsRing = inputs.length ? createResultsRingReveal(tracker) : null;
      const submitBtn = el('button', 'btn-check', 'Submit'); submitBtn.type = 'button';
      submitBtn.addEventListener('click', function () {
        inputs.forEach(function (pair, idx) {
          const inp = pair.input;
          const val = norm(inp.value);
          const ok = !!inp.value.trim() && pair.accepted.some(function (a) { return norm(a) === val; });
          inp.classList.toggle('select-wrong', !ok);
          inp.classList.toggle('select-ok', ok);
          inp.disabled = true;
          tracker.set(idx, ok);
        });
        submitBtn.disabled = true;
        if (resultsRing) resultsRing.finish();
      });
      box.appendChild(submitBtn);
      if (resultsRing) box.appendChild(resultsRing.ringEl);
      return box;

    function renderNumberFillItem(item, withAudio, onResult) {
      const wrap = el('div', 'text-answer-item number-fill-item');
      if (withAudio) {
        const row = el('div', 'listen-row');
        if (item.audio) row.appendChild(playBtn(item.audio));
        row.appendChild(el('span', 'match-prompt', item.context));
        wrap.appendChild(row);
      } else {
        wrap.appendChild(el('p', 'match-prompt', item.prompt));
      }
      const display = el('div', 'number-display', '—');
      wrap.appendChild(display);
      let val = '';
      function updateDisplay() { display.textContent = val || '—'; }
      const pad = renderKeypad(
        function (d) { val += d; updateDisplay(); },
        function () { val = val.slice(0, -1); updateDisplay(); }
      );
      wrap.appendChild(pad);
      const resultSlot = el('span', 'result-slot');
      const checkBtn = el('button', 'btn-check', 'Submit'); checkBtn.type = 'button';
      let locked = false;
      checkBtn.addEventListener('click', function () {
        if (locked) return;
        locked = true;
        const ok = val.replace(/\D/g, '') === String(item.answer).replace(/\D/g, '');
        resultSlot.innerHTML = '';
        resultSlot.appendChild(checkRow(ok));
        if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + item.answer + ')'));
        checkBtn.disabled = true;
        pad.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
        if (onResult) onResult(ok);
      });
      wrap.appendChild(checkBtn); wrap.appendChild(resultSlot);
      return wrap;

    function renderDialogueOrder(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const turns = ex.turns || [];
      function turnLabel(t) { return t.speaker + ': ' + t.text; }

      box.appendChild(el('p', 'ex-instruction', 'Your order:'));
      const built = el('div', 'dialogue-order-built');
      box.appendChild(built);
      box.appendChild(el('p', 'ex-instruction', 'Tap in the correct order:'));
      const bank = el('div', 'dialogue-order-bank');
      box.appendChild(bank);

      let order = [];
      const shuffled = shuffle(turns.map(function (_, i) { return i; }));

      function refreshBuilt() {
        built.innerHTML = '';
        order.forEach(function (idx, pos) {
          const row = el('div', 'dialogue-order-item placed');
          row.appendChild(el('span', 'order-num', String(pos + 1) + '.'));
          row.appendChild(el('span', 'order-text', turnLabel(turns[idx])));
          row.addEventListener('click', function () {
            order = order.filter(function (i) { return i !== idx; });
            refreshBuilt(); refreshBank();
          });
          built.appendChild(row);
        });
      }
      function refreshBank() {
        bank.innerHTML = '';
        shuffled.forEach(function (idx) {
          if (order.indexOf(idx) !== -1) return;
          const row = el('div', 'dialogue-order-item pickable');
          row.appendChild(el('span', 'order-text', turnLabel(turns[idx])));
          row.addEventListener('click', function () { order.push(idx); refreshBuilt(); refreshBank(); });
          bank.appendChild(row);
        });
      }
      refreshBuilt(); refreshBank();

      const resultSlot = el('span', 'result-slot');
      const checkBtn = el('button', 'btn-check', 'Check'); checkBtn.type = 'button';
      const tracker = trackQuizState(1);
      checkBtn.addEventListener('click', function () {
        if (!order.length) return;
        const ok = order.length === turns.length && order.every(function (idx, pos) { return idx === pos; });
        resultSlot.innerHTML = '';
        resultSlot.appendChild(checkRow(ok));
        tracker.set(0, ok);
      });
      box.appendChild(checkBtn);
      box.appendChild(resultSlot);
      if (turns.length) appendSubmitAndRing(box, tracker);
      return box;
    }

      ];
      counts.forEach(function (c) {
        wrap.appendChild(el('span', 'meta-badge', c[0] + ' ' + c[1]));
      });
    }

    // ---------- Tiến độ học (lưu localStorage, dùng cho thanh progress ở trang danh sách bài) ----------
    const progressKey = 'progress:' + level + ':' + itemId;
    let progressCounter = 0;
    let progressState = { total: 0, done: {} };
    try {
      const saved = JSON.parse(localStorage.getItem(progressKey) || 'null');
      if (saved && typeof saved === 'object') progressState.done = saved.done || {};
    } catch (e) {}
    function saveProgress() {
      try { localStorage.setItem(progressKey, JSON.stringify(progressState)); } catch (e) {}
    }
    function nextProgressKey(explicitKey) {
      const k = explicitKey || ('ex' + progressCounter);
      progressCounter++;
      if (progressState.total < progressCounter) progressState.total = progressCounter;
      return k;
    }
    function markProgressDone(key) {
      if (progressState.done[key]) return;
      progressState.done[key] = true;
      saveProgress();
    }

    // ---------- Load ----------
    (async function () {
      $backLink.href = 'lessons.html?level=' + encodeURIComponent(level);

      try {
        const res = await fetch(level + '/items/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();

        document.title = (item.title || itemId) + ' — hoc voi hanh';
        $title.textContent = 'Bài ' + (item.num != null ? item.num : '') + (item.title ? ': ' + item.title : '');

        renderMetaBadges(item);
        renderVocabTab(item);
        renderGrammarTab(item);
        renderListeningTab(item);
        renderReadingTab(item);
        saveProgress();
      } catch (err) {
        console.error(err);
        $title.textContent = 'Could not load the lesson';
        document.getElementById('panel-vocab').innerHTML = '<p class="note">Lesson file not found. Check the path <code>' + level + '/items/' + itemId + '.json</code>.</p>';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>
</body>
</html>
