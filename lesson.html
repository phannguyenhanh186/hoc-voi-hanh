<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài học — hoc voi hanh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <nav class="navbar">
        <a class="brand" href="index.html">hoc voi hanh</a>
        <div class="nav-right">
          <a class="back-link" id="back-link" href="lessons.html">← quay lại</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="lesson-head">
      <div class="meta-badges" id="meta-badges"></div>
      <h1 id="title">Đang tải…</h1>
    </div>

    <div class="toolbar">
      <div class="tabs tabs-6" id="tabs">
        <button class="tab-btn active" data-tab="vocab">Từ vựng</button>
        <button class="tab-btn" data-tab="grammar">Ngữ pháp</button>
        <button class="tab-btn" data-tab="listening">Nghe</button>
        <button class="tab-btn" data-tab="reading">Đọc</button>
        <button class="tab-btn" data-tab="preclass">Chuẩn bị</button>
        <button class="tab-btn" data-tab="postclass">Ôn tập</button>
      </div>
    </div>

    <section class="tab-panel" id="panel-vocab"><p class="note">Đang tải…</p></section>
    <section class="tab-panel" id="panel-grammar" hidden><p class="note">Đang tải…</p></section>
    <section class="tab-panel" id="panel-listening" hidden><p class="note">Đang tải…</p></section>
    <section class="tab-panel" id="panel-reading" hidden><p class="note">Đang tải…</p></section>
    <section class="tab-panel" id="panel-preclass" hidden><p class="note">Đang tải…</p></section>
    <section class="tab-panel" id="panel-postclass" hidden><p class="note">Đang tải…</p></section>
  </main>

  <footer class="footer"><div class="wrap">hoc voi hanh · học đi đôi với hành</div></footer>

  <script>
    const params = new URLSearchParams(location.search);
    const itemId = params.get('id') || '';
    let level = params.get('level') || 'mam';

    const $title = document.getElementById('title');
    const $backLink = document.getElementById('back-link');
    const $tabs = document.getElementById('tabs');
    const PANELS = ['vocab', 'grammar', 'listening', 'reading', 'preclass', 'postclass'];

    let voice = 'nam';
    try { voice = localStorage.getItem('voice') || 'nam'; } catch (e) {}
    function resolveAudio(path) { return (path || '').replace('{voice}', voice); }

    let player = new Audio();
    player.preload = 'auto';
    let currentEl = null;
    player.addEventListener('ended', function () { if (currentEl) currentEl.classList.remove('playing'); });
    function play(src, elm) {
      if (!src) return;
      if (currentEl) currentEl.classList.remove('playing');
      currentEl = elm || null;
      if (currentEl) currentEl.classList.add('playing');
      try { player.pause(); } catch (e) {}
      player.src = src;
      try { player.currentTime = 0; } catch (e) {}
      const pr = player.play();
      if (pr && pr.catch) pr.catch(function (e) {
        if (currentEl) currentEl.classList.remove('playing');
        console.warn('Không phát được audio:', src, e && e.message);
      });
    }

    function el(tag, cls, txt) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (txt != null) n.textContent = txt;
      return n;
    }
    function playBtn(src) {
      const b = el('button', 'play-sentence');
      b.type = 'button';
      b.setAttribute('aria-label', 'Phát audio');
      b.innerHTML = '▶';
      if (src) { b.addEventListener('click', function () { play(resolveAudio(src), b); }); }
      else { b.disabled = true; }
      return b;
    }
    function norm(s) {
      return (s || '')
        .toString().trim().toLowerCase()
        .normalize('NFC')
        .replace(/[.,!?;:"'“”]/g, '')
        .replace(/\s+/g, ' ');
    }
    function emptyNote(text) { return el('p', 'note', text); }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    }

    // ---------- Tabs ----------
    $tabs.addEventListener('click', function (e) {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('#tabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      PANELS.forEach(function (p) { document.getElementById('panel-' + p).hidden = (p !== tab); });
    });

    // ========================================================
    // TỪ VỰNG — Danh sách / Flashcards / Trắc nghiệm
    // ========================================================
    function savedKey(w) { return 'saved:' + level + ':' + itemId + ':' + w.id; }
    function isSaved(w) { try { return localStorage.getItem(savedKey(w)) === '1'; } catch (e) { return false; } }
    function toggleSaved(w, starEl) {
      try {
        const now = !isSaved(w);
        localStorage.setItem(savedKey(w), now ? '1' : '0');
        starEl.classList.toggle('starred', now);
      } catch (e) {}
    }

    function renderVocabList(items) {
      const wrap = el('div', 'vocab-list');
      items.forEach(function (w, i) {
        const row = el('div', 'vocab-row');
        row.appendChild(el('span', 'vocab-idx', String(i + 1) + '.'));
        const main = el('div', 'vocab-row-main');
        main.appendChild(el('span', 'vocab-row-word', w.word));
        if (w.ipa) main.appendChild(el('span', 'vocab-row-ipa', w.ipa));
        main.appendChild(el('span', 'vocab-row-sep', '—'));
        main.appendChild(el('span', 'vocab-row-meaning', w.meaning));
        row.appendChild(main);
        const actions = el('div', 'vocab-row-actions');
        const star = el('button', 'icon-btn star-btn' + (isSaved(w) ? ' starred' : ''));
        star.type = 'button'; star.innerHTML = '★'; star.setAttribute('aria-label', 'Lưu từ');
        star.addEventListener('click', function () { toggleSaved(w, star); });
        actions.appendChild(star);
        actions.appendChild(playBtn(w.audio));
        row.appendChild(actions);
        wrap.appendChild(row);
      });
      return wrap;
    }

    function renderVocabFlashcards(items) {
      const wrap = el('div', 'flash-wrap');
      let i = 0, flipped = false;
      const card = el('div', 'flash-card');
      const progress = el('div', 'flash-progress');
      function draw() {
        flipped = false;
        card.classList.remove('flipped');
        const w = items[i];
        card.innerHTML = '';
        const front = el('div', 'flash-face flash-front', w.word);
        const back = el('div', 'flash-face flash-back');
        if (w.ipa) back.appendChild(el('div', 'flash-ipa', w.ipa));
        back.appendChild(el('div', 'flash-meaning', w.meaning));
        card.appendChild(front); card.appendChild(back);
        progress.textContent = (i + 1) + ' / ' + items.length;
      }
      card.addEventListener('click', function () {
        flipped = !flipped;
        card.classList.toggle('flipped', flipped);
        if (flipped) play(resolveAudio(items[i].audio));
      });
      const nav = el('div', 'flash-nav');
      const prev = el('button', 'btn-check btn-secondary', '← Trước');
      const next = el('button', 'btn-check', 'Tiếp →');
      prev.type = 'button'; next.type = 'button';
      prev.addEventListener('click', function () { i = (i - 1 + items.length) % items.length; draw(); });
      next.addEventListener('click', function () { i = (i + 1) % items.length; draw(); });
      draw();
      wrap.appendChild(progress);
      wrap.appendChild(card);
      wrap.appendChild(el('p', 'ex-instruction', 'Bấm vào thẻ để lật xem nghĩa (tự phát âm khi lật).'));
      nav.appendChild(prev); nav.appendChild(next);
      wrap.appendChild(nav);
      return wrap;
    }

    function renderVocabQuiz(items) {
      const wrap = el('div', 'quiz-wrap');
      const order = shuffle(items);
      let i = 0, correct = 0, answered = false;
      const body = el('div', 'quiz-body');
      const foot = el('div', 'quiz-foot');
      function nextQuestion() {
        answered = false;
        body.innerHTML = '';
        if (i >= order.length) {
          body.appendChild(el('p', 'quiz-score', 'Xong! Đúng ' + correct + '/' + order.length + ' câu.'));
          const retry = el('button', 'btn-check', 'Làm lại');
          retry.type = 'button';
          retry.addEventListener('click', function () { i = 0; correct = 0; nextQuestion(); });
          body.appendChild(retry);
          foot.textContent = '';
          return;
        }
        const w = order[i];
        foot.textContent = 'Câu ' + (i + 1) + '/' + order.length;
        const qHead = el('div', 'quiz-q-head');
        qHead.appendChild(el('span', 'quiz-word', w.word));
        qHead.appendChild(playBtn(w.audio));
        body.appendChild(qHead);
        if (w.ipa) body.appendChild(el('p', 'vocab-row-ipa', w.ipa));

        const distractors = shuffle(items.filter(function (x) { return x.id !== w.id; })).slice(0, 3);
        const options = shuffle([w].concat(distractors));
        const optWrap = el('div', 'quiz-options');
        options.forEach(function (opt) {
          const btn = el('button', 'quiz-option', opt.meaning);
          btn.type = 'button';
          btn.addEventListener('click', function () {
            if (answered) return;
            answered = true;
            const ok = opt.id === w.id;
            btn.classList.add(ok ? 'opt-correct' : 'opt-wrong');
            if (!ok) {
              Array.from(optWrap.children).forEach(function (c) {
                if (c.textContent === w.meaning) c.classList.add('opt-correct');
              });
            } else { correct++; }
            const nextBtn = el('button', 'btn-check', i + 1 >= order.length ? 'Xem kết quả →' : 'Câu tiếp →');
            nextBtn.type = 'button';
            nextBtn.style.marginTop = '14px';
            nextBtn.addEventListener('click', function () { i++; nextQuestion(); });
            body.appendChild(nextBtn);
          });
          optWrap.appendChild(btn);
        });
        body.appendChild(optWrap);
      }
      nextQuestion();
      wrap.appendChild(foot);
      wrap.appendChild(body);
      return wrap;
    }

    function renderVocabTab(item) {
      const panel = document.getElementById('panel-vocab');
      panel.innerHTML = '';
      const items = (item.vocab && item.vocab.items) || [];
      if (!items.length) { panel.appendChild(emptyNote('Từ vựng đang được cập nhật.')); return; }

      const modeBar = el('div', 'mode-bar');
      const modes = [['list', 'Danh sách'], ['flashcards', 'Flashcards'], ['quiz', 'Trắc nghiệm']];
      const content = el('div', 'vocab-content');
      let activeMode = 'list';
      function draw() {
        content.innerHTML = '';
        if (activeMode === 'list') content.appendChild(renderVocabList(items));
        else if (activeMode === 'flashcards') content.appendChild(renderVocabFlashcards(items));
        else content.appendChild(renderVocabQuiz(items));
      }
      modes.forEach(function (m) {
        const b = el('button', 'mode-btn' + (m[0] === activeMode ? ' active' : ''), m[1]);
        b.type = 'button';
        b.addEventListener('click', function () {
          activeMode = m[0];
          modeBar.querySelectorAll('.mode-btn').forEach(function (x) { x.classList.remove('active'); });
          b.classList.add('active');
          draw();
        });
        modeBar.appendChild(b);
      });
      panel.appendChild(modeBar);
      panel.appendChild(content);
      draw();
    }

    // ========================================================
    // NGỮ PHÁP
    // ========================================================
    function renderGrammarTab(item) {
      const panel = document.getElementById('panel-grammar');
      panel.innerHTML = '';
      const points = (item.grammar && item.grammar.points) || [];
      if (!points.length) { panel.appendChild(emptyNote('Ngữ pháp đang được cập nhật.')); return; }
      points.forEach(function (g) {
        const box = el('div', 'exercise');
        const headRow = el('div', 'grammar-head');
        headRow.appendChild(el('h3', 'ex-title', g.title));
        if (g.refInput) {
          const a = document.createElement('a');
          a.className = 'chip chip-link';
          a.href = 'input.html?id=' + encodeURIComponent(g.refInput) + '&level=' + encodeURIComponent(level);
          a.textContent = 'Xem chi tiết →';
          headRow.appendChild(a);
        }
        box.appendChild(headRow);
        if (g.explanation) box.appendChild(el('p', 'ex-instruction', g.explanation));
        (g.examples || []).forEach(function (ex) {
          const row = el('div', 'turn');
          row.appendChild(el('span', 'turn-text', ex));
          box.appendChild(row);
        });
        panel.appendChild(box);
      });
    }

    // ========================================================
    // NGHE
    // ========================================================
    // ---------- Stepper dùng chung: hiện từng bước một, Tiếp mới qua bước sau ----------
    function buildStepper(container, steps, renderStepFn, opts) {
      opts = opts || {};
      let i = 0;
      const stage = el('div', opts.stageClass || '');
      const dots = el('div', 'step-dots');
      const nav = el('div', 'step-nav');
      container.appendChild(stage);
      container.appendChild(dots);
      container.appendChild(nav);

      function draw() {
        stage.innerHTML = '';
        stage.appendChild(renderStepFn(steps[i], i));

        dots.innerHTML = '';
        steps.forEach(function (_, idx) { dots.appendChild(el('span', 'step-dot' + (idx === i ? ' active' : ''))); });

        nav.innerHTML = '';
        const isLast = i >= steps.length - 1;
        const prev = el('button', 'btn-check btn-secondary', '← Trước'); prev.type = 'button';
        prev.style.visibility = i === 0 ? 'hidden' : 'visible';
        prev.addEventListener('click', function () { i--; draw(); });
        const next = el('button', 'btn-check', isLast ? (opts.lastLabel || 'Hoàn tất ✓') : 'Tiếp →'); next.type = 'button';
        next.addEventListener('click', function () {
          if (!isLast) { i++; draw(); }
          else if (opts.onFinish) { opts.onFinish(); }
        });
        nav.appendChild(prev); nav.appendChild(next);
      }
      draw();
    }

    function renderDictationLine(line) {
      const wrap = el('div', 'dictation-item');
      const row = el('div', 'listen-row');
      row.appendChild(playBtn(line.audio));
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'blank-input dictation-input';
      input.placeholder = 'Gõ câu bạn nghe được…';
      row.appendChild(input);
      const resultSlot = el('span', 'result-slot');
      const checkBtn = el('button', 'btn-check', 'Kiểm tra');
      checkBtn.type = 'button';
      checkBtn.addEventListener('click', function () {
        const ok = norm(input.value) === norm(line.text);
        resultSlot.innerHTML = '';
        resultSlot.appendChild(checkRow(ok));
        if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + line.text + ')'));
      });
      row.appendChild(checkBtn);
      row.appendChild(resultSlot);
      wrap.appendChild(row);
      const bankWords = line.wordBank || [];
      if (bankWords.length) {
        const bank = el('div', 'scramble-bank');
        bankWords.forEach(function (w) {
          const chip = el('span', 'chip chip-pickable', w);
          chip.addEventListener('click', function () {
            input.value = (input.value ? input.value + ' ' : '') + w;
            input.focus();
          });
          bank.appendChild(chip);
        });
        wrap.appendChild(bank);
      }
      return wrap;
    }

    function renderListeningTab(item) {
      const panel = document.getElementById('panel-listening');
      panel.innerHTML = '';
      const listening = item.listening || {};
      const groups = listening.groups || [];
      const entries = listening.items || [];
      const numberFill = listening.numberFill;
      const hasNumberFill = numberFill && numberFill.items && numberFill.items.length;
      const dialogueFill = listening.dialogueFill;
      const hasDialogueFill = dialogueFill && dialogueFill.lines && dialogueFill.lines.length;
      if (!groups.length && !entries.length && !hasNumberFill && !hasDialogueFill) { panel.appendChild(emptyNote('Bài nghe đang được cập nhật.')); return; }
      if (listening.instruction) panel.appendChild(el('p', 'note', listening.instruction));

      // Điền từ vào chỗ trống (word bank)
      if (hasDialogueFill) {
        panel.appendChild(renderDialogueFill(Object.assign({ title: 'Điền từ vào chỗ trống' }, dialogueFill)));
      }

      // Điền số vào chỗ trống bằng bàn phím số
      if (hasNumberFill) {
        panel.appendChild(renderNumberFillListening(numberFill));
      }

      // Kiểu mới: chép chính tả theo từng đoạn hội thoại, có word bank — hiện từng đoạn 1, xong mới qua đoạn sau
      if (groups.length) {
        const wrap = el('div', 'exercise');
        buildStepper(wrap, groups, function (g, gi) {
          const box = el('div');
          box.appendChild(el('h3', 'ex-title', g.title || ('Đoạn hội thoại ' + (gi + 1))));
          (g.lines || []).forEach(function (line) { box.appendChild(renderDictationLine(line)); });
          return box;
        }, { lastLabel: 'Xong bài nghe 🎉' });
        panel.appendChild(wrap);
      }

      // Kiểu cũ: danh sách audio + transcript đơn giản (vẫn hỗ trợ để không hỏng bài cũ)
      if (entries.length) {
        const box = el('div', 'exercise');
        entries.forEach(function (it, i) {
          const row = el('div', 'listen-row');
          row.appendChild(playBtn(it.audio));
          row.appendChild(el('span', 'match-prompt', it.title || ('Đoạn ' + (i + 1))));
          if (it.transcript) row.appendChild(el('span', 'order-label', it.transcript));
          box.appendChild(row);
        });
        panel.appendChild(box);
      }
    }

    // ========================================================
    // ĐỌC
    // ========================================================
    function renderReadingTab(item) {
      const panel = document.getElementById('panel-reading');
      panel.innerHTML = '';
      const passages = (item.reading && item.reading.passages) || [];
      if (!passages.length) { panel.appendChild(emptyNote('Bài đọc đang được cập nhật.')); return; }
      passages.forEach(function (p) {
        const box = el('div', 'exercise reading-passage');
        const head = el('div', 'dialogue-head');
        if (p.audio) head.appendChild(playBtn(p.audio));
        head.appendChild(el('h3', 'ex-title', p.title || ''));
        box.appendChild(head);
        (String(p.text || '').split(/\n+/)).forEach(function (para) {
          if (para.trim()) box.appendChild(el('p', 'reading-para', para.trim()));
        });
        panel.appendChild(box);
        if (p.questions && p.questions.length) {
          panel.appendChild(renderChoiceQuiz({ title: 'Câu hỏi', items: p.questions }));
        }
        if (p.fillBlanks && p.fillBlanks.lines && p.fillBlanks.lines.length) {
          panel.appendChild(renderFillBlanksText(Object.assign({ title: 'Điền vào chỗ trống' }, p.fillBlanks)));
        }
      });
    }

    // ========================================================
    // CHUẨN BỊ (pre-class)
    // ========================================================
    function renderProfessionsFlow(vp, im, rq) {
      const wrapper = el('div', 'profession-flow');
      const stage = el('div', 'exercise');
      wrapper.appendChild(stage);

      let i = 0;
      const items = (vp && vp.items) || [];

      function drawPreview() {
        stage.innerHTML = '';
        stage.appendChild(el('h3', 'ex-title', 'Từ vựng có hình'));
        if (vp.instruction) stage.appendChild(el('p', 'ex-instruction', vp.instruction));

        const it = items[i];
        const card = el('div', 'preview-card');
        const img = document.createElement('img');
        img.src = it.image; img.alt = it.word; img.className = 'preview-img';
        card.appendChild(img);
        const wordRow = el('div', 'preview-word-row');
        wordRow.appendChild(el('span', 'preview-word', it.word));
        wordRow.appendChild(playBtn(it.audio));
        card.appendChild(wordRow);
        stage.appendChild(card);

        const dots = el('div', 'step-dots');
        items.forEach(function (_, idx) { dots.appendChild(el('span', 'step-dot' + (idx === i ? ' active' : ''))); });
        stage.appendChild(dots);

        const nav = el('div', 'step-nav');
        const prev = el('button', 'btn-check btn-secondary', '← Trước'); prev.type = 'button';
        prev.style.visibility = i === 0 ? 'hidden' : 'visible';
        prev.addEventListener('click', function () { i--; drawPreview(); });
        const isLast = i >= items.length - 1;
        const next = el('button', 'btn-check', (isLast && im) ? 'Bắt đầu kiểm tra →' : 'Tiếp →'); next.type = 'button';
        next.addEventListener('click', function () {
          if (!isLast) { i++; drawPreview(); }
          else if (im) { drawQuiz(); }
        });
        nav.appendChild(prev); nav.appendChild(next);
        stage.appendChild(nav);
      }

      function drawQuiz() {
        stage.innerHTML = '';
        stage.appendChild(renderImageMatch(im));
        if (rq) {
          const nav = el('div', 'step-nav');
          const back = el('button', 'btn-check btn-secondary', '← Trước'); back.type = 'button';
          back.addEventListener('click', function () { drawPreview(); });
          const next = el('button', 'btn-check', 'Tiếp →'); next.type = 'button';
          next.addEventListener('click', function () { drawReasoning(); });
          nav.appendChild(back); nav.appendChild(next);
          stage.appendChild(nav);
        }
      }

      function drawReasoning() {
        stage.innerHTML = '';
        stage.appendChild(renderReasoningQuiz(rq));
        const nav = el('div', 'step-nav');
        const back = el('button', 'btn-check btn-secondary', '← Trước'); back.type = 'button';
        back.addEventListener('click', function () { drawQuiz(); });
        nav.appendChild(back);
        stage.appendChild(nav);
      }

      if (items.length) drawPreview();
      else if (im) drawQuiz();
      else if (rq) drawReasoning();
      return wrapper;
    }

    function renderVocabPreview(vp) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', 'Từ vựng có hình'));
      if (vp.instruction) box.appendChild(el('p', 'ex-instruction', vp.instruction));
      const grid = el('div', 'image-vocab-grid');
      (vp.items || []).forEach(function (it) {
        const card = el('div', 'image-vocab-card');
        const img = document.createElement('img');
        img.src = it.image; img.alt = it.word; img.className = 'image-vocab-img';
        card.appendChild(img);
        card.appendChild(el('div', 'image-vocab-word', it.word));
        grid.appendChild(card);
      });
      box.appendChild(grid);
      return box;
    }

    function renderImageMatch(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const rows = [];
      (ex.items || []).forEach(function (it) {
        const row = el('div', 'match-row image-match-row');
        const img = document.createElement('img');
        img.src = it.image; img.alt = ''; img.className = 'match-img';
        row.appendChild(img);
        const select = document.createElement('select');
        select.className = 'answer-select';
        const optEmpty = el('option', null, '— chọn —'); optEmpty.value = ''; select.appendChild(optEmpty);

    function renderPreClassFlow(flow) {
      const wrapper = el('div', 'profession-flow');
      if (flow.title) wrapper.appendChild(el('h2', 'preflow-title', flow.title));
      const stage = el('div', 'exercise');
      wrapper.appendChild(stage);

      let i = 0;
      const vp = flow.vocabPreview || {};
      const items = vp.items || [];
      const quiz = flow.quiz;

      function drawPreview() {
        stage.innerHTML = '';
        stage.appendChild(el('h3', 'ex-title', 'Từ vựng có hình'));
        if (vp.instruction) stage.appendChild(el('p', 'ex-instruction', vp.instruction));

        const it = items[i];
        const card = el('div', 'preview-card');
        if (it.image) {
          const img = document.createElement('img');
          img.src = it.image; img.alt = it.word; img.className = 'preview-img';
          card.appendChild(img);
        } else if (it.number) {
          card.appendChild(el('div', 'preview-number', it.number));
        }
        const wordRow = el('div', 'preview-word-row');
        wordRow.appendChild(el('span', 'preview-word', it.word));
        wordRow.appendChild(playBtn(it.audio));
        card.appendChild(wordRow);
        stage.appendChild(card);

        const dots = el('div', 'step-dots');
        items.forEach(function (_, idx) { dots.appendChild(el('span', 'step-dot' + (idx === i ? ' active' : ''))); });
        stage.appendChild(dots);

        const nav = el('div', 'step-nav');
        const prev = el('button', 'btn-check btn-secondary', '← Trước'); prev.type = 'button';
        prev.style.visibility = i === 0 ? 'hidden' : 'visible';
        prev.addEventListener('click', function () { i--; drawPreview(); });
        const isLast = i >= items.length - 1;
        const label = (isLast && quiz) ? 'Bắt đầu kiểm tra →' : (isLast ? 'Hoàn tất ✓' : 'Tiếp →');
        const next = el('button', 'btn-check', label); next.type = 'button';
        if (isLast && !quiz) next.disabled = true;
        next.addEventListener('click', function () {
          if (!isLast) { i++; drawPreview(); }
          else if (quiz) { drawQuiz(); }
        });
        nav.appendChild(prev); nav.appendChild(next);
        stage.appendChild(nav);
      }

      function drawQuiz() {
        stage.innerHTML = '';
        stage.appendChild(quiz.type === 'text_answer' ? renderTextAnswer(quiz) : renderChoiceQuiz(quiz));
        if (items.length) {
          const nav = el('div', 'step-nav');
          const back = el('button', 'btn-check btn-secondary', '← Xem lại từ vựng'); back.type = 'button';
          back.addEventListener('click', function () { i = 0; drawPreview(); });
          nav.appendChild(back);
          stage.appendChild(nav);
        }
      }

      if (items.length) drawPreview();
      else if (quiz) drawQuiz();
      return wrapper;
    }

    function renderSort(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      let selectedChip = null;

      const chipEls = {};
      ex.wordBank.forEach(function (w) {
        const chip = el('span', 'chip chip-pickable', w);
        chip.addEventListener('click', function () {
          if (chip.classList.contains('chip-used')) return;
          if (selectedChip) selectedChip.classList.remove('chip-selected');
          selectedChip = chip;
          chip.classList.add('chip-selected');
        });
        chipEls[w] = chip;
        bank.appendChild(chip);
      });
      box.appendChild(bank);
      const catsWrap = el('div', 'sort-cats');
      (ex.categories || []).forEach(function (cat) {
        const catBox = el('div', 'sort-cat');

        const dropZone = el('div', 'sort-dropzone');
        catBox.appendChild(dropZone);
        catBox.addEventListener('click', function () {
          if (!selectedChip) return;
          const word = selectedChip.textContent;
          selectedChip.classList.add('chip-used');
          selectedChip.classList.remove('chip-selected');
          assignment[word] = cat.id;
          dropZone.appendChild(el('span', 'chip chip-placed', word));
          selectedChip = null;
        });

      });
      box.appendChild(catsWrap);
      const resetBtn = el('button', 'btn-check btn-secondary', 'Làm lại'); resetBtn.type = 'button';

        Object.keys(assignment).forEach(function (k) { delete assignment[k]; });
        catsWrap.querySelectorAll('.sort-dropzone').forEach(function (z) { z.innerHTML = ''; });
        Object.values(chipEls).forEach(function (c) { c.classList.remove('chip-used', 'chip-selected'); });

      checkBtn.addEventListener('click', function () {

        (ex.categories || []).forEach(function (cat) {
          (cat.answers || []).forEach(function (w) { total++; if (assignment[w] === cat.id) correct++; });
        });
        resultLine.textContent = 'Đúng ' + correct + '/' + total + '.';
      });
      box.appendChild(checkBtn); box.appendChild(resetBtn); box.appendChild(resultLine);
      return box;
    }

    function renderScramble(ex) {
      const box = el('div', 'exercise');

      (ex.items || []).forEach(function (item) {

        itemBox.appendChild(el('p', 'match-prompt', item.prompt));
        const built = el('div', 'scramble-built');
        const bank = el('div', 'scramble-bank');
        let order = [];
        function refreshBuilt() {
          built.innerHTML = '';
          order.forEach(function (idx) {
            const chip = el('span', 'chip chip-placed', item.tokens[idx]);
            chip.addEventListener('click', function () {
              order = order.filter(function (i) { return i !== idx; });
              refreshBuilt(); refreshBank();
            });
            built.appendChild(chip);
          });
        }
        function refreshBank() {
          bank.innerHTML = '';
          item.tokens.forEach(function (tok, idx) {
            if (order.indexOf(idx) !== -1) return;
            const chip = el('span', 'chip chip-pickable', tok);
            chip.addEventListener('click', function () { order.push(idx); refreshBuilt(); refreshBank(); });
            bank.appendChild(chip);
          });
        }
        refreshBuilt(); refreshBank();
        itemBox.appendChild(built); itemBox.appendChild(bank);
        const resultSlot = el('span', 'result-slot');
        const checkBtn = el('button', 'btn-check', 'Kiểm tra'); checkBtn.type = 'button';
        checkBtn.addEventListener('click', function () {
          const builtStr = order.map(function (i) { return item.tokens[i]; }).join(' ');
          const ok = norm(builtStr) === norm(item.answer);
          resultSlot.innerHTML = '';
          resultSlot.appendChild(checkRow(ok));
          if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + item.answer + ')'));
        });
        itemBox.appendChild(checkBtn); itemBox.appendChild(resultSlot);
        box.appendChild(itemBox);
      });

    function renderNumberFillListening(nf) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', nf.title || 'Điền số vào chỗ trống'));
      if (nf.instruction) box.appendChild(el('p', 'ex-instruction', nf.instruction));
      (nf.items || []).forEach(function (item) { box.appendChild(renderNumberFillItem(item, true)); });
      return box;
    }

    function renderNumberFillExercise(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      (ex.items || []).forEach(function (item) { box.appendChild(renderNumberFillItem(item, false)); });
      return box;
    }

    function renderDialogueOrder(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      const turns = ex.turns || [];
      function turnLabel(t) { return t.speaker + ': ' + t.text; }

      box.appendChild(el('p', 'ex-instruction', 'Đã sắp xếp:'));
      const built = el('div', 'dialogue-order-built');
      box.appendChild(built);
      box.appendChild(el('p', 'ex-instruction', 'Bấm theo đúng thứ tự:'));
      const bank = el('div', 'dialogue-order-bank');
      box.appendChild(bank);

      let order = [];
      const shuffled = shuffle(turns.map(function (_, i) { return i; }));

      function refreshBuilt() {
        built.innerHTML = '';
        order.forEach(function (idx, pos) {
          const row = el('div', 'dialogue-order-item placed');
          row.appendChild(el('span', 'order-num', String(pos + 1) + '.'));
          row.appendChild(el('span', 'order-text', turnLabel(turns[idx])));
          row.addEventListener('click', function () {
            order = order.filter(function (i) { return i !== idx; });
            refreshBuilt(); refreshBank();
          });
          built.appendChild(row);
        });
      }
      function refreshBank() {
        bank.innerHTML = '';
        shuffled.forEach(function (idx) {
          if (order.indexOf(idx) !== -1) return;
          const row = el('div', 'dialogue-order-item pickable');
          row.appendChild(el('span', 'order-text', turnLabel(turns[idx])));
          row.addEventListener('click', function () { order.push(idx); refreshBuilt(); refreshBank(); });
          bank.appendChild(row);
        });
      }
      refreshBuilt(); refreshBank();

      const resultSlot = el('span', 'result-slot');
      const checkBtn = el('button', 'btn-check', 'Kiểm tra'); checkBtn.type = 'button';
      checkBtn.addEventListener('click', function () {
        const ok = order.length === turns.length && order.every(function (idx, pos) { return idx === pos; });
        resultSlot.innerHTML = '';
        resultSlot.appendChild(checkRow(ok));
      });
      box.appendChild(checkBtn);
      box.appendChild(resultSlot);
      return box;
    }

    function renderTextAnswer(ex) {
      const box = el('div', 'exercise');
      box.appendChild(el('h3', 'ex-title', ex.title));
      if (ex.instruction) box.appendChild(el('p', 'ex-instruction', ex.instruction));
      var activeInput = null;
      if (ex.wordBank && ex.wordBank.length) {
        const bankRow = el('div', 'scramble-bank');
        ex.wordBank.forEach(function (w) {
          const chip = el('span', 'chip chip-pickable', w);
          chip.addEventListener('click', function () {
            const target = activeInput || box.querySelector('.text-answer-input');
            if (!target) return;
            target.value = (target.value ? target.value + ' ' : '') + w;
            target.focus();
          });
          bankRow.appendChild(chip);
        });
        box.appendChild(bankRow);
      }
      (ex.items || []).forEach(function (item) {
        const row = el('div', 'text-answer-item');
        row.appendChild(el('p', 'match-prompt', item.prompt));
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'blank-input text-answer-input';
        input.placeholder = 'Viết bằng chữ…';
        input.addEventListener('focus', function () { activeInput = input; });
        row.appendChild(input);
        const resultSlot = el('span', 'result-slot');
        const checkBtn = el('button', 'btn-check', 'Kiểm tra'); checkBtn.type = 'button';
        checkBtn.addEventListener('click', function () {
          const ok = norm(input.value) === norm(item.answer);
          resultSlot.innerHTML = '';
          resultSlot.appendChild(checkRow(ok));
          if (!ok) resultSlot.appendChild(el('span', 'correct-hint', ' (' + item.answer + ')'));
        });
        row.appendChild(checkBtn); row.appendChild(resultSlot);
        box.appendChild(row);
      });
      return box;
    }

    const EX_RENDERERS = {
      matching: renderMatching,
      rime_table_fill: renderRimeTableFill,
      sort: renderSort,
      scramble: renderScramble,
      listen_order_fill: renderListenOrderFill,
      choice: renderChoiceQuiz,
      dialogue_fill: renderDialogueFill,
      text_answer: renderTextAnswer,
      number_fill: renderNumberFillExercise,
      dialogue_order: renderDialogueOrder
    };

    function renderPostClassTab(item) {
      const panel = document.getElementById('panel-postclass');
      panel.innerHTML = '';
      const post = item.postClass || {};
      if (post.reviewNote) panel.appendChild(el('p', 'note', post.reviewNote));
      const exercises = post.exercises || [];
      if (!exercises.length) {
        if (!post.reviewNote) panel.appendChild(emptyNote('Bài ôn tập đang được cập nhật.'));
        return;
      }
      const wrap = el('div', 'postclass-wrap');
      buildStepper(wrap, exercises, function (ex) {
        const renderer = EX_RENDERERS[ex.type];
        return renderer ? renderer(ex) : emptyNote('Chưa hỗ trợ loại bài tập: ' + ex.type);
      }, { lastLabel: 'Xong bài ôn tập 🎉' });
      panel.appendChild(wrap);
    }

    // ========================================================
    // Badge số liệu đầu trang
    // ========================================================
    function renderMetaBadges(item) {
      const wrap = document.getElementById('meta-badges');
      wrap.innerHTML = '';
      const counts = [
        ['🔤', ((item.vocab && item.vocab.items) || []).length + ' từ'],
        ['📖', ((item.grammar && item.grammar.points) || []).length + ' ngữ pháp'],
        ['🎧', ((item.listening && item.listening.items) || []).length + ' bài nghe'],
        ['📄', ((item.reading && item.reading.passages) || []).length + ' bài đọc']
      ];
      counts.forEach(function (c) {
        wrap.appendChild(el('span', 'meta-badge', c[0] + ' ' + c[1]));
      });
    }

    // ---------- Load ----------
    (async function () {
      $backLink.href = 'lessons.html?level=' + encodeURIComponent(level);

      try {
        const res = await fetch(level + '/items/' + itemId + '.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const item = await res.json();

        document.title = (item.title || itemId) + ' — hoc voi hanh';
        $title.textContent = 'Bài ' + (item.num != null ? item.num : '') + (item.title ? ': ' + item.title : '');

        renderMetaBadges(item);
        renderVocabTab(item);
        renderGrammarTab(item);
        renderListeningTab(item);
        renderReadingTab(item);
        renderPreClassTab(item);
        renderPostClassTab(item);
      } catch (err) {
        console.error(err);
        $title.textContent = 'Không tải được bài học';
        document.getElementById('panel-vocab').innerHTML = '<p class="note">Không tìm thấy file bài học. Kiểm tra đường dẫn <code>' + level + '/items/' + itemId + '.json</code>.</p>';
      }
    })();

    (function () {
      const hdr = document.querySelector('.site-header');
      if (!hdr) return;
      function setH() { document.documentElement.style.setProperty('--header-h', hdr.offsetHeight + 'px'); }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('load', setH);
    })();
  </script>
  <script src="pomodoro.js" defer></script>
</body>
</html>
